<title>Backrooms Mobile</title>
<style>

</head>

<main aria-label="Backrooms chỉ có giao diện di động">
<iframe id="mobileGameFrame" name="backrooms-mobile"
  title="Backrooms, giao diện điện thoại" src="./index.html?mobileEmbed=1"
