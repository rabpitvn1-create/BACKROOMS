# Installed into Ponytail's separate user-level CODEX_HOME by ponytail.sh.
# Provider settings in project-local .codex/config.toml are ignored by Codex.
model = "occ/claude-opus-5-5"
model_provider = "vilao"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.vilao]
name = "Vilao"
base_url = "https://api.vilao.ai/v1"
env_key = "VILAO_API_KEY"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
