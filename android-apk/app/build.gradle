plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def secret = { name ->
  def value = System.getenv(name) ?: ""
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 72
    versionName '1.1.63.0.7'
    // Native Companion is the default gameplay host on both debug and release.
    // A developer can explicitly opt out for legacy compatibility investigations.
    buildConfigField "boolean", "COMPANION_NATIVE_ENABLED", project.hasProperty("disableNativeCompanion") ? "false" : "true"
    buildConfigField "String", "GEHIHI_API_KEY", "\"" + secret("GEHIHI_API_KEY") + "\""
    buildConfigField "String", "GEHIHI_BASE_URL", "\"" + secret("GEHIHI_BASE_URL") + "\""
    buildConfigField "String", "GEHIHI_MODEL", "\"" + secret("GEHIHI_MODEL") + "\""
    buildConfigField "String", "SOL_API_KEY", "\"" + secret("SOL_API_KEY") + "\""
    buildConfigField "String", "HAKU_API_KEY", "\"" + secret("HAKU_API_KEY") + "\""
    buildConfigField "String", "HAKU_BASE_URL", "\"" + secret("HAKU_BASE_URL") + "\""
    buildConfigField "String", "HAKU_MODEL", "\"" + secret("HAKU_MODEL") + "\""
    buildConfigField "String", "GEMINI_API_KEY_1", "\"" + secret("GEMINI_API_KEY_1") + "\""
    buildConfigField "String", "GEMINI_API_KEY_2", "\"" + secret("GEMINI_API_KEY_2") + "\""
    buildConfigField "String", "GEMINI_API_KEY_3", "\"" + secret("GEMINI_API_KEY_3") + "\""
    buildConfigField "String", "GEMINI_API_KEY_4", "\"" + secret("GEMINI_API_KEY_4") + "\""
    buildConfigField "String", "GEMINI_API_KEY_5", "\"" + secret("GEMINI_API_KEY_5") + "\""
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions { unitTests.returnDefaultValues = true }
}

// Release-chain P0 patches install their default runner above; this explicit test-only
// property overrides it after configuration without changing the default Canon runner.
if (project.hasProperty('companionStorageSmoke')) {
  android.defaultConfig.testInstrumentationRunner = 'com.rabpit.backroom.core.companion.CompanionStorageInstrumentation'
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}

// Every unit-test workflow needs the same final-production compiler candidate.
def compileKnowledgeShadow = tasks.register('compileKnowledgeShadow', Exec) {
  def compiler = rootProject.file('compiler-knowledge-db-shadow.py')
  def database = file('src/main/assets/knowledge/knowledge_db.json')
  inputs.files(compiler, database)
  outputs.files(
    file('build/reports/canon-p1/compiler-authoring-shadow.json'),
    file('build/reports/canon-p1/compiler-candidate.json'),
    file('build/reports/canon-p1/compiler-data-parity.json')
  )
  commandLine 'python3', compiler.absolutePath
}
tasks.withType(Test).configureEach {
  dependsOn compileKnowledgeShadow
}
