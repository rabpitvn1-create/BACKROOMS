plugins { id 'com.android.application' }

def secret = { name ->
  def value = System.getenv(name) ?: ""
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 22
    versionName '1.1.20'
    buildConfigField "String", "QWEN_API_KEY", "\"" + secret("QWEN_API_KEY") + "\""
    buildConfigField "String", "QWEN_BASE_URL", "\"" + secret("QWEN_BASE_URL") + "\""
    buildConfigField "String", "QWEN_MODEL", "\"" + secret("QWEN_MODEL") + "\""
    buildConfigField "String", "OPENAI_API_KEY", "\"" + secret("OPENAI_API_KEY") + "\""
  }

  buildFeatures { buildConfig true }
}
