plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def twoProviderGameplayTest = project.findProperty('backroomTwoProviderTest')?.toString() == 'true'
def secret = { name ->
  // The instrumentation APK must not even contain Gemini/Haku credentials.
  def excluded = twoProviderGameplayTest && (name.startsWith('GEMINI_API_KEY_') || name.startsWith('HAKU_'))
  def value = excluded ? "" : (System.getenv(name) ?: "")
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    minSdk 24
    targetSdk 35
    versionCode 95
    versionName '1.2.0.0.22'
    buildConfigField "String", "GEHIHI_API_KEY", "\"" + secret("GEHIHI_API_KEY") + "\""
    buildConfigField "String", "GEHIHI_BASE_URL", "\"" + secret("GEHIHI_BASE_URL") + "\""
    buildConfigField "String", "GEHIHI_MODEL", "\"" + secret("GEHIHI_MODEL") + "\""
    buildConfigField "String", "SOL_API_KEY", "\"" + secret("SOL_API_KEY") + "\""
    buildConfigField "boolean", "TWO_PROVIDER_GAMEPLAY_TEST", (twoProviderGameplayTest ? "true" : "false")
    buildConfigField "String", "HAKU_API_KEY", "\"" + secret("HAKU_API_KEY") + "\""
    buildConfigField "String", "HAKU_BASE_URL", "\"" + secret("HAKU_BASE_URL") + "\""
    buildConfigField "String", "HAKU_MODEL", "\"" + secret("HAKU_MODEL") + "\""
    buildConfigField "String", "GEMINI_API_KEY_1", "\"" + secret("GEMINI_API_KEY_1") + "\""
    buildConfigField "String", "GEMINI_API_KEY_2", "\"" + secret("GEMINI_API_KEY_2") + "\""
    buildConfigField "String", "GEMINI_API_KEY_3", "\"" + secret("GEMINI_API_KEY_3") + "\""
    buildConfigField "String", "GEMINI_API_KEY_4", "\"" + secret("GEMINI_API_KEY_4") + "\""
    buildConfigField "String", "GEMINI_API_KEY_5", "\"" + secret("GEMINI_API_KEY_5") + "\""
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  testImplementation 'org.json:json:20240303'
}
