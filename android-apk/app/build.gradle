plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}


android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 70
    versionName '1.1.63.0.5'
    buildConfigField "String", "GEHIHI_API_KEY", '""'
    buildConfigField "String", "GEHIHI_BASE_URL", '""'
    buildConfigField "String", "GEHIHI_MODEL", '""'
    buildConfigField "String", "SOL_API_KEY", '""'
    buildConfigField "String", "HAKU_API_KEY", '""'
    buildConfigField "String", "HAKU_BASE_URL", '""'
    buildConfigField "String", "HAKU_MODEL", '""'
    buildConfigField "String", "GEMINI_API_KEY_1", '""'
    buildConfigField "String", "GEMINI_API_KEY_2", '""'
    buildConfigField "String", "GEMINI_API_KEY_3", '""'
    buildConfigField "String", "GEMINI_API_KEY_4", '""'
    buildConfigField "String", "GEMINI_API_KEY_5", '""'
    buildConfigField "boolean", "CANON_RUNTIME_2_ENABLED", "false"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
