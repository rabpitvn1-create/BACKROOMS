plugins { id 'com.android.application' }

def secret = { name ->
  def value = System.getenv(name) ?: ""
  return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
  namespace 'com.rabpit.backroom'
  compileSdk 35

  defaultConfig {
    applicationId 'com.rabpit.backroom'
    minSdk 24
    targetSdk 35
    versionCode 26
    versionName '1.1.24'
    buildConfigField "String", "LUNA_API_KEY", "\"" + secret("LUNA_API_KEY") + "\""
    buildConfigField "String", "LUNA_BASE_URL", "\"" + secret("LUNA_BASE_URL") + "\""
    buildConfigField "String", "LUNA_MODEL", "\"" + secret("LUNA_MODEL") + "\""
    buildConfigField "String", "OPENAI_API_KEY", "\"" + secret("OPENAI_API_KEY") + "\""
    buildConfigField "String", "GEMINI_API_KEY", "\"" + secret("GEMINI_API_KEY") + "\""
  }

  buildFeatures { buildConfig true }
}
