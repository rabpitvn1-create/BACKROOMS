<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="15 11 970 702" preserveAspectRatio="none">
  <!-- Inset viewBox enlarges the inner glass by about 3%; the outer TV frame and layout stay fixed. -->
  <!-- A bowed aperture, not a rounded rect: center of every edge projects
       beyond its corner shoulders. The underlying native scene stays live. -->
  <defs>
    <path id="aperture" d="M70 36 C275 8 725 8 930 36 C953 39 964 54 967 79 C988 220 988 504 967 645 C964 670 953 685 930 688 C725 716 275 716 70 688 C47 685 36 670 33 645 C12 504 12 220 33 79 C36 54 47 39 70 36Z"/>
    <clipPath id="glass"><use href="#aperture"/></clipPath>
    <linearGradient id="bezel" x2=".15" y2="1">
      <stop stop-color="#05090a"/><stop offset=".28" stop-color="#030506"/>
      <stop offset=".72" stop-color="#050809"/><stop offset="1" stop-color="#080c0d"/>
    </linearGradient>
    <linearGradient id="edge" x2=".65" y2="1">
      <stop stop-color="#a4b1ad" stop-opacity=".3"/><stop offset=".35" stop-color="#071011" stop-opacity=".15"/>
      <stop offset="1" stop-color="#9cafa9" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="window" x2=".7" y2="1">
      <stop stop-color="#f4f5e9" stop-opacity=".55"/><stop offset=".55" stop-color="#e1ece2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d1dbd3" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lip"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g clip-path="url(#glass)">
    <!-- Reflected window follows the left shoulder of the convex glass. -->
    <path d="M64 58 Q147 33 270 42 L235 198 Q151 227 52 237Z" fill="url(#window)" filter="url(#soft)"/>
    <path d="M43 109 Q58 84 77 79 L64 330 Q49 355 38 362Z" fill="#dbe5dc" opacity=".16" filter="url(#soft)"/>
    <path d="M90 51 Q500 5 910 51" fill="none" stroke="#d7e2da" stroke-opacity=".16" stroke-width="5" filter="url(#lip)"/>
  </g>
  <!-- Opaque matte outside the exact same aperture clips scenery, actors,
       OSD, scanlines and tracking together; no fake background/portrait. -->
  <path fill="url(#bezel)" fill-rule="evenodd" d="M0 0H1000V724H0Z M70 36 C275 8 725 8 930 36 C953 39 964 54 967 79 C988 220 988 504 967 645 C964 670 953 685 930 688 C725 716 275 716 70 688 C47 685 36 670 33 645 C12 504 12 220 33 79 C36 54 47 39 70 36Z"/>
  <use href="#aperture" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="13" filter="url(#lip)"/>
  <use href="#aperture" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
</svg>
