 #000b}.game-menu-sheet{max-height:min(calc(var(--app-height,100dvh) - 12px),760px);overscroll-behavior:contain}.player-action-head,.game-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.game-menu-head{position:sticky;top:-14px;z-index:2;margin:-14px -14px 10px;padding:14px;background:#0e1114;border-bottom:1px solid #252b31}.player-action-head h2,.game-menu-head h2{margin:0;font-size:13px;letter-spacing:.12em}.player-action-close,.game-menu-close{width:44px;height:44px;min-width:44px;padding:0;font-size:22px;line-height:1;border-radius:9px}.composer{display:grid;gap:10px;padding:0}.composer label{font-weight:700;font-size:13px}.composer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}textarea,button{font:inherit}textarea{min-height:150px;max-height:calc(var(--app-height,100dvh) - 150px);resize:vertical;background:#090c0f;color:white;border:1px solid #30373e;padding:12px;line-height:1.45;border-radius:8px}button{border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700;border-radius:8px}.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.side{display:grid;gap:10px;margin-top:0}.card{padding:14px;border-radius:10px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}.chips span{border-radius:6px}body.player-action-open,body.game-menu-open{overflow:hidden}

<script>
const prologue=`Bữa tối bắt đầu như bao lần khác.

Nhà hàng nằm trên một tầng cao của khu thương mại, đủ yên để người ta nghe rõ tiếng dao chạm vào đĩa nhưng không đến mức phải giữ giọng. Qua lớp kính lớn sát tường, thành phố trải xuống bên dưới bằng những dải đèn trắng, vàng và đỏ. Nhân viên phục vụ đi lại nhẹ đến mức chỉ khi một chiếc ly được đặt xuống, Kai mới để ý có người vừa tới gần bàn.

Hắn đang cắt nốt phần thịt trong đĩa thì nhận ra Syvial lại nhìn sang.

Kai vẫn cúi đầu.

“Em nhìn tiếp cũng vô ích. Miếng cuối này không tự chạy sang đĩa em đâu.”

Syvial nhướng mày. “Ai bảo em nhìn miếng thịt?”

“Vậy chắc anh hiểu lầm.”

“Đúng. Em chỉ đang thắc mắc tại sao một người ăn chậm như anh lại nhất quyết giữ phần cuối đến tận bây giờ.”

Kai đưa nĩa lên, ăn luôn miếng thịt trước khi cô kịp nói thêm. “Hết thắc mắc chưa?”

Syvial nhìn chiếc đĩa trống, rồi nhìn hắn. “Anh làm thế chỉ để chọc em đúng không?”

Iris đặt ly nước xuống. Khóe miệng cô hơi động. “Muốn ăn thì gọi thêm đi. Đừng nhìn đĩa của anh ấy mãi.”

“Có nhìn mãi đâu.”

“Đủ lâu để người ngồi đối diện cũng nhận ra.”

Syvial quay sang. “Đếm à?”

“Không cần.”

Kai dựa lưng vào ghế, để mặc hai người nhìn nhau qua mặt bàn. “Anh đề nghị đổi chủ đề trước khi bữa tối biến thành một cuộc điều tra về quyền sở hữu thức ăn.”

Syvial chống cằm. “Muộn rồi. Em sẽ nhớ chuyện này.”

“Danh sách của em còn chỗ à?”

“Anh cứ tiếp tục thử xem.”

Kai bật cười khẽ. Iris lắc đầu, nhưng vẻ mặt cũng đã bớt nghiêm hơn lúc mới ngồi xuống.

Đèn trên trần chớp một lần.

Không ai ở những bàn xung quanh phản ứng. Một nhân viên vẫn nghiêng chai rượu, dòng chất lỏng đỏ sẫm chảy đều vào ly. Bản nhạc trong nhà hàng tiếp tục trôi qua, chỉ có một nốt trầm vừa rồi nghe hơi lệch.

Kai ngẩng lên.

Đèn chớp lần thứ hai.

Lần này Iris cũng dừng tay. Cô không nhìn lên trần mà quay sang phía cửa kính, như thể đang cố xác định một âm thanh vừa lọt khỏi chỗ của nó.

“Anh Kai.”

“Anh nghe rồi.”

Syvial thôi cười. Sự thay đổi trên gương mặt cô diễn ra rất nhanh; vẻ thư thả còn đó một giây trước đã biến mất khi cô nhìn quanh căn phòng.

Kai không nghe thấy tiếng động lạ nào rõ ràng. Điều khiến hắn chú ý là những âm thanh vốn phải có đang mất dần phần vang của chúng. Tiếng trò chuyện ở bàn gần nhất trở nên phẳng một cách khó chịu. Nhạc vẫn phát, nhưng các nốt thấp kéo dài như bị bóp méo. Ngay cả tiếng dao nĩa cũng nghe gần hơn khoảng cách thực tế.

Một người đàn ông cách họ vài bàn đang nói chuyện thì khựng lại. Chiếc ly trong tay ông trượt khỏi những ngón tay.

Kai nhìn theo phản xạ.

Chiếc ly rơi xuống được nửa quãng rồi biến mất.

Không vỡ. Không bị hất sang bên. Không có ánh sáng hay khói che khuất. Trong một khoảnh khắc nó vẫn còn ở đó, khoảnh khắc tiếp theo chỉ còn khoảng không.

Kai đứng dậy ngay.

“Đứng lên. Ra khỏi đây.”

Iris đã rời ghế trước khi hắn nói hết câu. Syvial đẩy ghế lùi lại, mắt vẫn quét quanh sàn và các lối ra.

Họ không kịp đi bước nào.

Mặt sàn dưới chân Kai không nứt, không sập và cũng không hề rung. Nó chỉ đột ngột thôi cản cơ thể hắn lại.

Chân hắn xuyên qua lớp gỗ như xuyên qua một hình ảnh không có khối lượng.

Kai giật tay về phía mép bàn. Những ngón tay chỉ kịp quệt qua cạnh bàn trước khi cả người rơi xuống. Phía trên, Iris lao tới theo phản xạ. Syvial cũng xoay người chụp lấy hắn, nhưng đúng lúc đó phần sàn dưới chân hai người họ cũng mất độ rắn.

Khoảnh khắc cuối cùng Kai còn nhìn thấy nhà hàng là một mớ hình ảnh nghiêng lệch: chiếc bàn trượt khỏi tầm mắt, bàn tay Iris đưa ra nhưng không chạm tới, mái tóc Syvial quét qua vai khi cô rơi, những thực khách phía xa vẫn chưa hiểu chuyện gì đang xảy ra.

Rồi ánh sáng biến mất.

Không có cảm giác rơi tự do. Không có gió quất vào người, không có lực kéo tăng dần, cũng không còn khái niệm rõ ràng về trên hay dưới. Cơ thể Kai vẫn ở đó, nhưng khoảng cách xung quanh hắn dường như không còn được đo theo cách quen thuộc.

Cảm giác ấy kéo dài chưa tới một nhịp tim.

Trọng lực trở lại đột ngột.

Kai chạm xuống một bề mặt mềm hơn sàn nhà hàng. Hắn chống một chân, hạ thấp trọng tâm và giữ được thăng bằng gần như ngay lập tức.

Mùi ẩm mốc xộc vào trước tiên.

Sau đó là mùi giấy cũ, bụi, keo dán và thứ hóa chất tẩy rửa nhạt đến mức chỉ còn bám lại trong không khí. Trên đầu, hàng đèn huỳnh quang tỏa ánh sáng trắng nhợt. Tiếng ù đều đều của chúng lấp kín căn phòng.

Kai đứng thẳng lên.

Nhà hàng đã biến mất.

Quanh hắn là những bức tường phủ giấy màu vàng nhạt với hoa văn lặp lại đến phát ngấy. Tấm thảm dưới chân ẩm lạnh dù không thấy nước chảy từ đâu. Trần nhà ghép bằng những tấm vuông giống hệt nhau, kéo dài qua các ô cửa mở sang những căn phòng kế tiếp.

Không có cửa sổ. Không có bàn ghế. Không có dấu vết của thành phố.

Và không có Iris hay Syvial.

Kai quay một vòng, nhìn kỹ từng lối mở trước khi gọi.

“Iris?”

Chỉ có tiếng đèn.

“Syvial?”

Giọng hắn đi qua hai căn phòng, dội lại rất yếu rồi chìm mất trong một khoảng không không cho thấy điểm cuối.

Kai không gọi lần thứ ba. Hắn chuyển sang liên lạc.

Kênh trực tiếp của đội không trả lời. Kênh nội bộ Black Blood im lặng. Kênh chỉ huy, kênh khẩn cấp và các đường truyền dự phòng mã hóa cũng không nhận được bất kỳ tín hiệu hồi đáp nào.

Hắn kiểm tra lại từng kênh một lần nữa, lần này tách riêng lỗi thiết bị khỏi lỗi đường truyền.

Kết quả không thay đổi.

Đây không giống tín hiệu yếu. Cũng không giống một vùng nhiễu thông thường. Không có tín hiệu méo, không có gói dữ liệu hỏng, không có dấu hiệu cho thấy đầu bên kia đã nhận được lời gọi rồi thất bại khi trả lời.

Chỉ có im lặng.

Chưa đầy một phút trước, Iris và Syvial còn ngồi trong tầm tay hắn. Kai đã thấy cả hai cùng rơi khi mặt sàn mất đi dưới chân họ. Đó là điều duy nhất hắn có thể chắc chắn.

Hắn không biết họ đã rơi tới đâu.

Không biết họ có ở cùng nơi này hay không.

Không biết Black Blood còn có thể tìm thấy dấu vết của ba người từ phía bên kia hay không.

Không có tọa độ để đối chiếu. Không có tín hiệu định vị. Không có dữ liệu trạng thái từ hai người còn lại. Và trước mắt, không có bất kỳ lời giải thích nào cho căn phòng vàng vô tận đang mở ra quanh hắn.

Kai đứng yên thêm vài giây để nghe.

Tiếng đèn vẫn ù trên đầu. Thảm vẫn ẩm dưới đế giày. Ở phía trước, một hành lang rẽ sang trái sau lớp tường vàng; bên phải là một ô cửa khác dẫn vào căn phòng gần như giống hệt nơi hắn đang đứng.

Không có tiếng gọi đáp lại.

Kai chỉ còn những gì mình đang mang theo, những gì chính mắt hắn có thể kiểm chứng, và một việc phải làm trước tiên: xác định mình đang ở đâu, rồi tìm Iris và Syvial.`;

const initial={
  title:"MAIN_BACKROOMS — Kai Akechi",
  turn:1,
  mode:"local APK",
  location:"Level 0 / The Lobby — khu phòng vàng ban đầu sau no-clip",
  player:{name:"Kai Akechi",condition:"Ổn định"},
  party:[],
  inventory:[
    {name:"White Wraith Magnum"},
    {name:"Blackblood Armor & linked modules"},
    {name:"Omnivault Ring / Nhẫn Vạn Tàng"}
  ],
  flags:{communication:{blackBlood:"OFFLINE",iris:"OFFLINE",syvial:"OFFLINE"}},
  log:[
    {role:"gm",text:"MỞ ĐẦU\n\n"+prologue},
    {role:"gm",text:"LƯỢT 1\n\nKhông có liên lạc với Iris, Syvial hay Black Blood. Bạn điều khiển Kai từ đây."}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

const oldPrologueSignature="Không beacon. Không telemetry.";
if(state.turn===1&&Array.isArray(state.log)&&state.log[0]){
  const currentOpening=String(state.log[0].text||"");
  if(currentOpening.length<1000||currentOpening.includes(oldPrologueSignature)){
    state.log[0]=initial.log[0];
    if(state.log[1]&&String(state.log[1].text||"").startsWith("TURN 1")) state.log[1]=initial.log[1];
    localStorage.setItem("backroom-apk-state",JSON.stringify(state));
  }
}

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function render(){titleEl.textContent=state.title;turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(state.party);inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");logEl.scrollTop=logEl.scrollHeight;statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Gemini đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=JSON.parse(json);actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi Gemini: "+message};
function syncViewportHeight(){const viewport=window.visualViewport;const height=Math.max(1,Math.round((viewport&&viewport.height)||window.innerHeight||document.documentElement.clientHeight||1));document.documentElement.style.setProperty("--app-height",height+"px")}
syncViewportHeight();if(window.visualViewport){window.visualViewport.addEventListener("resize",syncViewportHeight);window.visualViewport.addEventListener("scroll",syncViewportHeight)}else{window.addEventListener("resize",syncViewportHeight)}
const playerActionOpen=byId("playerActionOpen"),playerActionModal=byId("playerActionModal"),playerActionClose=byId("playerActionClose"),playerActionCancel=byId("playerActionCancel"),playerActionBackdrop=byId("playerActionBackdrop"),gameMenuOpen=byId("gameMenuOpen"),gameMenuModal=byId("gameMenuModal"),gameMenuClose=byId("gameMenuClose"),gameMenuBackdrop=byId("gameMenuBackdrop");
function uiActionLocked(){return busy||!!(state&&state.combat&&state.combat.active)}
function openPlayerAction(){if(uiActionLocked()||!playerActionModal)return;playerActionModal.hidden=false;playerActionModal.setAttribute("aria-hidden","false");document.body.classList.add("player-action-open");setTimeout(()=>{try{actionEl.focus({preventScroll:true})}catch(_){actionEl.focus()}},40)}
function closePlayerAction(keepDraft=true){if(!playerActionModal)return;playerActionModal.hidden=true;playerActionModal.setAttribute("aria-hidden","true");document.body.classList.remove("player-action-open");try{actionEl.blur()}catch(_){}if(!keepDraft)actionEl.value=""}
function openGameMenu(){if(!gameMenuModal)return;gameMenuModal.hidden=false;gameMenuModal.setAttribute("aria-hidden","false");gameMenuOpen.setAttribute("aria-expanded","true");document.body.classList.add("game-menu-open")}
function closeGameMenu(){if(!gameMenuModal)return;gameMenuModal.hidden=true;gameMenuModal.setAttribute("aria-hidden","true");gameMenuOpen.setAttribute("aria-expanded","false");document.body.classList.remove("game-menu-open")}
if(playerActionOpen)playerActionOpen.addEventListener("click",openPlayerAction);if(playerActionClose)playerActionClose.addEventListener("click",()=>closePlayerAction(true));if(playerActionCancel)playerActionCancel.addEventListener("click",()=>closePlayerAction(true));if(playerActionBackdrop)playerActionBackdrop.addEventListener("click",()=>closePlayerAction(true));if(gameMenuOpen)gameMenuOpen.addEventListener("click",openGameMenu);if(gameMenuClose)gameMenuClose.addEventListener("click",closeGameMenu);if(gameMenuBackdrop)gameMenuBackdrop.addEventListener("click",closeGameMenu);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(playerActionModal&&!playerActionModal.hidden)closePlayerAction(true);else if(gameMenuModal&&!gameMenuModal.hidden)closeGameMenu()});
formEl.addEventListener("submit",()=>{if(actionEl.value.trim())closePlayerAction(true)});

render();
</script>
</body>
</html>
