<script>
function syncViewportHeight(){
  const viewport=window.visualViewport;
  const height=Math.max(1,Math.round((viewport&&viewport.height)||window.innerHeight||document.documentElement.clientHeight||1));
  document.documentElement.style.setProperty("--app-height",height+"px");
}
syncViewportHeight();
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",syncViewportHeight);
  window.visualViewport.addEventListener("scroll",syncViewportHeight);
}else{
  window.addEventListener("resize",syncViewportHeight);
}
const prologueText=window.BACKROOM_PROLOGUE||"LEVEL 0 — THE LOBBY\n\nChọn một gợi ý của GAME MASTER hoặc dùng PLAYER ACTION để bắt đầu khám phá.";

const CURRENT_CHARACTER_CANON={
  "version": "cao-minh-r15-2026-09-20",
  "source": "Google Drive 02_CHARACTERS/Cao_Minh_Codex.docx · 1TDBphEo1wxrdlRXTI9WUOJPinmWv1PHq · CAO-MINH-VAN-GIOI-MA-TON-CODEX-20260920-R15",
  "instruction": "Cao Minh R15 is the current protagonist canon and overrides conflicting Kai/SRU/Async protagonist legacy. KNOWLEDGE_LOCK remains backstage knowledge only; OPEN/UNKNOWN fields stay open. Cao Minh has no default knowledge of Backrooms level names, Entity identities, rules or origin. Gameplay values are internal projection only and must not be turned into cultivation lore or dialogue terminology.",
  "caoMinh": "Cao Minh / Vạn Giới Ma Tôn is a Ma Đạo Kiếm Tu and the strongest known cultivator of his original world before falling into Backrooms. He belongs to no sect, empire or organization. Original-world name, era and detailed cultivation realms remain OPEN. He is confident but not blindly arrogant; relaxed, lazy, wine-loving and sarcastic outside serious danger. He does not intentionally harm innocents. KNOWLEDGE_LOCK: half-human/half-demon with ancient inheritance linked to Vạn Quỷ Ma Tôn; Vạn Quỷ Ma Tôn is the inheritance source, not Cao Minh's title. Vạn Quỷ Ma Tâm is his Đạo Cơ, Ma Hải and central origin, with no canonically locked intrinsic ma-nguyên ceiling. Vạn Quỷ Ma Thân does not inherently remove control, corrupt him, impose a duration cap or cause backlash. Huyết Ma Nhị Thập Tứ Trảm completely stops external time and performs exactly 24 strikes before time resumes.",
  "equipment": "Bound equipment: Huyết Ma Kiếm, Huyết Ma Chiến Khải and Vạn Tàng Giới. Huyết Ma Kiếm and Huyết Ma Chiến Khải can progressively regenerate the existing artifact; regeneration never creates duplicates. Vạn Tàng Giới stores inanimate matter. Phản Bổn restores the same existing artifact to the best state that exact artifact genuinely reached; no copy, create-from-nothing, upgrade beyond history or living storage. After successful Phản Bổn, that same artifact has a one-day-one-night Phản Bổn cooldown; this does not block natural bound-artifact regeneration.",
  "visual": "R15 visual lock: apparent male around thirty, true age unknown; very long thick black hair in a high ponytail, dark-red eyes and exposed face; black-red Huyết Ma Chiến Khải with blood-red inscriptions; large straight broad black Huyết Ma Kiếm with red inscriptions and Ma Luân.",
  "backrooms": "Immediately before transition Cao Minh was on Ma Sơn drinking spirit wine with Huyết Ma Kiếm nearby. The ground vanished without a recognized formation, spatial turbulence or warning. He lands in the yellow environment and tests it with divine sense and a demonic mark. He must not know Level names/numbers, Entity identities, rules or origin without valid in-story evidence. Current first priority: investigate local rules and the nature of Backrooms. Returning to his original world is second.",
  "dialogue": "Speak naturally and completely, often with humor/sarcasm. Do not make Cao Minh constantly say 'bổn tọa', speak like an ancient manual, or use vague pseudo-philosophy to sound profound. With Diệp Minh only an established feud is locked; cause, history, intensity, win-loss balance and outcome remain OPEN.",
  "gameplay": "R15 internal projection: Huyết Ma Tứ Liên AUTO 30%, exactly 4 hits, 170% weapon damage total, Bleeding 3 combat turns at 5% Max HP per turn, refresh-only. Ma Tâm Trấn Hồn AUTO 20%, exactly 4 hits, 130% weapon damage total, Stun 1 turn scoped to reaction/counterattack of the triggering turn. Huyết Ảnh Ma Độn AUTO 20%, exactly 2 hits, 147% weapon damage total. Thiên Ma Bộ AUTO 30%, +50 percentage points Evasion for 3 combat turns including proc turn, refresh-only, does not automatically null mandatory AoE. Đại Đạo Ma Tôn PASSIVE: after each Cao Minh combat turn, heal 10% Max HP and additively gain +20% Attack plus +20 percentage points Critical for the current combat; all allies gain +50 percentage points Critical; Critical caps at 100%; stacks reset when combat ends. Ma Tôn PASSIVE: all STR/DEF/SKL/VIT receive a separate +99 bonus; base progression remains unchanged and UI must show base (+99), e.g. 5 (+99), never persist/display 104 as the base stat. The +99 participates in effective combat calculations but does not change Core upgrade cost. AUTO rolls are independent; multiple may proc; successful proc hits without another accuracy/evasion roll. Ultimate priority on combat turn 3 and multiples of 3: Huyết Ma Nhị Thập Tứ Trảm = exactly 24 hits, 10 HP each, Accuracy 200%, ignores Evasion; AUTO skills do not roll on an Ultimate turn."
};

const LEVEL_NODE_TITLES={
  "0":"Level 0 : The Lobby",
  "0.1":"Level 0.1 : Zenith Station",
  "0.2":"Level 0.2 : Remodeled Mess",
  "0.5":"Level 0.5 : Aquaclaustrophobic Infirmary",
  "0.7":"Level 0.7 : The Reminiscence District",
  "manila_room":"Manila Room",
  "the_torment":"The Torment",
  "red_rooms":"Red Rooms",
  "1":"Level 1 : Parking Zone",
  "2":"Level 2 : Pipe Dreams",
  "3":"Level 3 : The Electrical Station",
  "4":"Level 4 : The Abandoned Office",
  "5":"Level 5 : Terror Hotel",
  "6":"Level 6 : Lights Out"
};

const CLIENT_SAVE_VERSION=13;

const initial={
  saveVersion:CLIENT_SAVE_VERSION,
  title:"Level 0 : The Lobby",
  turn:1,
  mode:"local APK",
  currentLevel:0,
  currentLevelKey:"0",
  location:"Hành lang vàng nhạt — khu vực chưa xác định",
  player:{name:"Cao Minh",condition:"Ổn định"},
  party:[],
  inventory:[
    {name:"Huyết Ma Kiếm"},
    {name:"Huyết Ma Chiến Khải"},
    {name:"Vạn Tàng Giới"}
  ],
  flags:{},
  characterCanon:CURRENT_CHARACTER_CANON,
  log:[
    {role:"gm",text:prologueText}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
function normalizeCoreState(value){try{return window.Android&&typeof Android.normalizeState==="function"?JSON.parse(Android.normalizeState(JSON.stringify(value))):value}catch(_){return value}}
let state=normalizeCoreState(initial);
let busy=false;

function inferLevelKey(s){
  const existing=String(s?.currentLevelKey||"").trim();
  if(existing)return existing;
  const location=String(s?.location||"").toLowerCase();
  if(location.includes("manila room"))return "manila_room";
  if(location.includes("the torment")||/\btorment\b/.test(location))return "the_torment";
  if(location.includes("red rooms")||location.includes("red room"))return "red_rooms";
  const m=String(s?.location||"").match(/\bLevel\s*([0-6](?:\.[0-9]+)?)\b/i);
  if(m)return m[1];
  return String(Number.isInteger(s?.currentLevel)?s.currentLevel:0);
}
function ensureCurrentLevel(s){
  if(!Number.isInteger(s?.currentLevel)||s.currentLevel<0||s.currentLevel>6){
    const m=String(s?.location||"").match(/\bLevel\s*([0-6])\b/i);
    s.currentLevel=m?Number(m[1]):0;
  }
  s.currentLevelKey=inferLevelKey(s);
  return s;
}
ensureCurrentLevel(state);
state.characterCanon=CURRENT_CHARACTER_CANON;
if(state.turn===1){
  const currentOpening=String(state.log?.[0]?.text||"");
  const playerName=String(state.player?.name||"").trim().toLowerCase();
  const legacyOpening=currentOpening!==initial.log[0].text||playerName.includes("kai")||playerName.includes("twilight");
  if(legacyOpening){
    state.title=initial.title;
    state.currentLevel=initial.currentLevel;
    state.currentLevelKey=initial.currentLevelKey;
    state.location=initial.location;
    state.player=JSON.parse(JSON.stringify(initial.player));
    state.party=[];
    state.inventory=JSON.parse(JSON.stringify(initial.inventory));
    state.flags={};
    state.log=JSON.parse(JSON.stringify(initial.log));
    state.characterCanon=CURRENT_CHARACTER_CANON;
  }
}

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function levelTitle(){const key=String(state?.currentLevelKey||state?.currentLevel||0);return LEVEL_NODE_TITLES[key]||("Level "+key)}
function partyDisplayItems(){const result=[];const seen=new Set();const add=x=>{if(!x)return;const name=typeof x==="string"?x:String(x.name||x.id||"").trim();if(!name)return;const key=name.toLocaleLowerCase("vi");if(seen.has(key))return;seen.add(key);result.push(typeof x==="string"?{name}:x)};add(state?.player||{name:"Cao Minh"});(Array.isArray(state?.party)?state.party:[]).filter(x=>x&&x.joined===true).forEach(add);return result}
function render(){titleEl.textContent=levelTitle();locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Cao Minh";partyEl.innerHTML=chips(partyDisplayItems());inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("")}
function save(){if(busy||window.__combatBusy)return;try{if(!window.Android||!Android.saveCheckpoint)throw Error("Core chưa sẵn sàng");Android.saveCheckpoint();statusEl.textContent="Đã lưu game."}catch(error){statusEl.textContent=error.message||"Không thể lưu game."}}
function load(){if(busy||window.__combatBusy)return;try{if(!window.Android||!Android.loadCheckpoint)throw Error("Core chưa sẵn sàng");state=ensureCurrentLevel(JSON.parse(Android.loadCheckpoint()));state.characterCanon=CURRENT_CHARACTER_CANON;render();if(window.backroomPrefetchChoices)window.backroomPrefetchChoices();statusEl.textContent="Đã tải bản lưu."}catch(error){statusEl.textContent=error.message||"Chưa có bản lưu."}}
function freshCoreGame(){const fresh=JSON.parse(JSON.stringify(initial));return window.Android&&typeof Android.startNewGame==="function"?JSON.parse(Android.startNewGame(JSON.stringify(fresh))):fresh}
function resetGame(){if(confirm("Bắt đầu lại từ đầu?")){state=freshCoreGame();render();if(window.backroomPrefetchChoices)window.backroomPrefetchChoices()}}
function clearSave(){if(confirm("Xóa save trên máy?")){if(window.Android&&Android.clearCheckpoint)Android.clearCheckpoint();localStorage.removeItem("backroom-apk-state");state=freshCoreGame();render();if(window.backroomPrefetchChoices)window.backroomPrefetchChoices()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){window.__gmErrorMessage="Đang gặp lỗi. Vui lòng thử lại.";render();return}window.__gmErrorMessage="";busy=true;submitEl.disabled=true;window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=ensureCurrentLevel(JSON.parse(json));state.characterCanon=CURRENT_CHARACTER_CANON;actionEl.value="";busy=false;window.__combatBusy=false;window.__gmEnvironmentLoading=false;window.__gmErrorMessage="";submitEl.disabled=false;render();if(window.backroomPrefetchChoices)window.backroomPrefetchChoices()};
window.backroomError=message=>{busy=false;window.__combatBusy=false;window.__gmEnvironmentLoading=false;submitEl.disabled=false;window.__gmErrorMessage="Đang gặp lỗi. Vui lòng thử lại.";if(message&&window.console&&typeof console.error==="function")console.error("GAME MASTER:",message);if(typeof render==="function")render()};
window.backroomCommittedError=json=>{const payload=JSON.parse(json);state=ensureCurrentLevel(payload.state||state);state.characterCanon=CURRENT_CHARACTER_CANON;busy=false;window.__gmEnvironmentLoading=false;submitEl.disabled=false;window.__gmErrorMessage="Đang gặp lỗi. Vui lòng thử lại.";if(payload.message&&window.console&&typeof console.error==="function")console.error("GAME MASTER:",payload.message);render()};
render();
</script>
