<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Backroom</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#eef1f3;font:15px system-ui,sans-serif}.shell{min-height:100vh;padding:10px;background:radial-gradient(circle at top,#161b20,#07090b 75%)}.game,.card{border:1px solid #2b3137;background:#0e1114;box-shadow:0 20px 60px #0007}.topbar{display:flex;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid #2b3137}.eyebrow,.role{color:#8f9aa4;font-size:10px;font-weight:800;letter-spacing:.16em}h1{margin:4px 0 0;font-size:23px}.turn{color:#9aa4ad;font-size:12px;letter-spacing:.1em}.turn strong{font-size:21px;color:white}.snapshot{height:170px;margin:10px;border:1px solid #252b31;display:grid;place-items:center;background:#0b0d0f;color:#69737c}.snapshot img{width:100%;height:100%;object-fit:cover}.log{height:42vh;overflow:auto;padding:10px;display:grid;gap:10px}.message{border-left:3px solid #454e56;padding:11px;background:#111519}.message.player{border-left-color:#8b949e;background:#15191d}.role{margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.55}.composer{display:grid;gap:8px;padding:10px}textarea,button{font:inherit}textarea{min-height:80px;background:#090c0f;color:white;border:1px solid #30373e;padding:10px}button{border:1px solid #3a4249;background:#1a2025;color:#eff2f4;padding:12px;font-weight:700}.status{border-top:1px solid #252b31;padding:10px;color:#9aa4ad;font-size:12px}.side{display:grid;gap:10px;margin-top:10px}.card{padding:14px}.card h2{font-size:13px;letter-spacing:.1em;margin:0 0 10px}.row{display:grid;grid-template-columns:90px 1fr;padding:6px 0;border-bottom:1px solid #22282d;color:#dce2e5}.row b{color:#78838c;font-weight:400}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}.danger{background:#241616;color:#e6b1b1;border-color:#663b3b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid #313940;padding:5px 7px;font-size:12px}
</style></head><body><main class="shell"><section class="game"><header class="topbar"><div><div class="eyebrow">BACKROOM TEXT GAME</div><h1 id="title"></h1></div><div class="turn">TURN <strong id="turn"></strong></div></header><div class="snapshot" id="snapshot">SNAPSHOT — Android bản đầu chưa tạo ảnh tự động</div><div class="log" id="log"></div><form class="composer" id="form"><textarea id="action" placeholder="Kai làm gì trong Turn hiện tại?" rows="3"></textarea><button id="submit">THỰC HIỆN</button></form><div class="status" id="status"></div></section><aside class="side"><div class="card"><h2>Trạng thái</h2><div class="row"><b>Vị trí</b><span id="location"></span></div><div class="row"><b>Chế độ</b><span id="mode"></span></div><div class="row"><b>Nhân vật</b><span id="player"></span></div></div><div class="card"><h2>Save / Load</h2><div class="actions"><button onclick="save()">Lưu</button><button onclick="load()">Tải</button><button class="wide" onclick="resetGame()">Bắt đầu lại từ đầu</button><button class="wide danger" onclick="clearSave()">Xóa save trên máy</button></div></div><div class="card"><h2>Party</h2><div class="chips" id="party"></div></div><div class="card"><h2>Inventory</h2><div class="chips" id="inventory"></div></div></aside></main><script>
const initial={title:"MAIN_BACKROOMS — Kai Akechi",turn:1,mode:"local APK",location:"Level 0 / The Lobby — khu phòng vàng ban đầu sau no-clip",player:{name:"Kai Akechi",condition:"Ổn định"},party:[],inventory:[{name:"White Wraith Magnum"},{name:"Blackblood Armor & linked modules"},{name:"Omnivault Ring / Nhẫn Vạn Tàng"}],flags:{communication:{blackBlood:"OFFLINE",iris:"OFFLINE",syvial:"OFFLINE"}},log:[{role:"gm",text:"PROLOGUE\n\n"+"Bữa tối vốn không có gì đặc biệt.\n\nMột nhà hàng nằm trên tầng cao của khu thương mại, đủ sang để nhân viên phục vụ biết lúc nào nên xuất hiện và lúc nào nên biến mất. Ngoài lớp kính lớn, thành phố trải xuống dưới thành những dải ánh sáng trắng và đỏ. Bên trong chỉ có tiếng dao nĩa, những cuộc trò chuyện vừa đủ nhỏ và nhạc nền chẳng ai thực sự nghe.\n\nKai ngồi ở giữa bàn, một tay đặt cạnh ly nước, tay kia chậm rãi cắt miếng thịt trước mặt. Iris ngồi phía đối diện. Syvial chiếm chiếc ghế bên phải hắn.\n\nSyvial nhìn sang đĩa của Kai lần thứ ba.\n\nKai không ngẩng đầu.\n\n“Em nhìn thêm vài giây nữa thì miếng đó cũng không tự bò sang đĩa em đâu.”\n\n“Em có nhìn miếng thịt đâu.”\n\n“Ừ.”\n\nSyvial chống cằm.\n\n“Em đang nhìn xem anh định ăn chậm đến bao giờ.”\n\nKai đưa miếng thịt lên miệng.\n\n“Cách giải thích mới. Anh đánh giá cao nỗ lực.”\n\nIris đặt ly xuống, liếc Syvial.\n\n“Nếu muốn thì gọi thêm đi. Đừng ngồi canh đồ ăn của anh ấy.”\n\n“Em đâu có canh.”\n\n“Ba phút rồi.”\n\nSyvial quay sang Iris.\n\n“Em đếm à?”\n\n“Không cần đếm.”\n\nKai nhấc chiếc đĩa lên một chút, kéo nó xa Syvial thêm vài centimet.\n\nSyvial nhìn động tác đó.\n\n“Anh vừa làm gì đấy?”\n\n“Phòng ngừa.”\n\n“Anh thực sự nghĩ em sẽ lấy à?”\n\nKai im lặng hai giây rồi dùng nĩa ghim miếng thịt cuối cùng.\n\n“Có.”\n\nIris bật ra một tiếng cười rất nhỏ rồi lập tức cúi xuống đĩa như thể mình chẳng liên quan.\n\nSyvial nhìn cả hai.\n\n“Được. Em nhớ chuyện này.”\n\n“Danh sách của em chắc dài lắm rồi.”\n\n“Rất dài.”\n\nKai vừa định trả lời thì đèn trên trần nhà chớp một lần.\n\nKhông ai trong nhà hàng để ý.\n\nMột giây sau, nó chớp lần nữa.\n\nIris ngẩng đầu trước.\n\nKhông phải vì ánh sáng.\n\nMột thứ gì đó trong không gian vừa thay đổi.\n\nÂm thanh của căn phòng dường như bị ép xuống. Tiếng trò chuyện ở bàn gần nhất mất đi phần âm vang. Tiếng nhạc vẫn còn, nhưng méo nhẹ ở những nốt thấp.\n\nKai ngừng cử động. Syvial cũng thôi đùa.\n\nIris nhìn về phía cửa kính.\n\n“Anh Kai.”\n\n“Anh biết.”\n\nKai đặt dao xuống.\n\nMột chiếc ly ở bàn cách đó vài mét rơi khỏi tay một thực khách.\n\nNó không chạm đất.\n\nChiếc ly biến mất giữa quãng rơi.\n\nKhông vỡ. Không có tiếng động. Nó đơn giản là không còn tồn tại trong căn phòng.\n\nKai đứng bật dậy.\n\n“Rời khỏi đây.”\n\nSàn nhà biến mất dưới chân họ.\n\nKhông nứt. Không sập. Không có vụ nổ hay cánh cổng nào mở ra.\n\nBề mặt gỗ cứng đột ngột mất đi tính chất của một vật thể rắn.\n\nKai rơi xuyên qua nó.\n\nTrong khoảnh khắc cuối cùng, hắn thấy bàn ăn nghiêng đi phía trên, Iris đưa tay về phía mình và Syvial xoay người cố chụp lấy cạnh bàn.\n\nRồi tất cả ánh sáng của nhà hàng bị cắt sạch.\n\nKhông có cảm giác rơi theo nghĩa thông thường. Không có gió. Không có gia tốc. Không có phương hướng.\n\nTrong chưa đầy một nhịp tim, Kai có cảm giác cơ thể mình đang đi qua một khoảng cách không thể đo bằng mét.\n\nRồi trọng lực trở lại.\n\nHắn chạm sàn bằng một chân, hạ thấp trọng tâm và giữ được thăng bằng gần như ngay lập tức.\n\nMùi đầu tiên hắn nhận thấy là ẩm. Mùi thứ hai là thứ gì đó giống giấy cũ, bụi, keo dán và hóa chất tẩy rửa đã nằm quá lâu trong một căn phòng kín.\n\nÁnh sáng huỳnh quang trắng nhợt phủ lên mọi thứ.\n\nKai đứng giữa một căn phòng trống.\n\nTường phủ giấy màu vàng nhạt với hoa văn lặp lại vô nghĩa. Thảm dưới chân ẩm nhưng không thấy nguồn nước. Trên đầu là những tấm trần thả vuông vức cùng hàng đèn huỳnh quang kéo dài sang các phòng kế tiếp.\n\nKhông cửa sổ. Không đồ nội thất. Không con người.\n\nChỉ có tiếng ù đều đều của đèn.\n\nKai quay người.\n\n“Iris?”\n\nKhông đáp.\n\n“Syvial?”\n\nTiếng của hắn đi qua hai ô cửa mở, dội lại rất yếu rồi tan vào những căn phòng giống hệt nhau.\n\nKai thử liên lạc trực tiếp, kênh nội bộ Black Blood, Command, kênh dự phòng, kênh khẩn cấp và đường truyền mã hóa độc lập.\n\nKhông kênh nào thiết lập được handshake.\n\nKhông phải tín hiệu yếu. Không phải gây nhiễu theo kiểu thông thường. Không có bất kỳ phản hồi nào từ đầu bên kia để mà bị nhiễu.\n\nỞ những vị trí khác, Iris và Syvial cũng tỉnh lại trong những không gian vàng xa lạ. Cả hai thử liên lạc và đều chỉ nhận lại tĩnh điện.\n\nCả ba vừa ngồi cách nhau chưa tới một mét.\n\nGiờ không một tín hiệu nào tìm thấy hai người còn lại.\n\nKai không biết Iris đang ở đâu. Iris không biết Syvial đang ở đâu. Syvial không biết Kai ở đâu. Black Blood không nhận được một đường liên lạc thành công nào từ họ.\n\nKhông tọa độ. Không beacon. Không telemetry. Không lời giải thích.\n\nKai chỉ có căn phòng vàng trước mặt, tiếng đèn huỳnh quang trên đầu và những lối đi không cho thấy chúng dẫn tới đâu."},{role:"gm",text:"TURN 1\n\nKhông có liên lạc với Iris, Syvial hay Black Blood. Bạn điều khiển Kai từ đây."}]};
const byId=id=>document.getElementById(id);const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;let busy=false;if(state.turn===1&&Array.isArray(state.log)&&state.log[0]&&String(state.log[0].text||"").length<1000){state.log[0]=initial.log[0];localStorage.setItem("backroom-apk-state",JSON.stringify(state));}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}function render(){titleEl.textContent=state.title;turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(state.party);inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");logEl.scrollTop=logEl.scrollHeight;statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}function load(){state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;render()}function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Gemini đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=JSON.parse(json);actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" đã lưu trên máy.";render()};window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi Gemini: "+message};render();
</script></body></html>
