const prologue=`Năm 2299.

Không ai biết chính xác vụ mất tích đầu tiên xảy ra từ bao giờ.

SRU đã thử tìm một điểm bắt đầu.

Không có.

Càng kéo hồ sơ ngược về quá khứ, số vụ tưởng như chẳng liên quan càng chồng lên nhau.

Một người bước qua cánh cửa rồi không xuất hiện ở phía bên kia.

Một nhóm biến mất khỏi một nơi không có đường thoát nào khác.

Có người được nhìn thấy lần cuối trong một căn phòng khóa kín. Có người mất tích giữa lúc đang di chuyển. Có trường hợp toàn bộ dấu vết dừng lại đột ngột, như thể từ khoảnh khắc ấy người đó không còn đứng trong cùng một thế giới với những người đang tìm họ nữa.

Những vụ việc cách nhau hàng thập kỷ.

Hàng thế kỷ.

Thuộc về những thời đại chưa từng có khả năng trao đổi thông tin với nhau.

Phần lớn không bao giờ được giải đáp.

Nhưng một số rất ít người đã trở về.

Đó mới là phần khiến SRU chú ý.

Họ không trở về từ cùng một nơi.

Không trở về sau cùng một khoảng thời gian.

Có người biến mất trong thời gian ngắn nhưng khẳng định mình đã lang thang nhiều ngày. Người khác mất tích nhiều năm nhưng cơ thể chỉ già đi rất ít. Một số gần như không còn nhớ gì. Một số nhớ quá nhiều, nhưng lời kể của họ mâu thuẫn đến mức ban đầu bị xếp cùng ảo giác, sang chấn tâm lý hoặc những hồ sơ không thể kiểm chứng.

Cho đến khi SRU đặt chúng cạnh nhau.

Tường vàng.

Thảm ẩm.

Đèn huỳnh quang.

Những hành lang không dẫn về nơi chúng vừa rời đi.

Những căn phòng lớn hơn kích thước đáng lẽ phải có.

Những khu vực thay đổi khi không còn ai nhìn.

Và một cái tên xuất hiện trong nhiều tài liệu khác nhau.

Backrooms.

Không ai trong SRU coi cái tên đó là lời giải.

Nó chỉ là thứ những người sống sót dùng để gọi nơi đã nuốt họ.

Rồi trong quá trình truy lại nguồn gốc các báo cáo, một cái tên thứ hai bắt đầu xuất hiện.

Không thường xuyên.

Không nhất quán.

Nhưng đủ nhiều để không thể bỏ qua.

Async.

Một tổ chức mà những gì SRU thu thập được không đủ để trả lời câu hỏi đơn giản nhất:

Họ đã biết gì?

Trong phòng điều phối nhiệm vụ, cái tên ấy nằm im giữa màn hình trung tâm.

Không biểu tượng.

Không hồ sơ tổ chức hoàn chỉnh.

Chỉ có những mảnh dữ liệu được đánh dấu chưa xác minh và một chuỗi liên hệ quá đáng ngờ để tiếp tục coi là trùng hợp.

Kai đứng trước màn hình thêm vài giây rồi tắt nó.

“Vậy là chúng ta chuẩn bị bước vào một nơi có thể nuốt người khỏi lịch sử để tìm một tổ chức mà hồ sơ còn không thống nhất họ đã làm gì.”

Iris đang kiểm tra Ebony. Cô xoay khẩu súng trong tay, nhìn lại khóa an toàn rồi đặt nó về vị trí mang.

“Anh nói như thể đây là lần đầu SRU nhận một nhiệm vụ có phần mô tả khiến người ta muốn xin nghỉ phép.”

Kai quay sang cô.

“Anh đang cân nhắc đấy.”

“Anh là đội trưởng.”

“Đó chính là lý do anh cần nghỉ.”

Iris ngẩng lên nhìn hắn một lúc rồi lắc đầu.

Ở phía bên kia phòng, Syvial vừa hoàn tất đồng bộ Lucifer Armor. Những điểm sáng magenta chạy dọc các phân mảng giáp rồi ổn định trở lại. GodKiller nằm sau lưng cô, lớn đến mức một người bình thường có lẽ sẽ cần cả hai tay chỉ để nhấc nổi phần chuôi.

Syvial bước tới.

“Anh xin nghỉ sau khi về.”

Kai nhìn cô.

“Nghe không giống lời khuyên lắm.”

“Vì em đâu có khuyên.”

Iris bật cười rất khẽ.

Syvial liếc sang cô.

“Có gì vui à?”

“Không. Em chỉ thấy anh ấy vừa mất quyền biểu quyết mà không nhận ra thôi.”

Kai nhìn từ người này sang người kia.

“Anh bắt đầu nhớ vì sao người ta không nên để cấp dưới thân nhau quá.”

Syvial chỉnh lại một chốt trên găng tay.

“Muộn rồi.”

Cuộc nói chuyện dừng ở đó khi tín hiệu chuẩn bị vang lên.

Không ai cần nhắc người còn lại rằng đây không phải một chuyến khảo sát thông thường.

Phía sau lớp kính bảo vệ cuối phòng là cổng thời-không.

Một vòng cấu trúc khổng lồ bao quanh một bề mặt ánh sáng trông gần như phẳng. Không có hình ảnh của nơi bên kia. Không có đường chân trời. Chỉ là một lớp sáng nhạt liên tục thay đổi độ sâu mỗi khi nhìn lâu hơn vài giây.

SRU đã thử nghiệm nó nhiều lần.

Vật vô tri đi qua và được thu hồi.

Tín hiệu truyền qua ổn định.

Sai số nằm trong giới hạn cho phép.

Các lần kiểm tra cuối không phát hiện hiện tượng lệch tọa độ.

Trên màn hình trạng thái phía trên cổng, một chữ màu xanh vẫn giữ nguyên.

ỔN ĐỊNH.

Kai nhìn nó.

“Anh ghét từ đó.”

Iris bước lên cạnh hắn.

“Vì?”

“Bất cứ khi nào một kỹ sư bảo thứ gì đó hoàn toàn ổn định, vài tiếng sau anh thường phải bắn vào nó.”

“Không có ai nói hoàn toàn.”

Kai quay đầu.

“Cảm ơn. Tốt hơn hẳn.”

Iris thở ra qua mũi, nhưng khóe môi cô động nhẹ.

Syvial đứng bên trái Kai. Cô không nhìn cổng ngay. Ánh mắt dừng ở hắn trước.

“Kênh đội hình?”

Kai kiểm tra.

“Hoạt động.”

Iris đáp ngay sau đó.

“Em nhận được cả hai người.”

Syvial nói:

“Em cũng vậy.”

Kai chuyển SRU Assault Rifle MK19 về tư thế mang sẵn trước ngực.

Mục tiêu của nhiệm vụ rất rõ.

Xác nhận Backrooms có phải hiện tượng đứng sau chuỗi mất tích xuyên các thời đại hay không.

Tìm bằng chứng về những người đã biến mất.

Xác định Async đã tiếp cận nơi này đến mức nào.

Và nếu có thể, tìm ra một con đường trở về đủ đáng tin để SRU không phải tiếp tục chờ những người mất tích tự xuất hiện trở lại.

Không ai nói tới khả năng nhiệm vụ thất bại.

Không cần thiết.

Kai nhìn Iris rồi Syvial.

“Sau khi qua cổng, giữ khoảng cách nhìn thấy được. Không đuổi theo bất cứ thứ gì một mình. Nếu môi trường khác dữ liệu dự kiến thì chúng ta dừng lại và kiểm tra trước.”

Syvial gật đầu.

“Biết rồi.”

Iris kiểm tra khoảng cách với hai người.

“Em sẽ đọc địa hình trước khi đội hình di chuyển sâu.”

Kai nghiêng đầu.

“Nghe có vẻ rất chuyên nghiệp.”

“Anh có thể thử một lần.”

“Để lần sau.”

Ba người tiến đến cổng.

Không có nghi thức.

Không có bài phát biểu.

Kai bước qua trước.

Syvial theo sát bên trái.

Iris giữ phía phải.

Trong khoảnh khắc đầu tiên, mọi thứ hoạt động đúng như các lần thử nghiệm.

Kai vẫn cảm nhận được sàn dưới chân.

Vẫn nghe thấy tiếng bước của hai người bên cạnh.

Kênh liên lạc vẫn mở.

Rồi khoảng cách giữa ba người thay đổi.

Không phải họ bị đẩy ra xa nhau.

Không ai di chuyển.

Nhưng Syvial bỗng đứng ở một vị trí mà Kai không thể xác định là bên trái nữa.

Iris vẫn chỉ cách hắn chưa đầy hai mét, đồng thời lại giống như đang ở rất xa.

Kai quay đầu.

“Iris?”

“Em vẫn ở đây.”

Giọng cô đến ngay trong tai nghe.

Nhưng môi Iris chuyển động chậm hơn âm thanh.

Syvial lập tức nhận ra vấn đề.

“Kai, đừng di chuyển.”

“Anh không di chuyển.”

Không gian quanh họ kéo dài.

Không phải về một hướng.

Mọi hướng.

Bề mặt ánh sáng của cổng biến mất. Phòng điều phối phía sau cũng không còn. Không có một điểm nào để xác định đâu là trước, đâu là sau.

Iris giơ tay về phía họ.

“Kênh định vị đang lệch. Em nhận được ba vị trí khác nhau.”

Kai vừa đưa tay ra thì khoảng cách giữa hắn và cô tăng lên mà không hề có chuyển động.

“Iris!”

Lần này cô không trả lời.

Syvial quay phắt sang Kai.

Cô đưa tay về phía hắn.

“Kai.”

Những ngón tay chỉ còn cách nhau một khoảng rất ngắn.

Rồi giữa hai bàn tay xuất hiện một khoảng không không có chiều sâu.

Kai chụp lấy.

Không chạm được gì.

Ánh magenta trên Lucifer Armor bị kéo thành một đường mảnh rồi đứt.

Syvial biến mất.

Cùng lúc đó, tín hiệu của Iris mất khỏi kênh.

Không tiếng nổ.

Không chấn động.

Không cảnh báo.

Cánh cổng đã được xác nhận ổn định chỉ đơn giản thôi đưa ba người tới cùng một nơi.

Trong chưa đầy một nhịp tim, đội hình SRU bị xé thành ba hướng khác nhau của một không gian không còn tuân theo những quy tắc mà họ mang theo từ năm 2299.

Rồi trọng lực trở lại.

Kai rơi chưa đầy nửa mét.

Hai chân chạm xuống một bề mặt mềm và ẩm.

Hắn lập tức hạ thấp trọng tâm, MK19 rời tư thế mang trong cùng chuyển động. Nòng súng quét qua vùng trước mặt rồi dừng lại khi không có mục tiêu được xác nhận.

Không có tiếng súng.

Không có tiếng người.

Chỉ có tiếng điện.

Một tiếng ù đều đặn, liên tục, dày đến mức vài giây sau nó gần như biến thành một phần của không khí.

Kai đứng thẳng hơn.

Tường màu vàng.

Không phải một sắc vàng duy nhất. Có mảng nhạt, mảng sẫm, những vùng giấy dán tường cũ hơn phần còn lại. Hoa văn lặp lại nhưng không hoàn toàn giống nhau.

Trần ghép bằng những ô vuông.

Đèn huỳnh quang kéo dài thành từng hàng không theo một bố cục mà hắn nhận ra.

Không cửa sổ.

Không có phòng điều phối SRU phía sau.

Dưới chân hắn, lớp thảm ẩm phát ra một âm thanh rất nhẹ khi giày dịch chuyển. Mùi mốc trộn với mùi hóa chất cũ bám trong không khí.

Kai không bước tiếp.

Hắn kiểm tra tình trạng giáp.

Ổn định.

MK19.

Hoạt động.

Kênh đội hình.

Không tín hiệu.

“Iris.”

Không trả lời.

“Syvial.”

Chỉ có tiếng ù.

Kai chuyển sang kênh SRU.

“Twilight gọi trung tâm. Xác nhận sự cố cổng. Đội hình bị phân tán. Trả lời.”

Không gì ngoài nhiễu.

Hắn thử lại bằng đường dự phòng.

Rồi thêm một kênh khác.

Không có tín hiệu từ năm 2299.

Không có tín hiệu từ Iris.

Không có tín hiệu từ Syvial.

Kai nhìn lại nơi mình vừa xuất hiện.

Không có cổng.

Không có dấu cháy.

Không có biến dạng.

Chỉ là một khoảng phòng trống giống hàng chục khoảng phòng khác trải ra phía trước.

Hắn không gọi thêm.

Không phải vì thôi lo.

Ngược lại.

Kai biết rõ hai người kia đủ mạnh để tự bảo vệ mình. Syvial không cần hắn đứng cạnh mới biết chiến đấu. Iris cũng không phải người sẽ hoảng loạn chỉ vì đội hình bị phá.

Nhưng sức mạnh không giải quyết được một bài toán nếu người ta không biết mình đang ở đâu.

Và Kai không có ý định bỏ mặc đồng đội trong một nơi mà chính hình học còn không chịu đứng yên.

Hắn đánh dấu vị trí xuất hiện bằng một dấu đơn giản, không đặt niềm tin tuyệt đối vào nó, rồi nhìn sang hành lang bên phải.

Từ rất xa vọng lại một âm thanh.

Giống tiếng bước chân.

Kai giữ nguyên vị trí.

Âm thanh cũng dừng.

Hắn đợi.

Không có gì xuất hiện.

Không có đủ bằng chứng để gọi nó là người.

Cũng không có đủ bằng chứng để gọi nó là thứ khác.

Kai đưa MK19 lên thấp hơn tầm mắt và bắt đầu di chuyển.

Nhiệm vụ điều tra Async vẫn còn.

Chuỗi người mất tích vẫn còn.

Backrooms vẫn còn ở đây.

Nhưng ưu tiên đầu tiên đã thay đổi.

Tìm Iris.

Tìm Syvial.

Sau đó mới hỏi nơi này đã nuốt bao nhiêu người khỏi lịch sử.

Kai rẽ qua góc tường đầu tiên.

Phía sau hắn, tiếng đèn huỳnh quang tiếp tục ù đều như thể chưa từng có ai xuất hiện.

  inventory:[
    {name:"White Wraith Magnum"},
    {name:"Blackblood Armor & linked modules"},
    {name:"Omnivault Ring / Nhẫn Vạn Tàng"}
  ],
  flags:{communication:{blackBlood:"OFFLINE",iris:"OFFLINE",syvial:"OFFLINE"}},
  log:[
    {role:"gm",text:"MỞ ĐẦU\n\n"+prologue},
    {role:"gm",text:"LƯỢT 1\n\nKhông có liên lạc với Iris, Syvial hay trung tâm SRU. Bạn điều khiển Kai từ đây."}
  ]
};

const byId=id=>document.getElementById(id);
const titleEl=byId("title"),turnEl=byId("turn"),locationEl=byId("location"),modeEl=byId("mode"),playerEl=byId("player"),partyEl=byId("party"),inventoryEl=byId("inventory"),logEl=byId("log"),statusEl=byId("status"),formEl=byId("form"),actionEl=byId("action"),submitEl=byId("submit");
let state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;
let busy=false;

const oldPrologueSignatures=["Không beacon. Không telemetry.","Bữa tối bắt đầu như bao lần khác."];
if(state.turn===1&&Array.isArray(state.log)&&state.log[0]){
  const currentOpening=String(state.log[0].text||"");
  if(currentOpening.length<1000||oldPrologueSignatures.some(sig=>currentOpening.includes(sig))){
    state.log[0]=initial.log[0];
    if(state.log[1]&&String(state.log[1].text||"").startsWith("TURN 1")) state.log[1]=initial.log[1];
    localStorage.setItem("backroom-apk-state",JSON.stringify(state));
  }
}

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function chips(items){return items&&items.length?items.map(x=>"<span>"+esc(typeof x==="string"?x:x.name||"—")+"</span>").join(""):"<span>Trống.</span>"}
function render(){titleEl.textContent=state.title;turnEl.textContent=state.turn;locationEl.textContent=state.location;modeEl.textContent=state.mode;playerEl.textContent=state.player?.name||"Kai Akechi";partyEl.innerHTML=chips(state.party);inventoryEl.innerHTML=chips(state.inventory);logEl.innerHTML=(state.log||[]).map(x=>"<article class='message "+(x.role==="player"?"player":"")+"'><div class='role'>"+(x.role==="player"?"BẠN":"GAME MASTER")+"</div><div class='text'>"+esc(x.text)+"</div></article>").join("");logEl.scrollTop=logEl.scrollHeight;statusEl.textContent="Save được lưu riêng trên thiết bị này."}
function save(){localStorage.setItem("backroom-apk-state",JSON.stringify(state));statusEl.textContent="Đã lưu save trên máy."}
function load(){state=JSON.parse(localStorage.getItem("backroom-apk-state")||"null")||initial;render()}
function resetGame(){if(confirm("Bắt đầu lại từ Turn 1?")){state=JSON.parse(JSON.stringify(initial));save();render()}}
function clearSave(){if(confirm("Xóa save trên máy?")){localStorage.removeItem("backroom-apk-state");state=JSON.parse(JSON.stringify(initial));render()}}
formEl.addEventListener("submit",e=>{e.preventDefault();const a=actionEl.value.trim();if(!a||busy)return;if(!window.Android){statusEl.textContent="Không tìm thấy Android bridge.";return}busy=true;submitEl.disabled=true;statusEl.textContent="Gemini đang xử lý lượt…";window.Android.submitTurn(JSON.stringify(state),a)});
window.backroomTurn=json=>{state=JSON.parse(json);actionEl.value="";busy=false;submitEl.disabled=false;save();statusEl.textContent="Turn "+state.turn+" đã lưu trên máy.";render()};
window.backroomError=message=>{busy=false;submitEl.disabled=false;statusEl.textContent="Lỗi Gemini: "+message};
render();
</script>
</body>
</html>
