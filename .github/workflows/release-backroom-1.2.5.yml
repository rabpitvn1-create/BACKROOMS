name: Release Backroom 1.2.5

on:
  workflow_run:
    workflows: ["Build Backroom 1.2.5 Debug"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-backroom-1.2.5
  cancel-in-progress: false

jobs:
  publish-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release source version
        run: |
          set -euo pipefail
          grep -q "versionCode 80" android-apk/app/build.gradle
          grep -q "versionName '1.2.5'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.2.5.txt

      - name: Download verified 1.2.5 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf release-input
          mkdir -p release-input
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'Backroom-1.2.5-debug-apk' --dir release-input
          test -s release-input/Backroom-1.2.5-debug.apk
          cp release-input/Backroom-1.2.5-debug.apk Backroom-1.2.5.apk
          sha256sum Backroom-1.2.5.apk | tee release-apk.sha256

      - name: Verify APK before publication
        run: |
          set -euo pipefail
          APK=Backroom-1.2.5.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='80'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='1.2.5'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          rm -rf apk-check && mkdir apk-check
          unzip -q "$APK" 'assets/entity/Newviolet.png' -d apk-check
          test -s apk-check/assets/entity/Newviolet.png

      - name: Publish GitHub Release v1.2.5
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view v1.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.5" --jq '.object.sha')
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "v1.2.5 is already published from immutable tag $TAG_SHA; current build is $RELEASE_SHA. Not overwriting an existing release tag."
              echo "verify_current=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v1.2.5 already exists at the expected commit; leaving it untouched."
            echo "verify_current=true" >> "$GITHUB_OUTPUT"
          else
            gh release create v1.2.5 Backroom-1.2.5.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Backroom 1.2.5 Debug" \
              --notes-file android-apk/RELEASE_NOTES_1.2.5.txt
            echo "verify_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify published GitHub Release
        if: steps.release.outputs.verify_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(sha256sum Backroom-1.2.5.apk | awk '{print $1}')
          rm -f Backroom-1.2.5-verified.apk
          gh release download v1.2.5 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.2.5.apk' --output Backroom-1.2.5-verified.apk
          test -s Backroom-1.2.5-verified.apk
          ACTUAL_SHA=$(sha256sum Backroom-1.2.5-verified.apk | awk '{print $1}')
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.2.5-verified.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.5-verified.apk | grep -q "versionCode='80'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.5-verified.apk | grep -q "versionName='1.2.5'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.2.5-verified.apk
          rm -rf published-check && mkdir published-check
          unzip -q Backroom-1.2.5-verified.apk 'assets/entity/Newviolet.png' -d published-check
          test -s published-check/assets/entity/Newviolet.png
          gh release view v1.2.5 --repo "$GITHUB_REPOSITORY" --json url,tagName,name,isDraft,isPrerelease
