name: "Temporary: purge old Actions runs"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-purge-old-actions.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-purge-old-actions
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs before today in Vietnam
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff_date="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          cutoff_epoch="$(TZ=Asia/Ho_Chi_Minh date -d "$cutoff_date 00:00:00" +%s)"
          cutoff_utc="$(date -u -d "@$cutoff_epoch" +%Y-%m-%dT%H:%M:%SZ)"

          echo "Deleting workflow runs created before $cutoff_date 00:00:00 Asia/Ho_Chi_Minh ($cutoff_utc UTC)."

          deleted=0
          while :; do
            response="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs"                 -f per_page=100                 -f page=1                 -f "created=<$cutoff_utc"
            )"

            count="$(jq '.workflow_runs | length' <<<"$response")"
            if [[ "$count" -eq 0 ]]; then
              break
            fi

            mapfile -t run_ids < <(
              jq -r --arg current "$GITHUB_RUN_ID"                 '.workflow_runs[] | select((.id | tostring) != $current) | .id'                 <<<"$response"
            )

            if [[ "${#run_ids[@]}" -eq 0 ]]; then
              break
            fi

            for run_id in "${run_ids[@]}"; do
              echo "Deleting workflow run $run_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
              deleted=$((deleted + 1))
            done
          done

          echo "Deleted $deleted workflow run(s)."

      - name: Remove this temporary workflow
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          workflow_path=".github/workflows/temporary-purge-old-actions.yml"
          file_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/$workflow_path?ref=main" --jq '.sha'
          )"

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$workflow_path"             -f message="Remove temporary Actions cleanup workflow"             -f sha="$file_sha"             -f branch="main"             >/dev/null

          echo "Temporary workflow removed from main."
