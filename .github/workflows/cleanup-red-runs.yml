name: Cleanup red Actions runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-red-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: delete-red-runs-last-two-hours
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs since 2026-08-31 04:13 UTC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="2026-08-31T04:13:00Z"
          deleted=0
          mapfile -t ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?created=>=$cutoff&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | .id'
          )
          for id in "${ids[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted red workflow runs since $cutoff."
