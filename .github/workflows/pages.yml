name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pages/**'
      - 'engine/**'
      - 'apk-original/classes3.dex'
      - 'apk-original/classes4.dex'
      - 'scripts/*pages*'
      - 'scripts/*engine*'
      - 'scripts/level_travel.py'
      - 'scripts/PatchLevelTravel.java'
      - 'scripts/test_live_turn.cjs'
      - 'scripts/test_combat_pages.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover original gameplay bytecode
        run: python3 scripts/prepare_web_engine.py
      - name: Compile the gameplay core to JavaScript
        run: mvn -B -f engine/pom.xml package
      - name: Verify gameplay core and browser host
        run: node scripts/test_engine.cjs
      - name: Stage browser fixtures
        run: python3 scripts/build_pages.py --test-config
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the single mobile UI and gameplay at every viewport
        run: |
          mkdir -p build/test-host
          ln -s "$GITHUB_WORKSPACE/build/pages" build/test-host/Backrooms
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build/test-host > build/browser-server.log 2>&1 &
          node scripts/test_mobile_only.cjs
          node scripts/test_pages.cjs
          node scripts/test_action_feedback.cjs
          node scripts/test_combat_pages.cjs
          node scripts/test_offline_art.cjs
      - name: Stage the keyless public playable build (API proxy holds keys)
        run: |
          python3 scripts/build_pages.py --test-config
          node scripts/test_live_turn.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
      - name: Deploy playable Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the mobile-only layout on the published GitHub Pages
        env:
          PAGES_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test_mobile_only.cjs
      - name: Verify a real AI turn on the published game
        env:
          PAGES_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test_live_turn.cjs
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/playable-*.png
            build/mobile-only-*.png
          if-no-files-found: ignore

