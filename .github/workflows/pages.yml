name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pages/**'
      - 'engine/**'
      - 'apk-original/classes3.dex'
      - 'apk-original/classes4.dex'
      - 'scripts/*pages*'
      - 'scripts/*engine*'
      - 'scripts/test_live_turn.cjs'
      - 'scripts/test_combat_pages.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover original gameplay bytecode
        run: python3 scripts/prepare_web_engine.py
      - name: Compile the gameplay core to JavaScript
        run: mvn -B -f engine/pom.xml package
      - name: Verify gameplay core and browser host
        run: node scripts/test_engine.cjs
      - name: Stage browser fixtures
        run: python3 scripts/build_pages.py --test-config
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify mobile and desktop gameplay
        run: |
          mkdir -p build/test-host
          ln -s "$GITHUB_WORKSPACE/build/pages" build/test-host/Backrooms
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build/test-host > build/browser-server.log 2>&1 &
          node scripts/test_pages.cjs
          node scripts/test_action_feedback.cjs
          node scripts/test_combat_pages.cjs
          node scripts/test_offline_art.cjs
      - name: Stage the approved six-key public playable build
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          AGRON_API_KEY: ${{ secrets.AGRON_API_KEY }}
          AGRON_BASE_URL: ${{ secrets.AGRON_BASE_URL }}
          AGRON_MODEL: ${{ secrets.AGRON_MODEL }}
        run: |
          python3 - <<'PYCONFIG'
          import json,os
          from pathlib import Path
          p=Path('build/runtime.json')
          p.write_text(json.dumps({'keys':[os.environ[f'GEMINI_API_KEY_{i}'] for i in range(1,7)],
            'argon':{'key':os.environ.get('AGRON_API_KEY',''),'base_url':os.environ.get('AGRON_BASE_URL',''),'model':os.environ.get('AGRON_MODEL','')}}))
          p.chmod(0o600)
          PYCONFIG
          python3 scripts/build_pages.py --config build/runtime.json
          rm build/runtime.json
          node scripts/test_live_turn.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
      - name: Deploy playable Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify a real AI turn on the published game
        env:
          PAGES_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test_live_turn.cjs
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/playable-*.png
          if-no-files-found: ignore
