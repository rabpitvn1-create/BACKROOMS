name: TEMP Sync character art from Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-drive-character-art.yml"

permissions:
  contents: write

concurrency:
  group: temp-sync-drive-character-art
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Drive assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drive-assets"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20             "https://drive.usercontent.google.com/download?id=1IPHbd4FfFfP3ppVj571KCb-mC3tJUzie&export=download&confirm=t"             -o "$RUNNER_TEMP/drive-assets/cao_minh_avatar.jpg"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20             "https://drive.usercontent.google.com/download?id=1cM_6OQ3LbQwZXX_uU3vdOK2JLxiL2w9l&export=download&confirm=t"             -o "$RUNNER_TEMP/drive-assets/lucia_overlay.png"

          test "$(stat -c%s "$RUNNER_TEMP/drive-assets/cao_minh_avatar.jpg")" = "470266"
          test "$(stat -c%s "$RUNNER_TEMP/drive-assets/lucia_overlay.png")" = "2374835"
          echo "bddf46b160f690dcfe300d7ac603a2663ceb47fe2042424d8fe571b064f9fb67  $RUNNER_TEMP/drive-assets/cao_minh_avatar.jpg" | sha256sum -c -
          echo "66ae60dcd2a08eb644ccc67b953e0b7de62c4c28ddfd24c26cea143db1d3961b  $RUNNER_TEMP/drive-assets/lucia_overlay.png" | sha256sum -c -

      - name: Commit Drive assets directly to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p android-apk/app/src/main/assets/avatars
            install -m 0644 "$RUNNER_TEMP/drive-assets/cao_minh_avatar.jpg"               android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg
            install -m 0644 "$RUNNER_TEMP/drive-assets/lucia_overlay.png"               android-apk/app/src/main/assets/lucia_overlay.png

            echo "bddf46b160f690dcfe300d7ac603a2663ceb47fe2042424d8fe571b064f9fb67  android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg" | sha256sum -c -
            echo "66ae60dcd2a08eb644ccc67b953e0b7de62c4c28ddfd24c26cea143db1d3961b  android-apk/app/src/main/assets/lucia_overlay.png" | sha256sum -c -

            git add android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg                     android-apk/app/src/main/assets/lucia_overlay.png
            if git diff --cached --quiet; then
              echo "Drive assets already match main."
              break
            fi

            git commit -m "Sync Cao Minh avatar and Lucia overlay from Drive"
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push Drive assets after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Verify assets on GitHub main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:android-apk/app/src/main/assets/avatars/cao_minh_avatar.jpg > "$RUNNER_TEMP/verify-cao.jpg" || true
            git show origin/main:android-apk/app/src/main/assets/lucia_overlay.png > "$RUNNER_TEMP/verify-lucia.png" || true
            if echo "bddf46b160f690dcfe300d7ac603a2663ceb47fe2042424d8fe571b064f9fb67  $RUNNER_TEMP/verify-cao.jpg" | sha256sum -c -               && echo "66ae60dcd2a08eb644ccc67b953e0b7de62c4c28ddfd24c26cea143db1d3961b  $RUNNER_TEMP/verify-lucia.png" | sha256sum -c -; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::GitHub main does not contain the exact Drive bytes."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/temp-sync-drive-character-art.yml
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sha=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=main" --jq '.sha' 2>/dev/null || true)
            if [ -z "$sha" ]; then
              echo "Temporary workflow already removed."
              exit 0
            fi
            if gh api --method DELETE "repos/$REPO/contents/$WORKFLOW_PATH"               -f message='Remove temporary Drive art sync workflow'               -f sha="$sha"               -f branch=main >/dev/null; then
              echo "Temporary workflow removed."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Asset sync succeeded but temporary workflow cleanup failed."
              exit 1
            fi
            sleep $((attempt * 2))
          done
