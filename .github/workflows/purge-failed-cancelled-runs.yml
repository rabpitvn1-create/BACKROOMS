name: Purge Failed and Cancelled Runs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/purge-failed-cancelled-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all failed and cancelled workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          {
            gh api --paginate "/repos/$GH_REPOSITORY/actions/runs?status=failure&per_page=100" --jq '.workflow_runs[].id'
            gh api --paginate "/repos/$GH_REPOSITORY/actions/runs?status=cancelled&per_page=100" --jq '.workflow_runs[].id'
          } | sort -u > /tmp/purge-run-ids.txt

          total="$(wc -l < /tmp/purge-run-ids.txt | tr -d ' ')"
          deleted=0
          failed=0

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh api --method DELETE "/repos/$GH_REPOSITORY/actions/runs/$run_id"; then
              deleted=$((deleted + 1))
            else
              echo "::error::Could not delete workflow run $run_id"
              failed=$((failed + 1))
            fi
          done < /tmp/purge-run-ids.txt

          {
            echo "### Workflow run purge"
            echo
            echo "- Matched: $total"
            echo "- Deleted: $deleted"
            echo "- Failed deletions: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$failed" -eq 0
