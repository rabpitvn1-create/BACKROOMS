          import json
          from pathlib import Path

          report = json.loads(Path("android-apk/app/build/reports/canon-p1/reference-shadow.json").read_text(encoding="utf-8"))
          assert report["schemaVersion"] == 1
          assert report["mode"] == "shadow_only"
          assert report["legacyReferencePriorityGate"] == 55
          assert report["edgeCount"] == len(report["edges"])
          counts = report["counts"]
          assert report["edgeCount"] == counts["legacyFollowed"] + counts["related"] + counts["missing"]

          edges = {(edge["from"], edge["to"]): edge for edge in report["edges"]}
          assert edges[("CHAR.KAI.GUILTY_CROWN_OVERRIDE", "CHAR.KAI.DEVIL_TRIGGER")]["shadowClass"] == "LEGACY_FOLLOWED"
          assert edges[("LEVEL.01", "ENTITY.HOUND")]["shadowClass"] == "RELATED"
