name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - "lib/canon.js"
      - "scripts/sync-prologue.py"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY || secrets.OPENAI_KEY || secrets.GPT_API_KEY_1 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare user-provided Kai PNG
        run: |
          set -eu
          URL="https://i.ibb.co/twnKQqp9/file-000000004df08207a9649bcba5423a25.png"
          REFERER="https://ibb.co/mrdTb953"
          SOURCE="android-apk/kai_snapshot_overlay.png"
          TEMP="$SOURCE.tmp"
          EXPECTED_SHA256="97afd75745439ca9fb563bdc83a12693fe12a1a8f63136076deafa84d774efa2"

          rm -f "$TEMP"
          if ! curl -L --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -A "Mozilla/5.0" -e "$REFERER" \
            "$URL" -o "$TEMP"; then
            rm -f "$TEMP"
            wget -q --timeout=30 --tries=3 \
              --user-agent="Mozilla/5.0" --referer="$REFERER" \
              -O "$TEMP" "$URL"
          fi

          echo "$EXPECTED_SHA256  $TEMP" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path("android-apk/kai_snapshot_overlay.png.tmp")
          raw = p.read_bytes()
          if raw[:8] != b"\x89PNG\r\n\x1a\n" or len(raw) < 24:
              raise SystemExit("Kai asset is not a valid PNG")
          width, height = struct.unpack(">II", raw[16:24])
          if (width, height) != (1086, 1448):
              raise SystemExit(f"Unexpected Kai PNG dimensions: {width}x{height}")
          print(f"Kai PNG verified: {width}x{height}, {len(raw)} bytes")
          PY
          mv "$TEMP" "$SOURCE"

      - name: Persist Kai PNG to repository
        continue-on-error: true
        run: |
          set -eu
          SOURCE="android-apk/kai_snapshot_overlay.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          if git diff --cached --quiet; then
            echo "Kai PNG is already committed."
            exit 0
          fi
          git commit -m "Add user-provided Kai PNG [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "Kai PNG was prepared for this APK build, but persistence to main failed."
          exit 1

      - name: Synchronize Prologue sources
        run: python3 scripts/sync-prologue.py

      - name: Persist synchronized server canon
        continue-on-error: true
        run: |
          if ! git diff --quiet -- lib/canon.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/canon.js
            git commit -m "Sync Prologue source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate Game Master configuration
        run: |
          test -n "$GEMINI_API_KEY_1" || (echo "Missing GitHub Secret: GEMINI_API_KEY_1" && exit 1)
          test -n "$GEMINI_API_KEY_2" || (echo "Missing GitHub Secret: GEMINI_API_KEY_2" && exit 1)
          test -n "$LUNA_API_KEY" || (echo "Missing GitHub Secret: LUNA_API_KEY" && exit 1)
          test -n "$LUNA_MODEL" || (echo "Missing GitHub Secret: LUNA_MODEL" && exit 1)

      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply Gemini-first Game Master fallback patch
        run: python3 android-apk/patch-luna-text.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Prepare Snapshot UI/provider hooks
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py

      - name: Replace Kai overlay with user PNG
        run: |
          set -eu
          cp android-apk/kai_snapshot_overlay.png android-apk/app/src/main/assets/kai_snapshot_overlay.png
          rm -f android-apk/app/src/main/assets/kai_snapshot_overlay.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace("kai_snapshot_overlay.webp", "kai_snapshot_overlay.png")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Inject Kai R05 character codex
        run: python3 android-apk/patch-kai-codex.py
      - name: Inject Drive R06 canon and gameplay gates
        run: python3 android-apk/patch-drive-canon-gameplay.py
      - name: Leave Snapshot provider unconfigured
        run: python3 android-apk/patch-snapshot-unconfigured.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.27.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.27-debug-apk
          path: Backroom-1.1.27.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.27
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.27"
          TITLE="Backroom 1.1.27"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.27.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.27.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.27.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
