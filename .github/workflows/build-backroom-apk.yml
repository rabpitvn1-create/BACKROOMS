            if gh release download v1.1.63.0.6 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.63.0.6.apk' --output Backroom-1.1.63.0.6-verified.apk; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
