name: Build Backroom APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"
  workflow_dispatch:
    inputs:
      android_smoke:
        description: Run Android emulator smoke test
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          STATUS_DIR="$RUNNER_TEMP/release-status-$GITHUB_RUN_ID"
          rm -rf "$STATUS_DIR"
          git fetch origin main
          git worktree add --detach "$STATUS_DIR" origin/main
          cleanup_status_worktree() {
            git worktree remove --force "$STATUS_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup_status_worktree EXIT
          (
            cd "$STATUS_DIR"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              mkdir -p release-status
              printf 'status=RUNNING\nversion=1.1.63.0.6\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.1.63.0.6-running.txt
              git add release-status/v1.1.63.0.6-running.txt
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m "Record active Backroom 1.1.63.0.6 run $GITHUB_RUN_ID"
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to record active run after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          )

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEHIHI_API_KEY GEHIHI_MODEL GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY SOL_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-provider-key-pool.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-ui-1.1.99-shell.py patch-poker-dice-core-backport.py patch-poker-dice-ui-119-polish.py patch-cao-minh-identity-overlay.py patch-item-detail-actions.py patch-item-whole-unit.py patch-cao-minh-skills-equipment.py patch-cao-minh-prologue.py patch-character-stats-1193a-restore.py patch-combat-feedback-1193a.py patch-combat-93-runtime.py patch-combat-93-snapshot.py patch-item-source-authority-final.py patch-item-registry-core.py patch-exit-discovery-engine.py patch-luc-tram-port.py patch-restore-four-1193a-entities.py patch-player-action-ime.py patch-level-entity-spawn-policy.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify 1.1.93a Entity port and 2 percent spawn windows
        run: python3 android-apk/verify-four-1193a-entities.py

      - name: Verify Player Action popup stays above Android keyboard
        run: node android-apk/verify-player-action-ime.mjs

      - name: Verify complete Novel Asset Canon index
        run: python3 android-apk/build-novel-asset-canon-index.py --check

      - name: Verify final runtime contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = (core / 'GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          madgod = (core / 'MadGodCanon.kt').read_text(encoding='utf-8')
          engines = (core / 'Engines.kt').read_text(encoding='utf-8')
          equipment_system = (core / 'CharacterEquipmentSystem.kt').read_text(encoding='utf-8')
          status_tests = (root / 'app/src/test/java/com/rabpit/backroom/core/CharacterStatusEquipmentSystemTest.kt').read_text(encoding='utf-8')
          stats_1193 = (root / 'app/src/test/java/com/rabpit/backroom/core/CharacterStats1193aRegressionTest.kt').read_text(encoding='utf-8')
          save_repo = (core / 'SaveRepository.kt').read_text(encoding='utf-8')
          combat = (core / 'CombatRuntime.kt').read_text(encoding='utf-8')
          skill_catalog = (core / 'CompanionSkillCatalog.kt').read_text(encoding='utf-8')
          detail_json = (core / 'CharacterDetailJson.kt').read_text(encoding='utf-8')
          an_nhien = (core / 'AnNhienCanon.kt').read_text(encoding='utf-8')
          skill_tests = (root / 'app/src/test/java/com/rabpit/backroom/core/CompanionSkillCatalogTest.kt').read_text(encoding='utf-8')
          chain = (root / 'patch-inventory-capacity-final-fix.py').read_text(encoding='utf-8')
          entity_dir = root / 'app/src/main/assets/entity'
          poker = (core / 'PokerDiceCore.kt').read_text(encoding='utf-8')
          poker_test = (root / 'app/src/test/java/com/rabpit/backroom/core/PokerDiceCoreBackportTest.kt').read_text(encoding='utf-8')
          dice_dir = root / 'app/src/main/assets/dice'

          required = [
              ("versionCode 71", gradle), ("versionName '1.1.63.0.6'", gradle),
              ('const prologue=`Lôi Thiên Vực chưa từng có một ngày yên tĩnh như thế.', html),
              ('Cao Minh tỉnh lại một mình tại Level 0. Không có dấu vết của Lục Trầm.', html),
              ('.snapshot{height:300px;margin:8px 10px 10px;', html),
              ('UI_119_BACKPORT_R01', html), ('id="playerActionBar"', html), ('id="playerActionModal"', html),
              ('id="playerActionConfirm"', html), ('id="gameMenuModal"', html), ('id="gameMenuOpen"', html),
              ('border-radius:7px', html), ('hud/player_action_backrooms.png', html),
              ('POKER_DICE_CORE_BACKPORT_R01', html), ('id="pokerDiceModal"', html), ('CORE STATS', html),
              ('DIRECT_COMBAT_GATE_V1', html), ('ensureDirectCombatDice', html),
              ('POKER_DICE_119_POLISH_R01', html), ('poker-die-shadow', html), ('poker-die-object', html),
              ('poker-die-hold-seal', html), ('@keyframes poker-die-3d', html), ('@keyframes poker-die-toss', html),
              ('@keyframes poker-die-shadow-roll', html), ('@keyframes poker-die-settle', html),
              ('DICE_ROLL_ANIMATION_MS=680', html), ('DICE_SETTLE_ANIMATION_MS=170', html),
              ('FINALIZE_PREVIEW_MS=2000', html), ('setProperty("--die-delay",String(index*-55)+"ms")', html),
              ('Android.combatDicePrepare', html), ('Android.coreUpgrade', html),
              ('object PokerDiceCore', poker), ('MAX_REROLLS = 3', poker), ('ENTITY_VICTORY_CORE = 2', poker),
              ('FOUR OF A KIND', poker), ('HELD_SEQUENCE_WEIGHT_BONUS', poker),
              ('PokerDiceCoreBackportTest', poker_test), ('rerollCapAndActionBindingAreUnchanged', poker_test),
              ('BuildConfig.GEHIHI_API_KEY', java), ('BuildConfig.GEHIHI_MODEL', java),
              ('BuildConfig.SOL_API_KEY', java), ('BuildConfig.HAKU_API_KEY', java),
              ('emit("backroomProvider", "Gehihi")', java), ('emit("backroomProvider", "Haku")', java), ('emit("backroomProvider", "SOL")', java),
              ('id="searchActionButton"', html), ('id="exploreActionButton"', html), ('STEP2_THREE_ACTIONS', html),
              ('madGodSetEquipped()', html), ('id="equipmentDetailModal"', html), ('window.renderCharacterStatusEquipment=render;', html),
              ('id="characterSkillsModal"', html), ("button.id='characterSkillsButton'", html), ('function openSkills()', html),
              ('const val CHEAT_CODE = "/madgod"', madgod), ('const val MADGOD_SET_ID = "madgod:set"', madgod),
              ('MadGodCanon.cheat(action)', facade), ('applyMadGodCheat(legacy,state)', facade),
              ('if (isMadGodEquipRequest(action))', facade), ('commandId = "$turnId:MADGOD:EQUIP"', facade),
              ('"madgod_equipped"', facade), ('output.put("equipment",MadGodCanon.legacy(state))', facade),
              ('ItemCommand.Operation.EQUIP -> EquipmentEngine.equip(state, command)', engines),
              ('ItemCommand.Operation.UNEQUIP -> EquipmentEngine.unequip(state, command)', engines),
              ('occupiesSlots = setOf(EquipmentSlot.WEAPON)', equipment_system),
              ('CharacterStatCore.effective(state, characterId)', equipment_system),
              ('CharacterStatEngine.preserveMissingHp', equipment_system),
              ('fun applyCompletedTurnRegen', equipment_system),
              ('equipmentDoesNotAlterCanonicalStats', status_tests),
              ('weaponDamageIsRawWeaponAttribute', status_tests),
              ('baselineAndCaoPassiveMatch1193a', stats_1193),
              ('legacySchemaResetsInsteadOfMappingAndPreservesHpSafely', stats_1193),
              ('antiForgeRestoresStatsCoreAndHp', stats_1193),
              ('daiDaoCombatStackIsSeparateAndResetsWithCombatMetadata', stats_1193),
              ('sceneKey:visualSceneKey()', java), ('r.sceneKey===visualSceneKey()', java),
              ('private int mentionedLevel(JSONObject state)', java),
              ('EXIT_STREAK_V1', java),
              ('ExitStreakEngine.advance(', java),
              ('ExitStreakEngine.hasMinimumInput(action)', java),
              ('combatTurnForStreak', java),
              ('streakLevelCompleted', java),
              ('patchValue.remove("exitStreak")', java),
              ('patchExploration.remove("exitStreak")', java),
              ('normalizedStreakState', java),
              ('put("exitStreak"', java),
              ('recordLevelProgress(state, streakLevelCompleted ? streakFromLevel : oldLevel, newLevel)', java),
              ('partyDetails&&state.partyDetails.members', java),
              ('rolls.put("roamingEntityKey"', java), ('file:///android_asset/entity/', java),
              ('"hotel_corpse_lure","jeff_the_killer","jane_the_killer","slenderman"', java),
              ('String entityKey = rolls.optString("roamingEntityKey", "").trim();', java),
              ('state = new JSONObject(requireGameCore().startCombatState(state.toString(), encounterKey));', java),
              ("function activeEntityKey(){var c=state&&state.combat;if(!c||c.active!==true)return '';return normalizeEntityKey(c.entityKey);}", java),
              ('private JSONObject resolveEntityOverlay(', java), ('window.backroomEntityOverlay=function(payload)', java),
              ('private void forceEntityEncounterFlag(JSONObject candidateState, JSONObject rolls)', java),
              ('forceEntityEncounterFlag(candidateState, rolls);', java),
              ('boolean exploreAction = "EXPLORE".equals(actionKindNormalized);', java),
              ('makeGameplayRolls(before, actionKind, action, false)', java),
              ("box.style.position='relative';box.style.overflow='hidden'", java),
              ('CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png', java), ('CAO_MINH_OVERLAY_EXPLORER_IDLE.png', java),
              ('class SharedPreferencesSaveRepository', save_repo),
              ('private fun normalizeVisualPresence(state: GameState): GameState', facade),
              ('Combat93Runtime.resolve(current, expectedCombatRevision(legacy))', facade),
              ('flags.put("entityEncounterKey", "")', facade),
              ('Combat93Runtime.migrate(loaded, legacy.optInt("turn", 1))', facade),
              ('thresholdRoll("diepMinhEncounter", 10000, 100,', java),
              ('int[] entityThresholds = {100, 100, 100, 100, 100, 100, 100}', java),
              ('entityKey = "diep_minh";', java),
              ('ARGUS // Thousandfold Execution', skill_catalog), ('Twosome Time', skill_catalog), ('Honeycomb Fire', skill_catalog),
              ('GodKiller Override // Twenty-Four Severance', skill_catalog), ('Crimson Guillotine', skill_catalog), ('Spatial Dominion', skill_catalog),
              ('Kế Hoạch Không Có Trong Kế Hoạch', skill_catalog), ('Quăng Đại Cái Gì Đó', skill_catalog),
              ('CompanionSkillCatalog.forCharacter(c.id)', detail_json), ('COMPANION_SKILLS_R01', combat), ('24 * 10', combat),
              ('hazardThresholds[level] * 75 / 100', java),
              ('class CompanionSkillCatalogTest', skill_tests),
              ('runpy.run_path(str(ROOT / "patch-companion-skills-ui-finalize.py"), run_name="__main__")', chain),
          ]
          for marker, source in required:
              assert marker in source, marker
          provider_start = java.index('  private String generateText(String prompt)')
          provider_end = java.index('\n  private JSONObject parseModelJson', provider_start)
          provider_flow = java[provider_start:provider_end]
          assert provider_flow.index('"Gehihi"') < provider_flow.index('"Gemini') < provider_flow.index('"Haku"') < provider_flow.index('"SOL"')
          retired_prefix = 'LU' + 'NA_'
          retired_method = 'lu' + 'naText'
          assert retired_prefix not in java
          assert retired_method not in java
          assert retired_prefix not in gradle
          assert 'height:230px' not in java
          assert '"nonCombat" to "true"' in an_nhien
          assert '"canUseWeapons" to "false"' in an_nhien
          an_start = skill_catalog.index('private val anNhien = listOf(')
          an_end = skill_catalog.index('private val kai = listOf(', an_start)
          assert 'Weapon DMG' not in skill_catalog[an_start:an_end]
          assert html.count("button.id='characterSkillsButton'") == 1
          assert html.count('id="characterSkillsModal"') == 1
          assert 'rolls.put("roamingEntityId"' not in java
          assert 'makeGameplayRolls(before, action, meta)' not in java
          assert 'exitIntent && (physical || search)' not in java
          assert 'return exitFound && progressionReady(before);' not in java
          assert 'private int exitThresholdAndroid' not in java
          assert 'ExitDiscoveryEngine' not in java
          assert 'TraverseExitCommand' not in java
          assert not (core / 'ExitDiscoveryEngine.kt').exists()
          assert not (root / 'app/src/test/java/com/rabpit/backroom/core/ExitDiscoveryEngineTest.kt').exists()
          assert (core / 'ExitStreakEngine.kt').exists()

          assert 'slot != "set" || MadGodCanon.slot(command.itemId' not in engines
          assert 'appendEquipmentBadge(box)' not in java
          assert 'const val MULTIPLIER = 50' not in madgod
          assert 'jeffEncounter' not in java
          assert 'janeEncounter' not in java
          for retired_combat_ui in (
              "label:'TẤN CÔNG'", "label:'NÉ TRÁNH'", "label:'BỎ CHẠY'",
              "dataset.combatAction", "function submitCombat(action)", "openCombatDiceForAction",
          ):
              assert retired_combat_ui not in html, retired_combat_ui

          required_assets = [
              'hound.webp','clump.webp','duller.webp','deathmoth.webp','hostile_faceling.webp','false_puddle.webp','paintings.webp',
              'smiler.webp','skin-stealer.webp','predatory_window.webp','biological_pipeline.webp','wretch.webp','cable_mimic.webp',
              'the_beast_of_level_5.webp','hotel_corpse_lure.webp','jeff_the_killer.webp','jane_the_killer.webp','slenderman.webp','diep_minh.webp'
          ]
          for name in required_assets:
              p = entity_dir / name
              assert p.is_file() and p.stat().st_size > 0, name
              raw = p.read_bytes()
              assert len(raw) >= 12 and raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', name
              assert int.from_bytes(raw[4:8], 'little') + 8 == len(raw), name
              assert not p.with_suffix('.png').exists(), name
          assert '.put("url", "file:///android_asset/entity/" + entityKey + ".webp")' in java
          for p in [root / 'app/src/main/assets/Kai_MadGod_snapshot_overlay.png', root / 'app/src/main/assets/avatars/MadGod.jpg', root / 'app/src/main/assets/CAO_MINH_OVERLAY_EXPLORER_IDLE.png', root / 'app/src/main/assets/CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png']:
              assert p.is_file() and p.stat().st_size > 0, str(p)
          for name in ['die-1.png','die-2.png','die-3.png','die-4.png','die-5.png','die-6.png','roll-3d.png','level0-wallpaper.svg']:
              p = dice_dir / name
              assert p.is_file() and p.stat().st_size > 0, name

          combined = html + java + gradle + facade + save_repo
          for forbidden in ['drive.google.com','www.googleapis.com/auth/drive','DriveOnlineSaveManager','com.google.android.gms:play-services-auth','ENTITY_MANIFEST_FILE_ID','readEntityManifestRemote']:
              assert forbidden not in combined, forbidden
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      - name: Generate Canon P1 compiler shadow candidate
        run: python3 android-apk/compiler-knowledge-db-shadow.py

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify Canon P0 snapshot report
        run: |
          set -euo pipefail
          REPORT="android-apk/app/build/reports/canon-p0/snapshot-report.json"
          test -s "$REPORT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("android-apk/app/build/reports/canon-p0/snapshot-report.json").read_text(encoding="utf-8"))
          assert report["schemaVersion"] == 1
          assert report["scenarioCount"] == 25
          scenarios = {item["name"]: item for item in report["scenarios"]}
          assert len(scenarios) == 25
          quiet = scenarios["android_smoke_quiet"]["packetSha256"]
          clipped = scenarios["android_smoke_hard_clip"]["packetSha256"]
          assert len(quiet) == 64 and len(clipped) == 64
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CANON_P0_QUIET_SHA={quiet}\n")
              env.write(f"CANON_P0_HARD_CLIP_SHA={clipped}\n")
          PY

      - name: Upload Canon P0 characterization artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canon-P0-characterization-${{ github.run_id }}
          path: android-apk/app/build/reports/canon-p0
          if-no-files-found: error
          retention-days: 14


      - name: Generate Canon P1 schema lint shadow
        run: python3 android-apk/lint-knowledge-db-shadow.py

      - name: Verify Canon P1 schema lint shadow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("android-apk/app/build/reports/canon-p1/schema-lint.json").read_text(encoding="utf-8"))
          p0 = json.loads(Path("android-apk/app/build/reports/canon-p0/snapshot-report.json").read_text(encoding="utf-8"))
          assert report["schemaVersion"] == 1 and report["mode"] == "shadow_only"
          final_db = json.loads(Path("android-apk/app/src/main/assets/knowledge/knowledge_db.json").read_text(encoding="utf-8"))
          assert report["recordCount"] == len(final_db["records"])
          assert report["counts"]["ERROR"] + report["counts"]["WARNING"] == len(report["findings"])
          assert p0["scenarioCount"] == 25
          assert len({x["name"] for x in p0["scenarios"]}) == 25
          assert report["counts"]["ERROR"] == 0, report["findings"]
          PY

      - name: Upload Canon P1 schema lint shadow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canon-P1-schema-lint-${{ github.run_id }}
          path: android-apk/app/build/reports/canon-p1/schema-lint.json
          if-no-files-found: error
          retention-days: 14


      - name: Verify Canon P1 compiler round-trip parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("android-apk/app/build/reports/canon-p1")
          data = json.loads((root / "compiler-data-parity.json").read_text(encoding="utf-8"))
          runtime = json.loads((root / "compiler-runtime-parity.json").read_text(encoding="utf-8"))
          p0 = json.loads(Path("android-apk/app/build/reports/canon-p0/snapshot-report.json").read_text(encoding="utf-8"))
          authoring = json.loads((root / "compiler-authoring-shadow.json").read_text(encoding="utf-8"))
          candidate = json.loads((root / "compiler-candidate.json").read_text(encoding="utf-8"))
          assert data["passed"] and data["shippingAssetUnchanged"] and not data["failures"]
          assert data["mode"] == runtime["mode"] == "shadow_only"
          assert data["sameOrderedRecordIds"] and data["sameRecordCount"]
          assert data["baselineRecordCount"] == data["candidateRecordCount"] == len(candidate["records"])
          assert all(n == len(candidate["records"]) for n in data["fieldMatchCounts"].values())
          assert len(authoring["records"]) == len(candidate["records"])
          assert "authoring" not in candidate["records"][0]
          assert "rev" not in candidate["records"][0] and "status" not in candidate["records"][0]
          assert runtime["builder"] == "KnowledgeContextEngine.buildForTest"
          assert runtime["scenarioCount"] == runtime["packetParityCount"] == p0["scenarioCount"] == 25
          baseline = {case["name"]: case for case in p0["scenarios"]}
          cases = {case["name"]: case for case in runtime["scenarios"]}
          assert len(baseline) == len(cases) == 25 and baseline.keys() == cases.keys()
          for name, case in cases.items():
              old = baseline[name]
              assert case["candidatePacketSha256"] == case["baselinePacketSha256"] == old["packetSha256"], name
              assert case["budgetKeptRecordIds"] == old["budgetKeptRecordIds"], name
              for key in ("hardClipDecision", "hardClipRecordId", "hardClipCutOffset",
                          "serializedCharsBeforeClip", "serializedCharsAfterClip"):
                  assert case[key] == old[key], (name, key)
          print("Canon P1.5 candidate: data fields/order and 25/25 JVM packet parity")
          PY

      - name: Upload Canon P1 compiler round-trip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canon-P1-compiler-round-trip-${{ github.run_id }}
          path: android-apk/app/build/reports/canon-p1/compiler-*.json
          if-no-files-found: error
