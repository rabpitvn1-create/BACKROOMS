      - name: Verify Canon P0 Android serialization smoke (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_smoke == true }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            gradle -p android-apk :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon &&
            APP_APK="$(find android-apk/app/build/outputs/apk/debug -name '*debug.apk' -print -quit)" &&
            TEST_APK="$(find android-apk/app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)" &&
            test -n "$APP_APK" && test -n "$TEST_APK" &&
            adb install -r "$APP_APK" &&
            adb install -r "$TEST_APK" &&
            COMPONENT="$(adb shell pm list instrumentation | tr -d '\r' | sed -n '/KnowledgeContextSmokeInstrumentation/{s/^instrumentation://;s/ (target=.*//;p;q}')" &&
            test -n "$COMPONENT" &&
            OUTPUT="$(adb shell am instrument -w -e p0QuietSha "$CANON_P0_QUIET_SHA" -e p0HardClipSha "$CANON_P0_HARD_CLIP_SHA" "$COMPONENT")" &&
            printf '%s\n' "$OUTPUT" &&
