name: Build Backroom APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify active semantic highlighting
        run: node android-apk/verify-semantic.mjs

      - name: Verify MadGod UI Core projection
        run: node android-apk/verify-madgod-ui.mjs

      - name: Verify Lucia combat overlay
        run: node android-apk/verify-lucia-overlay.mjs

      - name: Verify combat panel layout
        run: node android-apk/verify-combat-layout.mjs

      - name: Verify combat UI and Entity encounter rate tests
        run: node --test android-apk/tests/*.test.cjs

      - name: Capture active run id
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Start each status commit from fresh main. Rebasing an older RUNNING
          # commit conflicts when a previous build has already deleted the file.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B release-status-sync "origin/$GITHUB_REF_NAME"
            mkdir -p release-status
            printf 'status=RUNNING\nversion=1.2.0.0.18\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.2.0.0.18-running.txt
            git add release-status/v1.2.0.0.18-running.txt
            git commit -m "Record active Backroom 1.2.0.0.18 run $GITHUB_RUN_ID"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish RUNNING status after three fast-forward attempts" >&2
              exit 1
            fi
          done

      - name: Validate Game Master configuration
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for name in GEHIHI_API_KEY GEHIHI_MODEL GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY SOL_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.2.0.0.18.apk

      - name: Verify packaged APK contracts
        run: |
          set -euo pipefail
          trap 'echo "Packaged APK contract failed near line $LINENO: $BASH_COMMAND" >&2' ERR
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.2.0.0.18.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.0.0.18.apk | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.0.0.18.apk | grep -q "versionCode='91' versionName='1.2.0.0.18'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.0.0.18.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.2.0.0.18.apk
          rm -rf apk-check && mkdir apk-check
          unzip -q Backroom-1.2.0.0.18.apk 'assets/index.html' 'assets/combat-feedback-1193a.*' 'assets/entity/*' 'assets/fx/*' 'assets/CaoMinh_MadGod_snapshot_overlay.png' 'assets/CAO_MINH_OVERLAY_EXPLORER_IDLE.png' 'assets/CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png' 'assets/avatars/MadGod.jpg' 'assets/avatars/CAO_MINH_AVATAR.jpg' 'assets/hud/player_action_backrooms.png' 'assets/dice/*' 'assets/fonts/Play-Bold.ttf' 'assets/level_snapshots/*' -d apk-check
          ! grep -q 'id="searchActionButton"' apk-check/assets/index.html
          grep -q 'id="submit"' apk-check/assets/index.html
          grep -q 'exploreActionButton' apk-check/assets/index.html
          grep -q 'UI_119_BACKPORT_R01' apk-check/assets/index.html
          grep -q 'playerActionModal' apk-check/assets/index.html
          grep -q 'gameMenuModal' apk-check/assets/index.html
          grep -q 'playerActionConfirm' apk-check/assets/index.html
          grep -q 'POKER_DICE_CORE_BACKPORT_R01' apk-check/assets/index.html
          grep -q 'pokerDiceModal' apk-check/assets/index.html
          grep -q 'COMBAT_TRANSIENT_LOG_R01' apk-check/assets/combat-feedback-1193a.js
          grep -q 'function focusCombatActor(actorId)' apk-check/assets/combat-feedback-1193a.js
          grep -q 'playTypedTurnTimeline' apk-check/assets/combat-feedback-1193a.js
          grep -q '3D_TURN_COVERFLOW_R01' apk-check/assets/combat-feedback-1193a.css
          grep -q 'rotate:y -65deg' apk-check/assets/combat-feedback-1193a.css
          grep -q 'backroomSyncCombatPortrait' apk-check/assets/combat-feedback-1193a.js
          grep -q 'partyFocusEpoch' apk-check/assets/combat-feedback-1193a.js
          grep -q 'backroomSwitchCombatEntityWave' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -q 'combat-party-appear' apk-check/assets/combat-feedback-1193a.css
          grep -q 'animation:none!important' apk-check/assets/combat-feedback-1193a.css
          grep -q 'completing=before&&before.active===true' apk-check/assets/combat-feedback-1193a.js
          grep -Fq '.snapshot[data-combat-focus] .snapshot-entity{' apk-check/assets/combat-feedback-1193a.css
          grep -Fq 'display:block!important;left:0!important;right:auto!important' apk-check/assets/combat-feedback-1193a.css
          ! grep -q 'combat-switch-ring' apk-check/assets/combat-feedback-1193a.css
          test -s apk-check/assets/fx/hit-impact-sparks-v1.png
          cmp android-apk/app/src/main/assets/fx/hit-impact-sparks-v1.png apk-check/assets/fx/hit-impact-sparks-v1.png
          grep -Fq 'fx/hit-impact-sparks-v1.png' apk-check/assets/combat-feedback-1193a.css
          grep -q 'function appendDamageLine(e)' apk-check/assets/combat-feedback-1193a.js
          grep -q 'NOW : ' apk-check/assets/combat-feedback-1193a.js
          grep -q 'COMBAT_LOG_FIXED_PANEL_R02' apk-check/assets/combat-feedback-1193a.css
          ! grep -q 'packet&&packet.summary' apk-check/assets/combat-feedback-1193a.js
          grep -q '.combat-feedback-panel' apk-check/assets/combat-feedback-1193a.css
          ! grep -q 'state.log' apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'localStorage' apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'modal.hidden=true' apk-check/assets/combat-feedback-1193a.js
          test -s apk-check/assets/avatars/CAO_MINH_AVATAR.jpg
          cmp android-apk/app/src/main/assets/avatars/CAO_MINH_AVATAR.jpg apk-check/assets/avatars/CAO_MINH_AVATAR.jpg
          grep -q 'CHARACTER_INFO_STATS_V2' apk-check/assets/index.html
          grep -q 'characterLevelValue' apk-check/assets/index.html
          grep -q 'characterExpFill' apk-check/assets/index.html
          grep -q 'characterBaseStats' apk-check/assets/index.html
          grep -q 'characterCombatStats' apk-check/assets/index.html
          grep -q 'characterStatusEffects' apk-check/assets/index.html
          grep -q 'combatStatus' apk-check/assets/index.html
          ! grep -q 'renderCorePanel' apk-check/assets/index.html
          ! grep -q 'Android.coreUpgrade' apk-check/assets/index.html
          grep -q 'DIRECT_COMBAT_GATE_V1' apk-check/assets/index.html
          grep -q 'ensureDirectCombatDice' apk-check/assets/index.html
          grep -q 'mountNearSnapshot();' apk-check/assets/index.html
          ! grep -q 'if(window.__combatFeedbackBusy){hide();return;}' apk-check/assets/index.html
          grep -q 'POKER_DICE_119_POLISH_R01' apk-check/assets/index.html
          grep -q 'poker-die-shadow' apk-check/assets/index.html
          grep -q 'poker-die-hold-seal' apk-check/assets/index.html
          grep -q 'DICE_ROLL_ANIMATION_MS=680' apk-check/assets/index.html
          grep -q 'DICE_SETTLE_ANIMATION_MS=170' apk-check/assets/index.html
          grep -q 'FINALIZE_PREVIEW_MS=2000' apk-check/assets/index.html
          ! grep -q "label:'TẤN CÔNG'" apk-check/assets/index.html
          ! grep -q "label:'NÉ TRÁNH'" apk-check/assets/index.html
          ! grep -q "label:'BỎ CHẠY'" apk-check/assets/index.html
          grep -q 'madGodSetEquipped' apk-check/assets/index.html
          grep -q 'equipmentDetailModal' apk-check/assets/index.html
          grep -q 'renderCharacterStatusEquipment' apk-check/assets/index.html
          grep -q 'characterSkillsModal' apk-check/assets/index.html
          grep -q 'characterSkillsButton' apk-check/assets/index.html
          grep -q 'function semanticTerms(before,after)' apk-check/assets/index.html
          grep -q 'gm-semantic' apk-check/assets/index.html
          ! grep -q 'SEMANTIC_COMPATIBILITY_TERMS=' apk-check/assets/index.html
          grep -q 'function semanticTerms(before,after)' apk-check/assets/index.html
          grep -q 'function semanticPrepareNextState(before,json)' apk-check/assets/index.html
          grep -q 'function renderSemanticText(entry)' apk-check/assets/index.html
          grep -q 'state=semanticPrepareNextState(state,json)' apk-check/assets/index.html
          grep -q 'entry.semanticSpans' apk-check/assets/index.html
          ! grep -q 'gmSemanticPlayBoldRuntime' apk-check/assets/index.html
          ! grep -q 'document.querySelectorAll(".message.gm .text")' apk-check/assets/index.html
          ! grep -q 'termsVersion(terms)' apk-check/assets/index.html
          # Term recognition is tested against live Core state in verify-semantic.mjs.
          # Assert packaged environment snapshots match the Git-tracked originals.
          test -s apk-check/assets/level_snapshots/snapshot-mapping.js
          for snapshot in android-apk/app/src/main/assets/level_snapshots/*.webp; do
            cmp "$snapshot" "apk-check/assets/level_snapshots/${snapshot##*/}"
          done
          test -s apk-check/assets/fonts/Play-Bold.ttf
          cmp apk-check/assets/fonts/Play-Bold.ttf android-apk/app/src/main/assets/fonts/Play-Bold.ttf
          test -s apk-check/assets/entity/hound.webp
          test -s apk-check/assets/entity/slenderman.webp
          test -s apk-check/assets/entity/diep_minh.webp
          test -s apk-check/assets/entity/blackroot_sentinel.webp
          test -s apk-check/assets/entity/sinew_strider.webp
          test -s apk-check/assets/entity/hollow_grasper.webp
          test -s apk-check/assets/CaoMinh_MadGod_snapshot_overlay.png
          test -s apk-check/assets/CAO_MINH_OVERLAY_EXPLORER_IDLE.png
          test -s apk-check/assets/CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png
          unzip -p Backroom-1.2.0.0.18.apk assets/LUCIA_LUC_OVERLAY.png > apk-check/lucia-overlay.png
          test -s apk-check/lucia-overlay.png
          test -s apk-check/assets/avatars/MadGod.jpg
          test -s apk-check/assets/hud/player_action_backrooms.png
          test -s apk-check/assets/dice/die-1.png
          test -s apk-check/assets/dice/die-6.png
          test -s apk-check/assets/dice/roll-3d.png
          test -s apk-check/assets/dice/level0-wallpaper.svg

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.2.0.0.18-debug-apk
          path: Backroom-1.2.0.0.18.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.2.0.0.18
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0.0.18"
          TITLE="Backroom 1.2.0.0.18 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.2.0.0.18.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.2.0.0.18.apk --clobber
          else
            gh release create "$TAG" Backroom-1.2.0.0.18.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.2.0.0.18-verified.apk
          gh release download v1.2.0.0.18 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.2.0.0.18.apk' --output Backroom-1.2.0.0.18-verified.apk
          test -s Backroom-1.2.0.0.18-verified.apk
          cmp Backroom-1.2.0.0.18.apk Backroom-1.2.0.0.18-verified.apk
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/level_snapshots/snapshot-mapping.js'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/level_snapshots/level_00p2__snapshot_001.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/level_snapshots/area_00__manila_room__snapshot_001.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/hound.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/slenderman.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/diep_minh.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/blackroot_sentinel.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/sinew_strider.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/entity/hollow_grasper.webp'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/CaoMinh_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/avatars/MadGod.jpg'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/hud/player_action_backrooms.png'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/dice/die-1.png'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/dice/die-6.png'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/dice/roll-3d.png'
          unzip -l Backroom-1.2.0.0.18-verified.apk | grep -q 'assets/fonts/Play-Bold.ttf'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'characterSkillsModal'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'characterSkillsButton'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'function semanticTerms(before,after)'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'UI_119_BACKPORT_R01'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'playerActionModal'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'POKER_DICE_CORE_BACKPORT_R01'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'pokerDiceModal'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'COMBAT_TRANSIENT_LOG_R01'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'function focusCombatActor(actorId)'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'playTypedTurnTimeline'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q '3D_TURN_COVERFLOW_R01'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q 'rotate:y -65deg'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'backroomSyncCombatPortrait'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'partyFocusEpoch'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q 'combat-party-appear'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'completing=before&&before.active===true'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -Fq '.snapshot[data-combat-focus] .snapshot-entity{'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -Fq 'display:block!important;left:0!important;right:auto!important'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q 'combat-switch-ring'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/fx/hit-impact-sparks-v1.png > verified-hit-impact-sparks.png
          cmp android-apk/app/src/main/assets/fx/hit-impact-sparks-v1.png verified-hit-impact-sparks.png
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -Fq 'fx/hit-impact-sparks-v1.png'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'function appendDamageLine(e)'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'NOW : '
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q 'COMBAT_LOG_FIXED_PANEL_R02'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'packet&&packet.summary'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.css | grep -q '.combat-feedback-panel'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'state.log'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'localStorage'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/combat-feedback-1193a.js | grep -q 'modal.hidden=true'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'DIRECT_COMBAT_GATE_V1'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'ensureDirectCombatDice'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'mountNearSnapshot();'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'if(window.__combatFeedbackBusy){hide();return;}'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'POKER_DICE_119_POLISH_R01'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'poker-die-shadow'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'DICE_ROLL_ANIMATION_MS=680'
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'FINALIZE_PREVIEW_MS=2000'
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q "label:'TẤN CÔNG'"
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q "label:'NÉ TRÁNH'"
          ! unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q "label:'BỎ CHẠY'"
          unzip -p Backroom-1.2.0.0.18-verified.apk assets/index.html | grep -q 'gameMenuModal'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.2.0.0.18-verified.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.2.0.0.18-verified.apk
          SHA256=$(sha256sum Backroom-1.2.0.0.18-verified.apk | awk '{print $1}')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B release-status-sync "origin/$GITHUB_REF_NAME"
          rm -f release-status/v1.2.0.0.18-running.txt
          printf 'status=GREEN\nversion=1.2.0.0.18\ntag=v1.2.0.0.18\nasset=Backroom-1.2.0.0.18.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.2.0.0.18.txt
          git add release-status/v1.2.0.0.18.txt release-status/v1.2.0.0.18-running.txt
          git commit -m 'Record verified Backroom 1.2.0.0.18 debug release'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove retired branches after verified release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY_CLEANUP'
          import json, os, subprocess
          def api(path, *args):
              result = subprocess.run(['gh', 'api', path, *args], check=True, capture_output=True, text=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          repo = os.environ['GITHUB_REPOSITORY']
          retired = {
              'backup/main-before-artifact-37614837202': '10bf6012d2f8f36e892e534f9cf9642cf09be93c',
              'canon/luc-tram-drive-r06-20261011': '743a0eb4a5d312bcf7fafe683de8945e8de9c16b',
              'feature/luc-tram-level4-encounter-20261011': '2c2f254e051c89025c7da49a7fcd852ce21f5833',
              'fix/transient-combat-feedback-panel': '01d58b638be65dea66f3df5e574b4c11b502e6cc',
              'fix/transient-combat-feedback-panel-v2': '25eabc95cdcfc0e7e3af1e8e2cf944a6ec0e412e',
              'ops/publish-artifact-37614837202': 'cbc56dfc55b3f714364f61b5f74eb11369ddba81',
              'release/1.2.0.0.10': '8de068ff34cc541c199fa3afa45150ac7d96c7dd',
          }
          pr = api(f'repos/{repo}/pulls/588')
          if not pr['merged'] or pr['head']['ref'] != 'feat/combat-impact-integration':
              raise RuntimeError('PR #588 must be merged before branch cleanup')
          retired[pr['head']['ref']] = pr['head']['sha']
          branches = {b['name']: b['commit']['sha'] for b in api(f'repos/{repo}/branches?per_page=100')}
          if not any(name in branches for name in retired):
              print('Retired branches already removed')
              raise SystemExit(0)
          open_heads = {p['head']['ref'] for p in api(f'repos/{repo}/pulls?state=open&per_page=100')}
          for name, sha in retired.items():
              if name in branches and (branches[name] != sha or name in open_heads):
                  raise RuntimeError(f'Branch changed or still has an open PR: {name}')
          for name in retired:
              if name in branches:
                  current = api(f'repos/{repo}/git/ref/heads/{name}')['object']['sha']
                  if current != retired[name]:
                      raise RuntimeError(f'Branch advanced during cleanup: {name}')
                  api(f'repos/{repo}/git/refs/heads/{name}', '--method', 'DELETE')
                  print(f'Deleted retired branch: {name}')
          remaining = [b['name'] for b in api(f'repos/{repo}/branches?per_page=100')]
          if remaining != ['main']:
              print(f'Other work branches retained; not a release failure: {remaining}')
          print('Branch cleanup verified: main only')
          PY_CLEANUP
