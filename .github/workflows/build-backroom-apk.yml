name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"
      - ".github/scripts/android16-smoke.sh"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py \
            --dataset intent_dataset.csv \
            --labels ../app/src/main/assets/models/backroom_intent_labels.txt \
            --output ../app/src/main/assets/models/backroom_intent.tflite \
            --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(
            patch-provider-status.py
            patch-luna-text.py
            patch-level-snapshot-backgrounds.py
            patch-snapshot-fallback.py
            patch-kai-hd-continuous.py
            patch-kai-png-preferred.py
            patch-kai-codex.py
            patch-r06-source-marker.py
            patch-drive-canon-gameplay.py
            patch-inventory-persistence.py
            patch-ai-orchestrator.py
            patch-state-op-hardening.py
            patch-gemini-health-pool.py
            patch-conditional-audit.py
            patch-audit-validated-risk.py
            patch-gameplay-parity-final.py
            patch-final-authority-hardening.py
            patch-rejected-op-repair-final.py
            patch-kai-resource-policy-final.py
            patch-provider-deadline-final.py
            patch-gemini-model-matrix-final.py
            patch-java-compile-hardening.py
            patch-save-controls-final.py
            patch-hard-mode-label.py
            patch-snapshot-unconfigured.py
            patch-game-state-core-bridge.py
            patch-character-inventory-ui.py
            patch-character-detail-avatar-fallback.py
          )
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify provider, UI and startup contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = Path('android-apk/app/build.gradle').read_text(encoding='utf-8')
          canon = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/AnNhienCanon.kt').read_text(encoding='utf-8')
          required = [
              ("versionCode 52", gradle), ("versionName '1.1.50'", gradle),
              ('state&&state.partyDetails&&Array.isArray(state.partyDetails.members)', html),
              ('id="characterSurvivalHud"', html), ('.message.gm{', html), ('focusLatestGmStart()', html),
              ('#characterEquipmentList span,#characterInventoryItems span{text-transform:uppercase', html),
              ('output.put("partyDetails"', facade), ('output.put("gameTime"', facade),
              ('thresholdRoll("jeffEncounter", 10000, 200', java),
              ('root.equals("jeff") && value instanceof JSONObject', java),
              ('int[] entityThresholds = {805, 1000, 1150, 1150, 810, 1200, 805}', java),
              ('avatars/an_nhien_avatar.png', canon), ('an-nhien:pink-crocs', canon),
              ('private java.util.List<String> lunaModelCandidates(', java), ('new URL(baseUrl + "/models")', java),
              ('private boolean lunaInactiveModel(', java), ('models.add("gpt-5.6-sol")', java), ('Luna fallback / ', java),
              ('if (modelIndex == 0) return 45000;', java),
              ('cause instanceof java.net.SocketTimeoutException) return false;', java),
              ('Integer.bitCount(geminiModelTransientMaskMatrix[modelIndex]) >= 5', java),
              ('geminiTransportMaskMatrix &= ~(1 << keyIndex);', java), ('true, 120_000L', java),
              ('private volatile boolean gameCoreUnavailable;', java), ('private GameCoreFacade gameCoreOrNull()', java),
              ('private GameCoreFacade requireGameCore() throws Exception', java), ('requireGameCore().processRule(', java),
              ('requireGameCore().processValidatedCandidate(', java), ('showStartupFallback(Throwable error)', java),
          ]
          for marker, source in required:
              assert marker in source, marker
          on_create = java[java.index('public void onCreate'):java.index('@Override protected void onDestroy')]
          assert 'gameCore = GameCoreFacade.create' not in on_create
          assert 'Immersive fullscreen unavailable; continuing normally.' in on_create
          assert 'UI enhancement injection failed; base game remains usable.' in on_create
          assert 'GameCoreFacade.create(getApplicationContext(), BuildConfig.DEBUG)' in java
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin core tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.50.apk

      - name: Verify debug APK, launcher and 16 KB native compatibility
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          "$APKSIGNER" verify --verbose --print-certs Backroom-1.1.50.apk
          "$AAPT" dump badging Backroom-1.1.50.apk | grep -q "package: name='com.rabpit.backroom'"
          "$AAPT" dump badging Backroom-1.1.50.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$ZIPALIGN" -c -P 16 -v 4 Backroom-1.1.50.apk
          rm -rf native-check && mkdir native-check
          unzip -q Backroom-1.1.50.apk 'lib/arm64-v8a/*.so' -d native-check
          for so in native-check/lib/arm64-v8a/*.so; do
            echo "Checking ELF alignment: $so"
            while read -r align; do
              (( align >= 0x4000 )) || (echo "Native LOAD alignment below 16 KB in $so: $align" && exit 1)
            done < <(readelf -lW "$so" | awk '$1=="LOAD" {print $NF}')
          done

      - name: Install and cold-launch repeatedly on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/android16-smoke.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.50-debug-apk
          path: Backroom-1.1.50.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.50
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.50"
          TITLE="Backroom 1.1.50 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.50.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.50.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.50.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.50-verified.apk
          gh release view v1.1.50 --repo "$GITHUB_REPOSITORY"
          gh release download v1.1.50 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.50.apk' --output Backroom-1.1.50-verified.apk
          test -s Backroom-1.1.50-verified.apk
          unzip -l Backroom-1.1.50-verified.apk | grep -q 'AndroidManifest.xml'
          unzip -l Backroom-1.1.50-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.50-verified.apk | grep -q 'assets/avatars/an_nhien_avatar.png'
          unzip -l Backroom-1.1.50-verified.apk | grep -q 'classes.dex'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          "$APKSIGNER" verify --verbose --print-certs Backroom-1.1.50-verified.apk
          "$ZIPALIGN" -c -P 16 -v 4 Backroom-1.1.50-verified.apk
          SHA256=$(sha256sum Backroom-1.1.50-verified.apk | awk '{print $1}')
          mkdir -p release-status
          printf 'status=GREEN\nversion=1.1.50\ntag=v1.1.50\nasset=Backroom-1.1.50.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\nandroid16_smoke=passed\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.1.50.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.1.50.txt
          git commit -m 'Record verified Backroom 1.1.50 debug release'
          git push origin HEAD:main
