          poker_test = (root / 'app/src/test/java/com/rabpit/backroom/core/PokerDiceCoreBackportTest.kt').read_text(encoding='utf-8')
          dice_dir = root / 'app/src/main/assets/dice'
          play_bold = root / 'app/src/main/assets/fonts/Play-Bold.ttf'

          required = [
              ("versionCode 73", gradle), ("versionName '1.2.0.0.0'", gradle),
              ('const prologue=`Lôi Thiên Vực chưa từng có một ngày yên tĩnh như thế.', html),
