name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY || secrets.OPENAI_KEY || secrets.GPT_API_KEY_1 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Apply Snapshot provider fallback patch
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply HD Kai and event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.17.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.17-debug-apk
          path: Backroom-1.1.17.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release v1.1.17
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.17"
          TITLE="Backroom 1.1.17"
          NOTES=$(cat <<'EOF'
          Backroom APK 1.1.17

          - Đã loại bỏ hoàn toàn QwenCloud khỏi APK và workflow build.
          - Game Master trở lại thứ tự GPT -> Gemini fallback.
          - Không còn đọc hoặc đóng gói QWEN_API_KEY vào APK.
          - Snapshot ảnh vẫn dùng pipeline riêng và chỉ tự tạo khi có sự kiện hình ảnh đáng kể.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.17.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.17.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
