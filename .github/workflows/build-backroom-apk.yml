name: BACKROOMS CI / Release 1.4.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: backrooms-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-build-release:
    name: preflight-build-release
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: https://api.vilao.ai/v1
      HAKU_MODEL: claude-haiku-4-5-20251001
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false

    steps:
      - uses: actions/checkout@v4

      - name: Verify 1.4.1 release source
        run: |
          set -euo pipefail
          grep -q "versionCode 96" android-apk/app/build.gradle
          grep -q "versionName '1.4.1'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.4.1.md
          test -s android-apk/validate_level_content.py
          test -s android-apk/test_validate_level_content.py
          test -s android-apk/ci_apply_runtime_patches.py
          test -s android-apk/ci_verify_runtime_contracts.py
          test -s android-apk/ci_verify_packaged_apk.sh

      - name: Validate Level content and scale contracts
        run: |
          set -euo pipefail
          cd android-apk
          python3 -m unittest -v test_validate_level_content.py
          python3 validate_level_content.py --strict --audit-source --report

      - name: Restore LiteRT intent model
        id: litert-cache
        uses: actions/cache@v4
        with:
          path: android-apk/app/src/main/assets/models/backroom_intent.tflite
          key: litert-intent-${{ hashFiles('android-apk/ml/build_intent_dataset.py', 'android-apk/ml/evaluate_seed_classifier.py', 'android-apk/ml/train_intent_classifier.py', 'android-apk/ml/intent_dataset.csv', 'android-apk/app/src/main/assets/models/backroom_intent_labels.txt') }}

      - name: Restore LiteRT BackroomsDirector model
        id: director-cache
        uses: actions/cache@v4
        with:
          path: android-apk/app/src/main/assets/models/backrooms_director.tflite
          key: litert-director-${{ hashFiles('android-apk/ml/build_director_dataset.py', 'android-apk/ml/train_director_classifier.py', 'android-apk/app/src/main/assets/models/backrooms_director_labels.txt') }}

      - uses: actions/setup-python@v5
        if: steps.litert-cache.outputs.cache-hit != 'true' || steps.director-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Install LiteRT training dependencies
        if: steps.litert-cache.outputs.cache-hit != 'true' || steps.director-cache.outputs.cache-hit != 'true'
        run: python -m pip install --requirement android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        if: steps.litert-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT intent model exceeds 5 MiB: $bytes" && exit 1)

      - name: Verify cached LiteRT intent model
        if: steps.litert-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          MODEL=android-apk/app/src/main/assets/models/backroom_intent.tflite
          test -s "$MODEL"
          bytes=$(stat -c%s "$MODEL")
          test "$bytes" -le 5242880 || (echo "Cached LiteRT intent model exceeds 5 MiB: $bytes" && exit 1)

      - name: Train and verify LiteRT BackroomsDirector model
        if: steps.director-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python android-apk/ml/build_director_dataset.py
          cd android-apk/ml
          python train_director_classifier.py --dataset director_dataset.csv --labels ../app/src/main/assets/models/backrooms_director_labels.txt --output ../app/src/main/assets/models/backrooms_director.tflite --report director_model_report.json
          test -s ../app/src/main/assets/models/backrooms_director.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backrooms_director.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT BackroomsDirector model exceeds 5 MiB: $bytes" && exit 1)

      - name: Verify cached LiteRT BackroomsDirector model
        if: steps.director-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          MODEL=android-apk/app/src/main/assets/models/backrooms_director.tflite
          test -s "$MODEL"
          bytes=$(stat -c%s "$MODEL")
          test "$bytes" -le 5242880 || (echo "Cached LiteRT BackroomsDirector model exceeds 5 MiB: $bytes" && exit 1)

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL HAKU_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Smoke test Luna API
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = os.environ["LUNA_BASE_URL"].rstrip("/") + "/chat/completions"
          payload = json.dumps({
              "model": os.environ["LUNA_MODEL"],
              "messages": [{"role": "user", "content": "Reply OK"}],
              "temperature": 0,
              "max_tokens": 4,
              "stream": False,
          }).encode("utf-8")
          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["LUNA_API_KEY"],
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  content_type = response.headers.get_content_type()
                  if content_type != "application/json":
                      raise SystemExit(
                          f"Luna API smoke test returned HTTP {response.status} with Content-Type {content_type}"
                      )
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Luna API smoke test failed with HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Luna API smoke test failed: {type(error).__name__}") from None
          if not isinstance(result.get("choices"), list) or not result["choices"]:
              raise SystemExit("Luna API smoke test returned no completion choices")
          print("Luna API smoke test passed")
          PY

      - name: Smoke test Haku prose editor API
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = os.environ["HAKU_BASE_URL"].rstrip("/") + "/chat/completions"
          payload = json.dumps({
              "model": os.environ["HAKU_MODEL"],
              "messages": [{"role": "user", "content": "Reply exactly OK"}],
              "temperature": 0,
              "max_tokens": 4,
              "stream": False,
          }).encode("utf-8")
          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["HAKU_API_KEY"],
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Haku API smoke test failed with HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Haku API smoke test failed: {type(error).__name__}") from None
          choices = result.get("choices")
          if not isinstance(choices, list) or not choices:
              raise SystemExit("Haku API smoke test returned no completion choices")
          content = ((choices[0].get("message") or {}).get("content") or "").strip()
          if not content:
              raise SystemExit("Haku API smoke test returned empty content")
          print("Haku API smoke test passed")
          PY

      - name: Apply Android runtime patch chain
        run: python3 android-apk/ci_apply_runtime_patches.py

      - name: Verify final runtime contracts
        run: |
          set -euo pipefail
          python3 android-apk/ci_verify_runtime_contracts.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --no-daemon --build-cache

      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon --build-cache

      - name: Prepare debug APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.4.1-debug.apk

      - name: Verify packaged debug APK contracts
        run: bash android-apk/ci_verify_packaged_apk.sh Backroom-1.4.1-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.4.1-debug-apk
          path: Backroom-1.4.1-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect release eligibility
        id: release-gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_exists=false
          release_exists=false
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.1 >/dev/null 2>&1; then
            tag_exists=true
          fi
          if gh release view v1.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi
          if [[ "$tag_exists" == true && "$release_exists" == true ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v1.4.1 is already published; skipping duplicate release."
          elif [[ "$tag_exists" == true || "$release_exists" == true ]]; then
            echo "Inconsistent v1.4.1 tag/release state; refusing to overwrite it."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release v1.4.1
        if: steps.release-gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4.1 Backroom-1.4.1-debug.apk \
            --title "Backroom 1.4.1 Debug" \
            --notes-file android-apk/RELEASE_NOTES_1.4.1.md \
            --target "$GITHUB_SHA"

      - name: Verify published v1.4.1 release
        if: steps.release-gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir release-check
          gh release download v1.4.1 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.4.1-debug.apk' --dir release-check
          test -s release-check/Backroom-1.4.1-debug.apk
          expected=$(sha256sum Backroom-1.4.1-debug.apk | awk '{print $1}')
          actual=$(sha256sum release-check/Backroom-1.4.1-debug.apk | awk '{print $1}')
          test "$expected" = "$actual"
          bash android-apk/ci_verify_packaged_apk.sh release-check/Backroom-1.4.1-debug.apk
          echo "Published release v1.4.1 verified with SHA-256 $actual"
