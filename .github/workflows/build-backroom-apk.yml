          path: Backroom-1.2.0.0.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.2.0.0.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.2.0.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0.0.0"
          TITLE="Backroom 1.2.0.0.0 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.2.0.0.0.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.2.0.0.0.apk --clobber
          else
            gh release create "$TAG" Backroom-1.2.0.0.0.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

