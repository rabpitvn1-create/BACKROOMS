name: Build Backroom 1.2.9 Debug

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["BACKROOMS Preflight"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Restore LiteRT intent model
        id: litert-cache
        uses: actions/cache@v4
        with:
          path: android-apk/app/src/main/assets/models/backroom_intent.tflite
          key: litert-${{ hashFiles('android-apk/ml/**', 'android-apk/app/src/main/assets/models/backroom_intent_labels.txt') }}

      - uses: actions/setup-python@v5
        if: steps.litert-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        if: steps.litert-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Verify cached LiteRT intent model
        if: steps.litert-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          MODEL=android-apk/app/src/main/assets/models/backroom_intent.tflite
          test -s "$MODEL"
          bytes=$(stat -c%s "$MODEL")
          test "$bytes" -le 5242880 || (echo "Cached LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Validate Game Master configuration for manual build
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Smoke test Luna API for manual build
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = os.environ["LUNA_BASE_URL"].rstrip("/") + "/chat/completions"
          payload = json.dumps({
              "model": os.environ["LUNA_MODEL"],
              "messages": [{"role": "user", "content": "Reply OK"}],
              "temperature": 0,
              "max_tokens": 4,
              "stream": False,
          }).encode("utf-8")
          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["LUNA_API_KEY"],
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  content_type = response.headers.get_content_type()
                  if content_type != "application/json":
                      raise SystemExit(
                          f"Luna API smoke test returned HTTP {response.status} with Content-Type {content_type}"
                      )
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Luna API smoke test failed with HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Luna API smoke test failed: {type(error).__name__}") from None
          if not isinstance(result.get("choices"), list) or not result["choices"]:
              raise SystemExit("Luna API smoke test returned no completion choices")
          print("Luna API smoke test passed")
          PY

      - name: Apply Android runtime patch chain
        run: python3 android-apk/ci_apply_runtime_patches.py

      - name: Verify final runtime contracts
        run: |
          python3 android-apk/ci_verify_runtime_contracts.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

      - name: Prepare debug APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.2.9-debug.apk

      - name: Verify packaged debug APK contracts
        run: bash android-apk/ci_verify_packaged_apk.sh Backroom-1.2.9-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.2.9-debug-apk
          path: Backroom-1.2.9-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect release commit
        id: release-gate
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%B)" == "Release v1.2.9" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release v1.2.9
        if: steps.release-gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.9 Backroom-1.2.9-debug.apk \
            --title "Backroom 1.2.9 Debug" \
            --notes-file android-apk/RELEASE_NOTES_1.2.9.md \
            --target "${{ github.event.workflow_run.head_sha }}"
