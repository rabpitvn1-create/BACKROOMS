          unzip -l Backroom-1.1.63.0.6-verified.apk | grep -q 'assets/dice/die-1.png'
          unzip -l Backroom-1.1.63.0.6-verified.apk | grep -q 'assets/dice/die-6.png'
          unzip -l Backroom-1.1.63.0.6-verified.apk | grep -q 'assets/dice/roll-3d.png'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'characterSkillsModal'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'characterSkillsButton'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'UI_119_BACKPORT_R01'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'playerActionModal'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'POKER_DICE_CORE_BACKPORT_R01'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'pokerDiceModal'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'DIRECT_COMBAT_GATE_V1'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'ensureDirectCombatDice'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'POKER_DICE_119_POLISH_R01'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'poker-die-shadow'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'DICE_ROLL_ANIMATION_MS=680'
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'FINALIZE_PREVIEW_MS=2000'
          ! unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q "label:'TẤN CÔNG'"
          ! unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q "label:'NÉ TRÁNH'"
          ! unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q "label:'BỎ CHẠY'"
          unzip -p Backroom-1.1.63.0.6-verified.apk assets/index.html | grep -q 'gameMenuModal'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.63.0.6-verified.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.63.0.6-verified.apk
          SHA256=$(sha256sum Backroom-1.1.63.0.6-verified.apk | awk '{print $1}')
          # Build patches leave the checked-out runner worktree dirty; never checkout there.
          # Sync release status from an isolated worktree so unrelated main commits survive.
          STATUS_DIR="$RUNNER_TEMP/green-release-$GITHUB_RUN_ID"
          git fetch origin main
          git worktree add --detach "$STATUS_DIR" origin/main
          cleanup_status_worktree() {
            git worktree remove --force "$STATUS_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup_status_worktree EXIT
          (
            cd "$STATUS_DIR"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              mkdir -p release-status
              rm -f release-status/v1.1.63.0.6-running.txt
              printf 'status=GREEN\nversion=1.1.63.0.6\ntag=v1.1.63.0.6\nasset=Backroom-1.1.63.0.6.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.1.63.0.6.txt
              git add -A -- release-status
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m 'Record verified Backroom 1.1.63.0.6 debug release'
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish GREEN release status after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          )

  companion-storage:
    name: Companion SQLite API ${{ matrix.api }}
    needs: build-apk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Apply authoritative release patch chain
        run: python3 android-apk/apply-release-patch-chain.py
      - name: Build storage instrumentation APKs
        run: gradle -p android-apk -PcompanionStorageSmoke :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SQLite lifecycle and process-kill recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 android-apk/run-companion-storage-smoke.py ${{ matrix.api }}
      - name: Upload actual SQLite test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Companion-storage-api-${{ matrix.api }}-${{ github.run_id }}
          path: android-apk/app/build/reports/companion-storage/
          if-no-files-found: warn
          retention-days: 14
