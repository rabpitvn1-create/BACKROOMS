name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches: [main, release/1.2.0.0.0]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          mkdir -p release-status
          printf 'status=RUNNING\nversion=1.2.0.0.0\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.2.0.0.0-running.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.2.0.0.0-running.txt
          git commit -m "Record active Backroom 1.2.0.0.0 run $GITHUB_RUN_ID"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEHIHI_API_KEY GEHIHI_MODEL GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY SOL_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-provider-key-pool.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-ui-1.1.99-shell.py patch-poker-dice-core-backport.py patch-poker-dice-ui-119-polish.py patch-cao-minh-identity-overlay.py patch-item-detail-actions.py patch-item-whole-unit.py patch-cao-minh-skills-equipment.py patch-cao-minh-prologue.py patch-character-stats-1193a-restore.py patch-entity-power-scaling.py patch-combat-feedback-1193a.py patch-hidden-exit-streak.py patch-lifeform-trio.py patch-lifeform-trio-rebalance.py patch-gm-semantic-play-bold.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify final runtime contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-apk')
          workflow_text = Path('.github/workflows/build-backroom-apk.yml').read_text(encoding='utf-8')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = (core / 'GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          madgod = (core / 'MadGodCanon.kt').read_text(encoding='utf-8')
