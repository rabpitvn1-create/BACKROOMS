name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify APK contains no provider credentials
        run: |
          ! grep -R -E 'buildConfigField.*(API_KEY|SECRET|TOKEN)' android-apk/app
          ! grep -R -E 'BuildConfig\.(LUNA|OPENAI|GEMINI).*KEY' android-apk/app
      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.25.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.25-debug-apk
          path: Backroom-1.1.25.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release v1.1.25
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.25"
          TITLE="Backroom 1.1.25"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.25.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.25.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.25.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
