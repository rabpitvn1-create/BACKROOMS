          status_tests = (root / 'app/src/test/java/com/rabpit/backroom/core/CharacterStatusEquipmentSystemTest.kt').read_text(encoding='utf-8')
          stats_1193 = (root / 'app/src/test/java/com/rabpit/backroom/core/CharacterStats1193aRegressionTest.kt').read_text(encoding='utf-8')
          save_repo = (core / 'SaveRepository.kt').read_text(encoding='utf-8')
          combat = (core / 'CombatRuntime.kt').read_text(encoding='utf-8')
