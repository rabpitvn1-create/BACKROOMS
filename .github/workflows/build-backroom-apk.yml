name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches: [main, release/1.2.0.0.0]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          mkdir -p release-status
          printf 'status=RUNNING\nversion=1.2.0.0.0\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.2.0.0.0-running.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.2.0.0.0-running.txt
          git commit -m "Record active Backroom 1.2.0.0.0 run $GITHUB_RUN_ID"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEHIHI_API_KEY GEHIHI_MODEL GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY SOL_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.2.0.0.0.apk

      - name: Verify packaged APK contracts
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.2.0.0.0.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.0.0.0.apk | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.2.0.0.0.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.2.0.0.0.apk
          rm -rf apk-check && mkdir apk-check
          unzip -q Backroom-1.2.0.0.0.apk 'assets/index.html' 'assets/combat-feedback-1193a.*' 'assets/entity/*' 'assets/Kai_MadGod_snapshot_overlay.png' 'assets/CAO_MINH_OVERLAY_EXPLORER_IDLE.png' 'assets/CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png' 'assets/avatars/MadGod.jpg' 'assets/hud/player_action_backrooms.png' 'assets/dice/*' 'assets/fonts/Play-Bold.ttf' -d apk-check
          grep -q 'searchActionButton' apk-check/assets/index.html
          grep -q 'exploreActionButton' apk-check/assets/index.html
          grep -q 'UI_119_BACKPORT_R01' apk-check/assets/index.html
          grep -q 'playerActionModal' apk-check/assets/index.html
          grep -q 'gameMenuModal' apk-check/assets/index.html
          grep -q 'playerActionConfirm' apk-check/assets/index.html
          grep -q 'POKER_DICE_CORE_BACKPORT_R01' apk-check/assets/index.html
          grep -q 'pokerDiceModal' apk-check/assets/index.html
          grep -q 'COMBAT_TRANSIENT_LOG_R01' apk-check/assets/combat-feedback-1193a.js
          grep -q 'packet&&packet.summary' apk-check/assets/combat-feedback-1193a.js
          grep -q '.combat-feedback-panel' apk-check/assets/combat-feedback-1193a.css
          ! grep -q 'state.log' apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'localStorage' apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'modal.hidden=true' apk-check/assets/combat-feedback-1193a.js
          grep -q 'CORE STATS' apk-check/assets/index.html
          grep -q 'DIRECT_COMBAT_GATE_V1' apk-check/assets/index.html
          grep -q 'ensureDirectCombatDice' apk-check/assets/index.html
          grep -q 'mountNearSnapshot();' apk-check/assets/index.html
          ! grep -q 'if(window.__combatFeedbackBusy){hide();return;}' apk-check/assets/index.html
          grep -q 'POKER_DICE_119_POLISH_R01' apk-check/assets/index.html
          grep -q 'poker-die-shadow' apk-check/assets/index.html
          grep -q 'poker-die-hold-seal' apk-check/assets/index.html
          grep -q 'DICE_ROLL_ANIMATION_MS=680' apk-check/assets/index.html
          grep -q 'DICE_SETTLE_ANIMATION_MS=170' apk-check/assets/index.html
          grep -q 'FINALIZE_PREVIEW_MS=2000' apk-check/assets/index.html
          ! grep -q "label:'TẤN CÔNG'" apk-check/assets/index.html
          ! grep -q "label:'NÉ TRÁNH'" apk-check/assets/index.html
          ! grep -q "label:'BỎ CHẠY'" apk-check/assets/index.html
          grep -q 'madGodSetEquipped' apk-check/assets/index.html
          grep -q 'equipmentDetailModal' apk-check/assets/index.html
          grep -q 'renderCharacterStatusEquipment' apk-check/assets/index.html
          grep -q 'characterSkillsModal' apk-check/assets/index.html
          grep -q 'characterSkillsButton' apk-check/assets/index.html
          grep -q 'GM_SEMANTIC_PLAY_BOLD_R04' apk-check/assets/index.html
          grep -q 'gm-semantic' apk-check/assets/index.html
          grep -q 'SEMANTIC_COMPATIBILITY_TERMS=' apk-check/assets/index.html
          grep -q 'function semanticPrepareNextState(before,json)' apk-check/assets/index.html
          grep -q 'function renderSemanticText(entry)' apk-check/assets/index.html
          grep -q 'state=semanticPrepareNextState(state,json)' apk-check/assets/index.html
          grep -q 'entry.semanticSpans' apk-check/assets/index.html
          ! grep -q 'gmSemanticPlayBoldRuntime' apk-check/assets/index.html
          ! grep -q 'document.querySelectorAll(".message.gm .text")' apk-check/assets/index.html
          ! grep -q 'termsVersion(terms)' apk-check/assets/index.html
          grep -q 'Băng gạc' apk-check/assets/index.html
          grep -q 'Thuốc sát trùng' apk-check/assets/index.html
          grep -qi 'almond water' apk-check/assets/index.html
          grep -qi 'greek fire' apk-check/assets/index.html
          grep -qi 'liquid pain' apk-check/assets/index.html
          grep -q 'An Nhiên' apk-check/assets/index.html
          grep -q 'Huyết Ma Kiếm' apk-check/assets/index.html
          grep -q 'Huyết Ma Tứ Liên' apk-check/assets/index.html
          test -s apk-check/assets/fonts/Play-Bold.ttf
          cmp apk-check/assets/fonts/Play-Bold.ttf android-apk/app/src/main/assets/fonts/Play-Bold.ttf
          test -s apk-check/assets/entity/hound.webp
          test -s apk-check/assets/entity/slenderman.webp
          test -s apk-check/assets/entity/diep_minh.webp
          test -s apk-check/assets/entity/blackroot_sentinel.webp
          test -s apk-check/assets/entity/sinew_strider.webp
          test -s apk-check/assets/entity/hollow_grasper.webp
          test -s apk-check/assets/Kai_MadGod_snapshot_overlay.png
          test -s apk-check/assets/CAO_MINH_OVERLAY_EXPLORER_IDLE.png
          test -s apk-check/assets/CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png
          test -s apk-check/assets/avatars/MadGod.jpg
          test -s apk-check/assets/hud/player_action_backrooms.png
          test -s apk-check/assets/dice/die-1.png
          test -s apk-check/assets/dice/die-6.png
          test -s apk-check/assets/dice/roll-3d.png
          test -s apk-check/assets/dice/level0-wallpaper.svg

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.2.0.0.0-debug-apk
          path: Backroom-1.2.0.0.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.2.0.0.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.2.0.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0.0.0"
          TITLE="Backroom 1.2.0.0.0 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.2.0.0.0.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.2.0.0.0.apk --clobber
          else
            gh release create "$TAG" Backroom-1.2.0.0.0.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.2.0.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.2.0.0.0-verified.apk
          gh release download v1.2.0.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.2.0.0.0.apk' --output Backroom-1.2.0.0.0-verified.apk
          test -s Backroom-1.2.0.0.0-verified.apk
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/hound.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/slenderman.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/diep_minh.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/blackroot_sentinel.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/sinew_strider.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/entity/hollow_grasper.webp'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/avatars/MadGod.jpg'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/hud/player_action_backrooms.png'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/dice/die-1.png'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/dice/die-6.png'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/dice/roll-3d.png'
          unzip -l Backroom-1.2.0.0.0-verified.apk | grep -q 'assets/fonts/Play-Bold.ttf'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'characterSkillsModal'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'characterSkillsButton'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'GM_SEMANTIC_PLAY_BOLD_R04'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'UI_119_BACKPORT_R01'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'playerActionModal'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'POKER_DICE_CORE_BACKPORT_R01'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'pokerDiceModal'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.js | grep -q 'COMBAT_TRANSIENT_LOG_R01'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.js | grep -q 'packet&&packet.summary'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.css | grep -q '.combat-feedback-panel'
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.js | grep -q 'state.log'
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.js | grep -q 'localStorage'
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/combat-feedback-1193a.js | grep -q 'modal.hidden=true'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'DIRECT_COMBAT_GATE_V1'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'ensureDirectCombatDice'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'mountNearSnapshot();'
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'if(window.__combatFeedbackBusy){hide();return;}'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'POKER_DICE_119_POLISH_R01'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'poker-die-shadow'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'DICE_ROLL_ANIMATION_MS=680'
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'FINALIZE_PREVIEW_MS=2000'
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q "label:'TẤN CÔNG'"
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q "label:'NÉ TRÁNH'"
          ! unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q "label:'BỎ CHẠY'"
          unzip -p Backroom-1.2.0.0.0-verified.apk assets/index.html | grep -q 'gameMenuModal'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.2.0.0.0-verified.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.2.0.0.0-verified.apk
          SHA256=$(sha256sum Backroom-1.2.0.0.0-verified.apk | awk '{print $1}')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B release-status-sync "origin/$GITHUB_REF_NAME"
          rm -f release-status/v1.2.0.0.0-running.txt
          printf 'status=GREEN\nversion=1.2.0.0.0\ntag=v1.2.0.0.0\nasset=Backroom-1.2.0.0.0.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.2.0.0.0.txt
          git add release-status/v1.2.0.0.0.txt release-status/v1.2.0.0.0-running.txt
          git commit -m 'Record verified Backroom 1.2.0.0.0 debug release'
          git push origin "HEAD:${GITHUB_REF_NAME}"
