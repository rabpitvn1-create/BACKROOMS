name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY || secrets.OPENAI_KEY || secrets.GPT_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply Qwen proxy Game Master patch
        run: python3 android-apk/patch-qwen-text.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Apply Snapshot provider fallback patch
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply HD Kai and event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py
      - name: Remove Gemini from final APK runtime
        run: python3 android-apk/patch-remove-gemini.py
      - name: Finalize clean Kai overlay
        run: python3 android-apk/finalize-kai-overlay.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.20.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.20-debug-apk
          path: Backroom-1.1.20.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release v1.1.20
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.20"
          TITLE="Backroom 1.1.20"
          NOTES=$(cat <<'EOF'
          Backroom APK 1.1.20

          - Giữ nguyên runtime Qwen -> GPT và Snapshot GPT Image của 1.1.19.
          - Thay hoàn toàn asset Kai cũ bằng bản WebP RGBA chất lượng cao 512x768 từ ảnh người dùng cung cấp.
          - Bước finalizer chạy sau mọi patch để asset Kai cũ không thể ghi đè ngược lại trước khi Gradle build.
          - Ép lớp Kai hiển thị phía trên nền Level/Snapshot với z-index riêng.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.20.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.20.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
