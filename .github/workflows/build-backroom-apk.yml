name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py \
            --dataset intent_dataset.csv \
            --labels ../app/src/main/assets/models/backroom_intent_labels.txt \
            --output ../app/src/main/assets/models/backroom_intent.tflite \
            --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Validate Game Master configuration
        run: |
          test -n "$GEMINI_API_KEY_1" || (echo "Missing GitHub Secret: GEMINI_API_KEY_1" && exit 1)
          test -n "$GEMINI_API_KEY_2" || (echo "Missing GitHub Secret: GEMINI_API_KEY_2" && exit 1)
          test -n "$GEMINI_API_KEY_3" || (echo "Missing GitHub Secret: GEMINI_API_KEY_3" && exit 1)
          test -n "$GEMINI_API_KEY_4" || (echo "Missing GitHub Secret: GEMINI_API_KEY_4" && exit 1)
          test -n "$GEMINI_API_KEY_5" || (echo "Missing GitHub Secret: GEMINI_API_KEY_5" && exit 1)
          test -n "$LUNA_API_KEY" || (echo "Missing GitHub Secret: LUNA_API_KEY" && exit 1)
          test -n "$LUNA_MODEL" || (echo "Missing GitHub Secret: LUNA_MODEL" && exit 1)

      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply five-Gemini-first Game Master fallback patch
        run: python3 android-apk/patch-luna-text.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Prepare Snapshot UI/provider hooks
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py
      - name: Prefer packaged Kai PNG
        run: python3 android-apk/patch-kai-png-preferred.py
      - name: Inject Kai R05 character codex
        run: python3 android-apk/patch-kai-codex.py
      - name: Align R06 source marker validator
        run: python3 android-apk/patch-r06-source-marker.py
      - name: Inject Drive R06 canon and gameplay gates
        run: python3 android-apk/patch-drive-canon-gameplay.py
      - name: Apply Inventory ownership persistence
        run: python3 android-apk/patch-inventory-persistence.py
      - name: Apply dependency-routed canon and state operation reducer
        run: python3 android-apk/patch-ai-orchestrator.py
      - name: Harden state operation reducer
        run: python3 android-apk/patch-state-op-hardening.py
      - name: Apply health-weighted five-Gemini pool
        run: python3 android-apk/patch-gemini-health-pool.py
      - name: Apply conditional semantic audit
        run: python3 android-apk/patch-conditional-audit.py
      - name: Score audits from validated state delta
        run: python3 android-apk/patch-audit-validated-risk.py
      - name: Align Android gameplay dice with packaged canon
        run: python3 android-apk/patch-gameplay-parity-final.py
      - name: Apply final authority hardening
        run: python3 android-apk/patch-final-authority-hardening.py
      - name: Enforce rejected-op repair
        run: python3 android-apk/patch-rejected-op-repair-final.py
      - name: Align current Kai resource policy
        run: python3 android-apk/patch-kai-resource-policy-final.py
      - name: Apply Gemini runtime and Luna deadline compatibility
        run: python3 android-apk/patch-provider-deadline-final.py
      - name: Apply model-first Gemini fallback matrix
        run: python3 android-apk/patch-gemini-model-matrix-final.py
      - name: Harden final Java compile surface and Luna active-model failover
        run: python3 android-apk/patch-java-compile-hardening.py
      - name: Harden Save Load Delete and New Game controls
        run: python3 android-apk/patch-save-controls-final.py
      - name: Apply Single Player Hard Mode label
        run: python3 android-apk/patch-hard-mode-label.py
      - name: Leave Snapshot provider unconfigured
        run: python3 android-apk/patch-snapshot-unconfigured.py
      - name: Route deterministic commands through Kotlin Game State Core
        run: python3 android-apk/patch-game-state-core-bridge.py
      - name: Apply per-character Party Inventory UI
        run: python3 android-apk/patch-character-inventory-ui.py
      - name: Apply neutral Character Detail avatar and final UX patch
        run: python3 android-apk/patch-character-detail-avatar-fallback.py

      - name: Verify release provider, roaming and overlay contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          html = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = Path('android-apk/app/build.gradle').read_text(encoding='utf-8')
          canon = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/AnNhienCanon.kt').read_text(encoding='utf-8')
          overlay_manifest = json.loads(Path('android-apk/entity-overlay-source.json').read_text(encoding='utf-8'))
          overlay_dir = Path('android-apk/app/src/main/assets/entity_overlays')

          assert "versionCode 126" in gradle
          assert "versionName '1.1.49.1'" in gradle
          assert 'state&&state.partyDetails&&Array.isArray(state.partyDetails.members)' in html
          assert 'id="characterSurvivalHud"' in html
          assert '.message.gm{' in html
          assert 'focusLatestGmStart()' in html
          assert '#characterEquipmentList span,#characterInventoryItems span{text-transform:uppercase' in html
          assert 'id="gameplayPage"' in html
          assert 'id="infoPage"' in html
          assert 'data-app-page="gameplayPage"' in html
          assert 'data-app-page="infoPage"' in html
          assert 'output.put("partyDetails"' in facade
          assert 'output.put("gameTime"' in facade

          entries = overlay_manifest['entities']
          expected_entity_ids = [entry['id'] for entry in entries]
          assert overlay_manifest['qualityPolicy'] == 'exact-original-png-bytes-no-resize-no-recompression'
          assert len(entries) == 18 and len(set(expected_entity_ids)) == 18
          assert java.count('thresholdRoll("ENTITY.') == 18
          for entity_id in expected_entity_ids:
              assert f'thresholdRoll("{entity_id}", 10000, 300, physical' in java
          assert '.put("chancePerEntityPercent", 3.0)' in java
          assert '.put("independentPerEntity", true)' in java
          assert '.put("allPlayableLevels", true)' in java
          assert '.put("environmentRestricted", false)' in java
          assert 'thresholdRoll("jeffEncounter", 10000, 200' not in java
          assert 'ENTITY ROAMING HARD LOCK:' in java
          assert 'root.equals("jeff") && value instanceof JSONObject' in java

          assert len(list(overlay_dir.glob('*.png'))) == 18
          for entry in entries:
              data = (overlay_dir / entry['file']).read_bytes()
              assert len(data) == entry['size'], entry['file']
              assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['file']
          assert '<!-- ENTITY_OVERLAY_LOCAL_BEGIN -->' in html
          assert 'file:///android_asset/entity_overlays/' in html
          assert 'encounter.successIds' in html
          assert 'snapshot-entity-overlay' in html

          assert 'avatars/an_nhien_avatar.png' in canon
          assert 'an-nhien:pink-crocs' in canon
          assert 'private java.util.List<String> lunaModelCandidates(' in java
          assert 'new URL(baseUrl + "/models")' in java
          assert 'private boolean lunaInactiveModel(' in java
          assert 'models.add("gpt-5.6-sol")' in java
          assert 'Luna fallback / ' in java
          assert 'if (modelIndex == 0) return 45000;' in java
          assert 'cause instanceof java.net.SocketTimeoutException) return false;' in java
          assert 'Integer.bitCount(geminiModelTransientMaskMatrix[modelIndex]) >= 5' in java
          assert 'geminiTransportMaskMatrix &= ~(1 << keyIndex);' in java
          assert 'true, 120_000L' in java
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin core tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.49.1.apk

      - name: Verify APK signature and launcher
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs Backroom-1.1.49.1.apk
          "$AAPT" dump badging Backroom-1.1.49.1.apk | grep -q "package: name='com.rabpit.backroom'"
          "$AAPT" dump badging Backroom-1.1.49.1.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          unzip -l Backroom-1.1.49.1.apk | grep -q 'AndroidManifest.xml'
          unzip -l Backroom-1.1.49.1.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.49.1.apk | grep -q 'assets/entity_overlays/slenderman.png'
          unzip -l Backroom-1.1.49.1.apk | grep -q 'classes.dex'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.49.1-apk
          path: Backroom-1.1.49.1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.49.1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.49.1"
          TITLE="Backroom 1.1.49.1"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.49.1.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.49.1.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.49.1.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f Backroom-1.1.49.1-verified.apk
          gh release view v1.1.49.1 --repo "$GITHUB_REPOSITORY"
          gh release download v1.1.49.1 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.49.1.apk' --output Backroom-1.1.49.1-verified.apk
          test -s Backroom-1.1.49.1-verified.apk
          unzip -l Backroom-1.1.49.1-verified.apk | grep -q 'AndroidManifest.xml'
          unzip -l Backroom-1.1.49.1-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.49.1-verified.apk | grep -q 'assets/avatars/an_nhien_avatar.png'
          unzip -l Backroom-1.1.49.1-verified.apk | grep -q 'assets/entity_overlays/slenderman.png'
          unzip -l Backroom-1.1.49.1-verified.apk | grep -q 'classes.dex'
          SHA256=$(sha256sum Backroom-1.1.49.1-verified.apk | awk '{print $1}')
          mkdir -p release-status
          printf 'status=GREEN\nversion=1.1.49.1\ntag=v1.1.49.1\nasset=Backroom-1.1.49.1.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.1.49.1.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.1.49.1.txt
          git commit -m 'Record verified Backroom 1.1.49.1 release'
          git push origin HEAD:main
