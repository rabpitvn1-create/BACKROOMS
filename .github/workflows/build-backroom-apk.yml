name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY || secrets.OPENAI_KEY || secrets.GPT_API_KEY_1 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply Claude primary Game Master patch
        run: python3 android-apk/patch-claude-text.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Apply Snapshot provider fallback patch
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply HD Kai and event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py
      - name: Finalize clean Kai overlay
        run: python3 android-apk/finalize-kai-overlay.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.21.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.21-debug-apk
          path: Backroom-1.1.21.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release v1.1.21
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.21"
          TITLE="Backroom 1.1.21"
          NOTES=$(cat <<'EOF'
          Backroom APK 1.1.21

          - Game Master đổi sang Claude làm provider ưu tiên số 1.
          - Claude API key, Base URL và model lấy từ GitHub Secrets.
          - Thứ tự text provider: Claude -> GPT -> Gemini.
          - Chỉ còn một Gemini secret: GEMINI_API_KEY_1.
          - Snapshot tiếp tục dùng pipeline Gemini -> GPT Image và chỉ tự tạo khi có sự kiện hình ảnh đáng kể.
          - Đã loại Qwen khỏi workflow build và BuildConfig của APK.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.21.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.21.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
