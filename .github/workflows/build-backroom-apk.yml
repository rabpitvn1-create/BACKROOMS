name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          mkdir -p release-status
          printf 'status=RUNNING\nversion=1.1.59\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.1.59-running.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.1.59-running.txt
          git commit -m "Record active Backroom 1.1.59 run $GITHUB_RUN_ID"
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify final runtime contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = Path('android-apk/app/build.gradle').read_text(encoding='utf-8')
          madgod = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/MadGodCanon.kt').read_text(encoding='utf-8')
          engines = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/Engines.kt').read_text(encoding='utf-8')
          tests = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/MadGodEquipmentTest.kt').read_text(encoding='utf-8')
          save_repo = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/SaveRepository.kt').read_text(encoding='utf-8')
          entity_dir = Path('android-apk/app/src/main/assets/entity')

          required = [
              ("versionCode 61", gradle), ("versionName '1.1.59'", gradle),
              ('id="searchActionButton"', html), ('id="exploreActionButton"', html), ('STEP2_THREE_ACTIONS', html),
              ('madGodSetEquipped()', html), ("return ['MadGod Set','Omnivault Ring']", html),
              ('const val CHEAT_CODE = "/madgod"', madgod), ('const val MADGOD_SET_ID = "madgod:set"', madgod),
              ('MadGodCanon.cheat(action)', facade), ('applyMadGodCheat(legacy,state)', facade),
              ('if (isMadGodEquipRequest(action))', facade), ('commandId = "$turnId:MADGOD:EQUIP"', facade),
              ('"madgod_equipped"', facade), ('output.put("equipment",MadGodCanon.legacy(state))', facade),
              ('val boundSlots = equipment.slots + mapOf("weapon" to MADGOD_SET_ID, "armor" to MADGOD_SET_ID)', engines),
              ('if (command.actorId != KAI_ID) return invalid(state,"madgod_equipment_slot_mismatch")', engines),
              ('equipOverwritesKaisExistingWeaponAndArmorFromNormalWeaponSlot', tests),
              ('runtimeEquipStateProjectsMadGodInsteadOfKaiDefaultGear', tests),
              ('sceneKey:visualSceneKey()', java), ('r.sceneKey===visualSceneKey()', java),
              ('private int mentionedLevel(JSONObject state)', java),
              ('return exitFound && progressionReady(before);', java),
              ('exploration.put("minimumTurns", 6)', java),
              ('recordLevelProgress(state, oldLevel, newLevel)', java),
              ('partyDetails&&state.partyDetails.members', java),
              ('rolls.put("roamingEntityId"', java), ('file:///android_asset/entity/', java),
              ('private JSONObject resolveEntityOverlay(', java), ('window.backroomEntityOverlay=function(payload)', java),
              ('private void forceEntityEncounterFlag(JSONObject candidateState, JSONObject rolls)', java),
              ('forceEntityEncounterFlag(candidateState, rolls);', java),
              ("box.style.position='relative';box.style.overflow='hidden'", java),
              ('Kai_MadGod_snapshot_overlay.png', java),
              ('class SharedPreferencesSaveRepository', save_repo),
          ]
          for marker, source in required:
              assert marker in source, marker
          assert 'slot != "set" || MadGodCanon.slot(command.itemId' not in engines

          required_assets = [
              'hound.png','clump.png','duller.png','deathmoth.png','hostile_faceling.png','false_puddle.png','paintings.png',
              'smiler.png','skin-stealer.png','predatory_window.png','biological_pipeline.png','wretch.png','cable_mimic.png',
              'the_beast_of_level_5.png','hotel_corpse_lure.png','jeff_the_killer.png','jane_the_killer.png','slenderman.png'
          ]
          for name in required_assets:
              p = entity_dir / name
              assert p.is_file() and p.stat().st_size > 0, name
          for p in [Path('android-apk/app/src/main/assets/Kai_MadGod_snapshot_overlay.png'), Path('android-apk/app/src/main/assets/avatars/MadGod.jpg')]:
              assert p.is_file() and p.stat().st_size > 0, str(p)

          combined = html + java + gradle + facade + save_repo
          for forbidden in ['drive.google.com','www.googleapis.com/auth/drive','DriveOnlineSaveManager','com.google.android.gms:play-services-auth','ENTITY_MANIFEST_FILE_ID','readEntityManifestRemote']:
              assert forbidden not in combined, forbidden
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.59.apk

      - name: Verify packaged APK contracts
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.59.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.59.apk | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.59.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.59.apk
          rm -rf apk-check && mkdir apk-check
          unzip -q Backroom-1.1.59.apk 'assets/index.html' 'assets/entity/*' 'assets/Kai_MadGod_snapshot_overlay.png' 'assets/avatars/MadGod.jpg' -d apk-check
          grep -q 'searchActionButton' apk-check/assets/index.html
          grep -q 'exploreActionButton' apk-check/assets/index.html
          grep -q 'madGodSetEquipped' apk-check/assets/index.html
          test -s apk-check/assets/entity/hound.png
          test -s apk-check/assets/entity/slenderman.png
          test -s apk-check/assets/Kai_MadGod_snapshot_overlay.png
          test -s apk-check/assets/avatars/MadGod.jpg

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.59-debug-apk
          path: Backroom-1.1.59.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.59
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.59"
          TITLE="Backroom 1.1.59 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.59.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.59.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.59.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.59-verified.apk
          gh release download v1.1.59 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.59.apk' --output Backroom-1.1.59-verified.apk
          test -s Backroom-1.1.59-verified.apk
          unzip -l Backroom-1.1.59-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.59-verified.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.59-verified.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.59-verified.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.1.59-verified.apk | grep -q 'assets/avatars/MadGod.jpg'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.59-verified.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.59-verified.apk
          SHA256=$(sha256sum Backroom-1.1.59-verified.apk | awk '{print $1}')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B release-status-sync origin/main
          rm -f release-status/v1.1.59-running.txt
          printf 'status=GREEN\nversion=1.1.59\ntag=v1.1.59\nasset=Backroom-1.1.59.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.1.59.txt
          git add release-status/v1.1.59.txt release-status/v1.1.59-running.txt
          git commit -m 'Record verified Backroom 1.1.59 debug release'
          git push origin HEAD:main
