  # Runs the *uploaded* APK, not a different locally rebuilt application.
  # Kept separate from the standard build gate because emulator startup is costly.
  emulator-play-artifact:
    name: Play actual APK on Android Emulator
    if: github.event_name == 'pull_request'
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged game APK from this run
        uses: actions/download-artifact@v4
        with:
          name: Backroom-1.2.0.0.38-debug-apk
          path: emulator-artifacts/game

      - name: Download same-signer Android instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: Backroom-AndroidTest-debug-apk
          path: emulator-artifacts/instrumentation

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and play real APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash android-apk/scripts/emulator-play-artifact.sh

      - name: Upload emulator screenshots, log and playthrough report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-Emulator-Gameplay-Evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
