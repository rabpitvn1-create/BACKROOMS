name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          mkdir -p release-status
          printf 'status=RUNNING\nversion=1.1.63.0.1\nsource_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-status/v1.1.63.0.1-running.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/v1.1.63.0.1-running.txt
          git commit -m "Record active Backroom 1.1.63.0.1 run $GITHUB_RUN_ID"
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEHIHI_API_KEY GEHIHI_MODEL GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY SOL_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-provider-key-pool.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-ui-1.1.99-shell.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify final runtime contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = (core / 'GameCoreFacade.kt').read_text(encoding='utf-8')
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          madgod = (core / 'MadGodCanon.kt').read_text(encoding='utf-8')
          engines = (core / 'Engines.kt').read_text(encoding='utf-8')
          equipment_system = (core / 'CharacterEquipmentSystem.kt').read_text(encoding='utf-8')
          status_tests = (root / 'app/src/test/java/com/rabpit/backroom/core/CharacterStatusEquipmentSystemTest.kt').read_text(encoding='utf-8')
          save_repo = (core / 'SaveRepository.kt').read_text(encoding='utf-8')
          combat = (core / 'CombatRuntime.kt').read_text(encoding='utf-8')
          skill_catalog = (core / 'CompanionSkillCatalog.kt').read_text(encoding='utf-8')
          detail_json = (core / 'CharacterDetailJson.kt').read_text(encoding='utf-8')
          an_nhien = (core / 'AnNhienCanon.kt').read_text(encoding='utf-8')
          skill_tests = (root / 'app/src/test/java/com/rabpit/backroom/core/CompanionSkillCatalogTest.kt').read_text(encoding='utf-8')
          chain = (root / 'patch-inventory-capacity-final-fix.py').read_text(encoding='utf-8')
          entity_dir = root / 'app/src/main/assets/entity'

          required = [
              ("versionCode 66", gradle), ("versionName '1.1.63.0.1'", gradle),
              ('.snapshot{height:300px;margin:8px 10px 10px;', html),
              ('UI_119_BACKPORT_R01', html), ('id="playerActionBar"', html), ('id="playerActionModal"', html),
              ('id="playerActionConfirm"', html), ('id="gameMenuModal"', html), ('id="gameMenuOpen"', html),
              ('border-radius:7px', html), ('hud/player_action_backrooms.png', html),
              ('BuildConfig.GEHIHI_API_KEY', java), ('BuildConfig.GEHIHI_MODEL', java),
              ('BuildConfig.SOL_API_KEY', java), ('BuildConfig.HAKU_API_KEY', java),
              ('emit("backroomProvider", "Gehihi")', java), ('emit("backroomProvider", "Haku")', java), ('emit("backroomProvider", "SOL")', java),
              ('id="searchActionButton"', html), ('id="exploreActionButton"', html), ('STEP2_THREE_ACTIONS', html),
              ('madGodSetEquipped()', html), ('id="equipmentDetailModal"', html), ('window.renderCharacterStatusEquipment=render;', html),
              ('id="characterSkillsModal"', html), ("button.id='characterSkillsButton'", html), ('function openSkills()', html),
              ('const val CHEAT_CODE = "/madgod"', madgod), ('const val MADGOD_SET_ID = "madgod:set"', madgod),
              ('MadGodCanon.cheat(action)', facade), ('applyMadGodCheat(legacy,state)', facade),
              ('if (isMadGodEquipRequest(action))', facade), ('commandId = "$turnId:MADGOD:EQUIP"', facade),
              ('"madgod_equipped"', facade), ('output.put("equipment",MadGodCanon.legacy(state))', facade),
              ('ItemCommand.Operation.EQUIP -> EquipmentEngine.equip(state, command)', engines),
              ('ItemCommand.Operation.UNEQUIP -> EquipmentEngine.unequip(state, command)', engines),
              ('occupiesSlots = setOf(EquipmentSlot.WEAPON, EquipmentSlot.ARMOR)', equipment_system),
              ('bonuses = EquipmentBonuses(hp = 50, str = 15, df = 30, agi = 12, crit = 12)', equipment_system),
              ('CharacterStatEngine.preserveMissingHp', equipment_system),
              ('fun applyCompletedTurnRegen', equipment_system),
              ('madGodIsNotCanonicalStartingLoadoutAndCountsOnceAcrossTwoSlots', status_tests),
              ('regenRunsExactlyOnceAndZeroHpCannotBeRescued', status_tests),
              ('inventoryOwnsSameItemReferencedByEquipment', status_tests),
              ('sceneKey:visualSceneKey()', java), ('r.sceneKey===visualSceneKey()', java),
              ('private int mentionedLevel(JSONObject state)', java),
              ('return exitFound && progressionReady(before);', java),
              ('exploration.put("minimumTurns", 6)', java),
              ('recordLevelProgress(state, oldLevel, newLevel)', java),
              ('partyDetails&&state.partyDetails.members', java),
              ('rolls.put("roamingEntityKey"', java), ('file:///android_asset/entity/', java),
              ('"hotel_corpse_lure","jeff_the_killer","jane_the_killer","slenderman"', java),
              ('String entityKey = rolls.optString("roamingEntityKey", "").trim();', java),
              ('requireGameCore().startCombatState(candidateState.toString(), canonicalKey);', java),
              ("function activeEntityKey(){var c=state&&state.combat;if(!c||c.active!==true)return '';return normalizeEntityKey(c.entityKey);}", java),
              ('private JSONObject resolveEntityOverlay(', java), ('window.backroomEntityOverlay=function(payload)', java),
              ('private void forceEntityEncounterFlag(JSONObject candidateState, JSONObject rolls)', java),
              ('forceEntityEncounterFlag(candidateState, rolls);', java),
              ('boolean exploreAction = "EXPLORE".equals(actionKindNormalized);', java),
              ('makeGameplayRolls(before, actionKind, action, meta)', java),
              ("box.style.position='relative';box.style.overflow='hidden'", java),
              ('Kai_MadGod_snapshot_overlay.png', java),
              ('class SharedPreferencesSaveRepository', save_repo),
              ('private fun normalizeVisualPresence(state: GameState): GameState', facade),
              ('val resolvedEntityKey = CombatRuntime.active(current)?.entityKey.orEmpty()', facade),
              ('flags.put("entityEncounterKey", "")', facade),
              ('next = next.copy(world = next.world + ("flagsJson" to flags.toString()))', facade),
              ('thresholdRoll("diepMinhEncounter", 10000, 300,', java),
              ('entityKey = "diep_minh";', java),
              ('ARGUS // Thousandfold Execution', skill_catalog), ('Twosome Time', skill_catalog), ('Honeycomb Fire', skill_catalog),
              ('GodKiller Override // Twenty-Four Severance', skill_catalog), ('Crimson Guillotine', skill_catalog), ('Spatial Dominion', skill_catalog),
              ('Kế Hoạch Không Có Trong Kế Hoạch', skill_catalog), ('Quăng Đại Cái Gì Đó', skill_catalog),
              ('CompanionSkillCatalog.forCharacter(c.id)', detail_json), ('COMPANION_SKILLS_R01', combat), ('24 * 10', combat),
              ('hazardThresholds[level] * 75 / 100', java), ('thresholdRoll("anNhienRead", 10000, 2000', java),
              ('class CompanionSkillCatalogTest', skill_tests),
              ('runpy.run_path(str(ROOT / "patch-companion-skills-ui-finalize.py"), run_name="__main__")', chain),
          ]
          for marker, source in required:
              assert marker in source, marker
          provider_start = java.index('  private String generateText(String prompt)')
          provider_end = java.index('\n  private JSONObject parseModelJson', provider_start)
          provider_flow = java[provider_start:provider_end]
          assert provider_flow.index('"Gehihi"') < provider_flow.index('"Gemini') < provider_flow.index('"Haku"') < provider_flow.index('"SOL"')
          retired_prefix = 'LU' + 'NA_'
          retired_method = 'lu' + 'naText'
          assert retired_prefix not in java
          assert retired_method not in java
          assert retired_prefix not in gradle
          assert 'height:230px' not in java
          assert '"nonCombat" to "true"' in an_nhien
          assert '"canUseWeapons" to "false"' in an_nhien
          an_start = skill_catalog.index('private val anNhien = listOf(')
          an_end = skill_catalog.index('private val kai = listOf(', an_start)
          assert 'Weapon DMG' not in skill_catalog[an_start:an_end]
          assert html.count("button.id='characterSkillsButton'") == 1
          assert html.count('id="characterSkillsModal"') == 1
          assert 'rolls.put("roamingEntityId"' not in java
          assert 'makeGameplayRolls(before, action, meta)' not in java
          assert 'slot != "set" || MadGodCanon.slot(command.itemId' not in engines
          assert 'appendEquipmentBadge(box)' not in java
          assert 'const val MULTIPLIER = 50' not in madgod
          assert 'jeffEncounter' not in java
          assert 'janeEncounter' not in java

          required_assets = [
              'hound.png','clump.png','duller.png','deathmoth.png','hostile_faceling.png','false_puddle.png','paintings.png',
              'smiler.png','skin-stealer.png','predatory_window.png','biological_pipeline.png','wretch.png','cable_mimic.png',
              'the_beast_of_level_5.png','hotel_corpse_lure.png','jeff_the_killer.png','jane_the_killer.png','slenderman.png','diep_minh.png'
          ]
          for name in required_assets:
              p = entity_dir / name
              assert p.is_file() and p.stat().st_size > 0, name
          for p in [root / 'app/src/main/assets/Kai_MadGod_snapshot_overlay.png', root / 'app/src/main/assets/avatars/MadGod.jpg']:
              assert p.is_file() and p.stat().st_size > 0, str(p)

          combined = html + java + gradle + facade + save_repo
          for forbidden in ['drive.google.com','www.googleapis.com/auth/drive','DriveOnlineSaveManager','com.google.android.gms:play-services-auth','ENTITY_MANIFEST_FILE_ID','readEntityManifestRemote']:
              assert forbidden not in combined, forbidden
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.63.0.1.apk

      - name: Verify packaged APK contracts
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.63.0.1.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.63.0.1.apk | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.63.0.1.apk | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.63.0.1.apk
          rm -rf apk-check && mkdir apk-check
          unzip -q Backroom-1.1.63.0.1.apk 'assets/index.html' 'assets/entity/*' 'assets/Kai_MadGod_snapshot_overlay.png' 'assets/avatars/MadGod.jpg' 'assets/hud/player_action_backrooms.png' -d apk-check
          grep -q 'searchActionButton' apk-check/assets/index.html
          grep -q 'exploreActionButton' apk-check/assets/index.html
          grep -q 'UI_119_BACKPORT_R01' apk-check/assets/index.html
          grep -q 'playerActionModal' apk-check/assets/index.html
          grep -q 'gameMenuModal' apk-check/assets/index.html
          grep -q 'playerActionConfirm' apk-check/assets/index.html
          grep -q 'madGodSetEquipped' apk-check/assets/index.html
          grep -q 'equipmentDetailModal' apk-check/assets/index.html
          grep -q 'renderCharacterStatusEquipment' apk-check/assets/index.html
          grep -q 'characterSkillsModal' apk-check/assets/index.html
          grep -q 'characterSkillsButton' apk-check/assets/index.html
          test -s apk-check/assets/entity/hound.png
          test -s apk-check/assets/entity/slenderman.png
          test -s apk-check/assets/entity/diep_minh.png
          test -s apk-check/assets/Kai_MadGod_snapshot_overlay.png
          test -s apk-check/assets/avatars/MadGod.jpg
          test -s apk-check/assets/hud/player_action_backrooms.png

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.63.0.1-debug-apk
          path: Backroom-1.1.63.0.1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.63.0.1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.63.0.1"
          TITLE="Backroom 1.1.63.0.1 Debug"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.63.0.1.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.63.0.1.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.63.0.1.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK and record GREEN release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.63.0.1-verified.apk
          gh release download v1.1.63.0.1 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.63.0.1.apk' --output Backroom-1.1.63.0.1-verified.apk
          test -s Backroom-1.1.63.0.1-verified.apk
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/entity/hound.png'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/entity/slenderman.png'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/entity/diep_minh.png'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/Kai_MadGod_snapshot_overlay.png'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/avatars/MadGod.jpg'
          unzip -l Backroom-1.1.63.0.1-verified.apk | grep -q 'assets/hud/player_action_backrooms.png'
          unzip -p Backroom-1.1.63.0.1-verified.apk assets/index.html | grep -q 'characterSkillsModal'
          unzip -p Backroom-1.1.63.0.1-verified.apk assets/index.html | grep -q 'characterSkillsButton'
          unzip -p Backroom-1.1.63.0.1-verified.apk assets/index.html | grep -q 'UI_119_BACKPORT_R01'
          unzip -p Backroom-1.1.63.0.1-verified.apk assets/index.html | grep -q 'playerActionModal'
          unzip -p Backroom-1.1.63.0.1-verified.apk assets/index.html | grep -q 'gameMenuModal'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.63.0.1-verified.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.63.0.1-verified.apk
          SHA256=$(sha256sum Backroom-1.1.63.0.1-verified.apk | awk '{print $1}')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B release-status-sync origin/main
          rm -f release-status/v1.1.63.0.1-running.txt
          printf 'status=GREEN\nversion=1.1.63.0.1\ntag=v1.1.63.0.1\nasset=Backroom-1.1.63.0.1.apk\nsource_sha=%s\nrun_id=%s\nsha256=%s\nbuild_type=debug\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SHA256" > release-status/v1.1.63.0.1.txt
          git add release-status/v1.1.63.0.1.txt release-status/v1.1.63.0.1-running.txt
          git commit -m 'Record verified Backroom 1.1.63.0.1 debug release'
          git push origin HEAD:main
