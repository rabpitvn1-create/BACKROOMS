name: Build Backroom APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - "lib/canon.js"
      - "scripts/sync-prologue.py"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY || secrets.OPENAI_KEY || secrets.GPT_API_KEY_1 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize Prologue sources
        run: python3 scripts/sync-prologue.py

      - name: Persist synchronized server canon
        continue-on-error: true
        run: |
          if ! git diff --quiet -- lib/canon.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/canon.js
            git commit -m "Sync Prologue source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate Game Master configuration
        run: |
          test -n "$GEMINI_API_KEY_1" || (echo "Missing GitHub Secret: GEMINI_API_KEY_1" && exit 1)
          test -n "$GEMINI_API_KEY_2" || (echo "Missing GitHub Secret: GEMINI_API_KEY_2" && exit 1)
          test -n "$LUNA_API_KEY" || (echo "Missing GitHub Secret: LUNA_API_KEY" && exit 1)
          test -n "$LUNA_MODEL" || (echo "Missing GitHub Secret: LUNA_MODEL" && exit 1)

      - name: Apply provider, DNS and Kai overlay patch
        run: python3 android-apk/patch-provider-status.py
      - name: Apply Gemini-first Game Master fallback patch
        run: python3 android-apk/patch-luna-text.py
      - name: Apply Level 0-6 Snapshot fallback backgrounds
        run: python3 android-apk/patch-level-snapshot-backgrounds.py
      - name: Prepare Snapshot UI/provider hooks
        run: python3 android-apk/patch-snapshot-fallback.py
      - name: Apply event-only Snapshot patch
        run: python3 android-apk/patch-kai-hd-continuous.py
      - name: Prefer packaged Kai PNG
        run: python3 android-apk/patch-kai-png-preferred.py
      - name: Inject Kai R05 character codex
        run: python3 android-apk/patch-kai-codex.py
      - name: Inject Drive R06 canon and gameplay gates
        run: python3 android-apk/patch-drive-canon-gameplay.py
      - name: Apply Inventory ownership persistence
        run: python3 android-apk/patch-inventory-persistence.py
      - name: Apply Single Player Hard Mode label
        run: python3 android-apk/patch-hard-mode-label.py
      - name: Leave Snapshot provider unconfigured
        run: python3 android-apk/patch-snapshot-unconfigured.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare release APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.28.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.28-debug-apk
          path: Backroom-1.1.28.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.28
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.28"
          TITLE="Backroom 1.1.28"
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.28.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.28.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.28.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
