name: Test Android Game Core

# Serial execution lock: this workflow is manual-only. Main releases are validated
# by build-backroom-apk.yml so two dependent Android build pipelines never compete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact Android release patch chain
        run: |
          python3 android-apk/patch-provider-status.py
          python3 android-apk/patch-luna-text.py
          python3 android-apk/patch-level-snapshot-backgrounds.py
          python3 android-apk/patch-snapshot-fallback.py
          python3 android-apk/patch-kai-hd-continuous.py
          python3 android-apk/patch-kai-png-preferred.py
          python3 android-apk/patch-kai-codex.py
          python3 android-apk/patch-r06-source-marker.py
          python3 android-apk/patch-drive-canon-gameplay.py
          python3 android-apk/patch-inventory-persistence.py
          python3 android-apk/patch-ai-orchestrator.py
          python3 android-apk/patch-state-op-hardening.py
          python3 android-apk/patch-gemini-health-pool.py
          python3 android-apk/patch-conditional-audit.py
          python3 android-apk/patch-audit-validated-risk.py
          python3 android-apk/patch-gameplay-parity-final.py
          python3 android-apk/patch-final-authority-hardening.py
          python3 android-apk/patch-rejected-op-repair-final.py
          python3 android-apk/patch-kai-resource-policy-final.py
          python3 android-apk/patch-provider-deadline-final.py
          python3 android-apk/patch-gemini-model-matrix-final.py
          python3 android-apk/patch-java-compile-hardening.py
          python3 android-apk/patch-save-controls-final.py
          python3 android-apk/patch-hard-mode-label.py
          python3 android-apk/patch-snapshot-unconfigured.py
          python3 android-apk/patch-game-state-core-bridge.py
          python3 android-apk/patch-character-inventory-ui.py
          python3 android-apk/patch-character-detail-avatar-fallback.py

      - name: Verify packaged UI runtime contracts before compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = Path('android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          assert 'const prologue=`Bữa tối bắt đầu như bao lần khác.' in html
          assert '{role:"gm",text:"MỞ ĐẦU' in html
          assert 'inventory:[]' in html
          unsafe_inventory_render = 'inventoryEl.innerHTML=chips(state.inventory);'
          safe_inventory_render = 'if(inventoryEl)inventoryEl.innerHTML=chips(state.inventory);'
          assert safe_inventory_render in html
          assert unsafe_inventory_render not in html.replace(safe_inventory_render, '')
          assert 'data-character="kai"' in html
          assert 'avatars/kai_avatar.png' in html
          assert 'id="characterStatusList"' in html
          assert '<h3>Status</h3>' in html
          assert 'state&&state.partyDetails&&Array.isArray(state.partyDetails.members)' in html
          assert 'for(let i=0;i<max;i++)' in html
          assert 'Thời gian chủ quan:' in html
          assert "const detailAvatarSrc=member.avatar||member.avatarRef||(member.id==='kai'?'avatars/kai_avatar.png':'');" in html
          assert 'detailAvatar.hidden=!detailAvatarSrc;' in html
          assert "member.id==='kai'?'avatars/kai_avatar.png':'avatars/kai_avatar.png'" not in html
          assert 'output.put("partyDetails"' in facade
          assert 'output.put("gameTime"' in facade
          assert 'function clearAuthoritativeCore()' in html
          assert 'Android.clearCoreState()' in html
          assert 'function save()' in html and 'function load()' in html
          assert 'function resetGame()' in html and 'function clearSave()' in html
          assert '@JavascriptInterface public void clearCoreState()' in java
          assert 'gameCore.clear();' in java
          PY

      - name: Verify Party Character Detail end-to-end contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          serializer = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailJson.kt').read_text(encoding='utf-8')
          projection = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterDetailProjection.kt').read_text(encoding='utf-8')
          codec_test = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/GameStateCodecTest.kt').read_text(encoding='utf-8')
          json_test = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterDetailJsonTest.kt').read_text(encoding='utf-8')
          projection_test = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/CharacterDetailProjectionTest.kt').read_text(encoding='utf-8')

          # Core -> projection -> serialized WebView state.
          assert 'CharacterDetailProjector.projectParty(state)' in facade
          assert 'CharacterDetailJson.encodeParty' in facade
          for token in ['"leaderId"', '"maxMembers"', '"elapsedSubjectiveMinutes"', '"members"']:
            assert token in serializer
          for token in ['"physiology"', '"inventory"', '"equipment"', '"statuses"', '"injuries"']:
            assert token in serializer
          assert 'state.party.memberIds' in projection
          assert 'inventoryId' in projection and 'equipmentId' in projection

          # Serialized party -> four-slot selector -> selected member detail.
          assert "function detailMembers()" in html
          assert "function memberById(id)" in html
          assert "function openMember(id)" in html
          assert "renderMemberDetail(member)" in html
          assert "Math.min(4" in html
          assert "party.querySelectorAll('.party-member[data-character]')" in html
          assert "statusRows(member)" in html
          assert "equipmentRows(member)" in html
          assert "Array.isArray(member.inventory)" in html

          # Backward compatibility and persistence remain covered.
          assert 'fallback=[' in html and "id:'kai'" in html
          assert 'currentCharacterWithoutPhysiologyDefaultsToUnknownState' in codec_test
          assert 'legacyWebViewSaveMigratesWithoutLosingNormalInventoryOrParty' in codec_test
          assert 'encodeParty' in json_test
          assert 'projectParty' in projection_test
          assert "localStorage.setItem('backroom-apk-state'" in html or 'localStorage.setItem("backroom-apk-state"' in html
          assert 'function load()' in html

          # Unknown portraits must never impersonate Kai.
          assert "member.id==='kai'?'avatars/kai_avatar.png':''" in html
          assert "member.id==='kai'?'avatars/kai_avatar.png':'avatars/kai_avatar.png'" not in html
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run authoritative Kotlin tests and compile APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK artifact exists
        run: test -s android-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Kai avatar is a packaged PNG
        run: |
          test -s android-apk/app/src/main/assets/avatars/kai_avatar.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-apk/app/src/main/assets/avatars/kai_avatar.png')
          assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          PY

      - name: Verify Prologue and Equipment separation in packaged UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('android-apk/app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'const prologue=`Bữa tối bắt đầu như bao lần khác.' in text
          assert '{role:"gm",text:"MỞ ĐẦU' in text
          assert 'inventory:[]' in text
          assert '3 / 9 loại vật phẩm' not in text
          assert '<span>W.W Magnum</span>' in text
          assert '<span>Blackblood Armor & linked modules</span>' in text
          assert '<span>Omnivault Ring</span>' in text
          assert '<span>White Wraith Magnum</span>' not in text
          assert '<span>Omnivault Ring / Nhẫn Vạn Tàng</span>' not in text
          assert 'state.inventory.filter(x=>!isSignatureItem(x))' in text
          PY

      - name: Verify retired pickup reconciliation is absent
        run: |
          test ! -e android-apk/patch-inventory-pickup-reconcile-final.py
          ! grep -R "gm_confirmed_pickup\|omnivault_restore" android-apk/app/src/main/java/com/rabpit/backroom/core --include='*.kt'
