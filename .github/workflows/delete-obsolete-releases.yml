name: Delete Obsolete Releases

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_1.1.96_1.1.97_1.1.98 to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DELETE_1.1.96_1.1.97_1.1.98"

      - name: Delete releases and preserve Git tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in BR-1.1.96 BR-1.1.97 BR-1.1.98; do
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GH_REPO" --yes
            else
              echo "Release $tag is already absent."
            fi
          done
