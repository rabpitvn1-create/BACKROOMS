name: Materialize Party Entity Overlays

on:
  push:
    branches:
      - feat/lucia-syvial-entity-overlays
    paths:
      - "android-apk/party-entity-overlay-source.json"
      - ".github/workflows/materialize-party-entity-overlays.yml"

permissions:
  contents: write

concurrency:
  group: materialize-party-entity-overlays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact Lucia and Syvial PNG files from Drive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import struct
          import urllib.request

          root = Path('.')
          manifest = json.loads((root / 'android-apk/party-entity-overlay-source.json').read_text(encoding='utf-8'))
          entries = manifest['assets']
          assert {entry['id'] for entry in entries} == {'lucia', 'syvial'}
          assert manifest['qualityPolicy'] == 'exact-original-png-bytes-no-resize-no-recompression'

          def fetch_original(file_id: str) -> bytes:
              urls = [
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t',
              ]
              errors = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                      if data.startswith(b'\x89PNG\r\n\x1a\n'):
                          return data
                      errors.append(f'{url}: not PNG ({len(data)} bytes)')
                  except Exception as exc:
                      errors.append(f'{url}: {exc}')
              raise RuntimeError('Drive download failed: ' + ' | '.join(errors))

          for entry in entries:
              data = fetch_original(entry['driveFileId'])
              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if data[12:16] != b'IHDR' or len(data) < 24:
                  raise RuntimeError(f"{entry['sourceFile']}: invalid PNG IHDR")
              width, height = struct.unpack('>II', data[16:24])
              if actual_size != entry['size']:
                  raise RuntimeError(f"{entry['sourceFile']}: size changed, expected {entry['size']}, got {actual_size}")
              if actual_sha != entry['sha256']:
                  raise RuntimeError(f"{entry['sourceFile']}: SHA-256 changed, expected {entry['sha256']}, got {actual_sha}")
              if (width, height) != (entry['width'], entry['height']):
                  raise RuntimeError(f"{entry['sourceFile']}: dimensions changed, got {width}x{height}")
              runtime = root / 'android-apk' / entry['runtimeFile']
              runtime.parent.mkdir(parents=True, exist_ok=True)
              runtime.write_bytes(data)
              print(f"OK {entry['id']} -> {runtime} {width}x{height} {actual_size} {actual_sha}")
          PY

      - name: Commit exact runtime PNGs and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-party-entity-overlays.yml
          git add android-apk/app/src/main/assets/party_entity_overlays/lucia.png
          git add android-apk/app/src/main/assets/party_entity_overlays/syvial.png
          git commit -m "Add Lucia and Syvial Entity overlay assets"
          git push origin HEAD:${GITHUB_REF_NAME}
