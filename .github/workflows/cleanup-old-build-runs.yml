name: Cleanup old Build Backroom runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-build-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Build Backroom runs 753 through 762
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          wanted = set(range(753, 763))
          found = {}
          page = 1

          def request(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "BACKROOMS-actions-cleanup",
                  },
              )
              return urllib.request.urlopen(req, timeout=30)

          while wanted - set(found):
              url = (
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  f"build-backroom-apk.yml/runs?per_page=100&page={page}"
              )
              with request(url) as response:
                  payload = json.load(response)
              runs = payload.get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  number = int(run.get("run_number", -1))
                  if number in wanted:
                      found[number] = int(run["id"])
              page += 1

          for number in sorted(found, reverse=True):
              run_id = found[number]
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              try:
                  with request(url, method="DELETE") as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"#{number}: already absent")
                      continue
                  raise
              if status != 204:
                  raise SystemExit(f"#{number}: unexpected DELETE status {status}")
              print(f"Deleted Build Backroom run #{number} (id={run_id})")

          missing = sorted(wanted - set(found))
          if missing:
              print("Already absent/not found:", ", ".join(f"#{n}" for n in missing))
          print(f"Cleanup complete; matched {len(found)} target runs.")
          PY
