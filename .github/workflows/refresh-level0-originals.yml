name: Refresh Level 0 originals

on:
  push:
    branches:
      - codex/level0-original-quality

permissions:
  contents: write

jobs:
  refresh-level0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/level0-original-quality

      - name: Download exact Google Drive originals
        shell: bash
        run: |
          set -euo pipefail
          dest="android-apk/app/src/main/assets/level_snapshots"
          curl -fL --retry 5 --retry-all-errors "https://drive.usercontent.google.com/download?id=1Qfj34e8qI3GXjq1JUTc2snvBI_VAPqHy&export=download&confirm=t" -o "$dest/level_0_1.webp"
          curl -fL --retry 5 --retry-all-errors "https://drive.usercontent.google.com/download?id=1rSTQmjmUSkZpB7OcKcWmUL9wuavceYa5&export=download&confirm=t" -o "$dest/level_0_2.webp"
          curl -fL --retry 5 --retry-all-errors "https://drive.usercontent.google.com/download?id=1hivq_7vZzxwZy2zY2GnNEndjk5Y42Uys&export=download&confirm=t" -o "$dest/level_0_3.webp"
          curl -fL --retry 5 --retry-all-errors "https://drive.usercontent.google.com/download?id=1xJivxYBGmZ_AiFTfQbXb2cW9-T1pDpnt&export=download&confirm=t" -o "$dest/level_0_4.webp"
          cat > /tmp/level0.sha256 <<'EOF'
          619a3a035d6ba4e5c9fa8301e57e6b8d643272d52e4ff86105f8c3a517a84762  android-apk/app/src/main/assets/level_snapshots/level_0_1.webp
          34da3b0d0f1914be884cad5d388bbe8c263050e48f63c1656861558e9e5961fb  android-apk/app/src/main/assets/level_snapshots/level_0_2.webp
          7e8cfe0a09b30d932df5a37748c5be51517b51011f320e0835338ab0249e4696  android-apk/app/src/main/assets/level_snapshots/level_0_3.webp
          2b0dbbe6c8f70c5722b97578ebf98207f6ea81b9985afaed2c2f96818ce5cf87  android-apk/app/src/main/assets/level_snapshots/level_0_4.webp
          EOF
          sha256sum -c /tmp/level0.sha256
          python3 - <<'PY'
          from pathlib import Path
          for index in range(1, 5):
              path = Path(f"android-apk/app/src/main/assets/level_snapshots/level_0_{index}.webp")
              data = path.read_bytes()
              if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  raise SystemExit(f"Not a WebP container: {path}")
          PY

      - name: Make Level 0 raw originals authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path("android-apk/patch-level-snapshot-backgrounds.py")
          text = patch_path.read_text(encoding="utf-8")
          anchor = ")\n\n# Snapshot assets are optional visual data."
          if text.count(anchor) != 1:
              raise SystemExit(f"Unexpected snapshot constant anchor count: {text.count(anchor)}")
          originals = '''\n\n# Exact byte-for-byte Level 0 originals from the project's Google Drive.\n# Do not resize, crop, recompress, or re-encode these files. CI hard-locks both size and SHA-256.\nLEVEL0_ORIGINALS = (\n    ("level_0_1.webp", 217992, "619a3a035d6ba4e5c9fa8301e57e6b8d643272d52e4ff86105f8c3a517a84762"),\n    ("level_0_2.webp", 145638, "34da3b0d0f1914be884cad5d388bbe8c263050e48f63c1656861558e9e5961fb"),\n    ("level_0_3.webp", 268618, "7e8cfe0a09b30d932df5a37748c5be51517b51011f320e0835338ab0249e4696"),\n    ("level_0_4.webp", 212864, "2b0dbbe6c8f70c5722b97578ebf98207f6ea81b9985afaed2c2f96818ce5cf87"),\n)\n'''
          text = text.replace(anchor, ")" + originals + "\n# Snapshot assets are optional visual data.", 1)

          loop_anchor = "    refs: list[str] = []\n    for record in area.get(\"images\", []):"
          if text.count(loop_anchor) != 1:
              raise SystemExit(f"Unexpected snapshot loop anchor count: {text.count(loop_anchor)}")
          level0 = '''    if area_id == "0":\n        refs: list[str] = []\n        for name, expected_bytes, expected_sha in LEVEL0_ORIGINALS:\n            asset = SNAPSHOT_DIR / name\n            if not asset.is_file() or asset.stat().st_size != expected_bytes:\n                actual = asset.stat().st_size if asset.is_file() else 0\n                raise RuntimeError(\n                    f"Original Level 0 snapshot size mismatch: {asset} "\n                    f"expected={expected_bytes} actual={actual}"\n                )\n            data = asset.read_bytes()\n            if data[:4] != b"RIFF" or data[8:12] != b"WEBP":\n                raise RuntimeError(f"Original Level 0 snapshot is not a WebP container: {asset}")\n            actual_sha = hashlib.sha256(data).hexdigest()\n            if actual_sha != expected_sha:\n                raise RuntimeError(\n                    f"Original Level 0 snapshot checksum mismatch: {asset} "\n                    f"expected={expected_sha} actual={actual_sha}"\n                )\n            verified_assets += 1\n            refs.append(f"file:///android_asset/level_snapshots/{name}")\n        pools[area_id] = refs\n        continue\n\n    refs: list[str] = []\n    for record in area.get("images", []):'''
          text = text.replace(loop_anchor, level0, 1)
          patch_path.write_text(text, encoding="utf-8")

          chain_path = Path("android-apk/ci_apply_runtime_patches.py")
          chain = chain_path.read_text(encoding="utf-8")
          line = '    "patch-level0-snapshot-override.py",\n'
          if chain.count(line) != 1:
              raise SystemExit(f"Unexpected Level 0 override chain entry count: {chain.count(line)}")
          chain_path.write_text(chain.replace(line, "", 1), encoding="utf-8")

          sources_path = Path("android-apk/app/src/main/assets/level_snapshots/SOURCES.md")
          sources = sources_path.read_text(encoding="utf-8")
          old_one = "An explicit user-provided image may override an individual Snapshot slot. Such overrides must keep their original provenance in `fandom_manifest.json`, must be normalized to 512x288 WebP, and must pass the same packaged byte-count and SHA-256 checks as the default source pool. A user override does not expand the automatic source crawler to arbitrary sites."
          new_one = "An explicit user-provided image may override an individual Snapshot slot. When the user explicitly requires original quality, the override is stored byte-for-byte at its source resolution with no crop, resize, recompression, or re-encoding. Raw overrides must pass exact packaged byte-count and SHA-256 checks. A user override does not expand the automatic source crawler to arbitrary sites."
          old_two = "Every campaign Level, sublevel, and special area receives exactly four 512x288 WebP Snapshot backgrounds. The builder re-downloads imagery referenced by approved source pages and performs only crop, resize, and WebP encoding. It does not AI-generate environment imagery."
          new_two = "The default approved-source Snapshot pool uses four 512x288 WebP backgrounds per campaign Level, sublevel, and special area. Explicit raw overrides may retain their source dimensions when original quality is requested. The builder does not AI-generate approved-source environment imagery."
          if sources.count(old_one) != 1 or sources.count(old_two) != 1:
              raise SystemExit("Unexpected SOURCES.md override policy text")
          sources = sources.replace(old_one, new_one, 1).replace(old_two, new_two, 1)
          sources += "\n## Level 0 original-quality override\n\nLevel 0 uses `level_0_1.webp` through `level_0_4.webp` copied byte-for-byte from the project Google Drive folder `Backrooms Level`. All four are 1672x941 WebP originals. Their exact sizes and SHA-256 values are hard-locked in `patch-level-snapshot-backgrounds.py`. The former `area_00_0_trusted_01.webp` through `area_00_0_trusted_04.webp` assets are removed after replacement.\n"
          sources_path.write_text(sources, encoding="utf-8")
          PY

          git rm android-apk/patch-level0-snapshot-override.py
          git rm android-apk/app/src/main/assets/level_snapshots/area_00_0_trusted_01.webp
          git rm android-apk/app/src/main/assets/level_snapshots/area_00_0_trusted_02.webp
          git rm android-apk/app/src/main/assets/level_snapshots/area_00_0_trusted_03.webp
          git rm android-apk/app/src/main/assets/level_snapshots/area_00_0_trusted_04.webp
          git rm .github/workflows/refresh-level0-originals.yml

      - name: Verify snapshot patch offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android-apk/patch-level-snapshot-backgrounds.py android-apk/ci_apply_runtime_patches.py
          rm -rf /tmp/android-apk-level0-check
          cp -a android-apk /tmp/android-apk-level0-check
          python3 /tmp/android-apk-level0-check/patch-level-snapshot-backgrounds.py
          grep -q "level_0_1.webp" /tmp/android-apk-level0-check/app/src/main/java/com/rabpit/backroom/MainActivity.java
          ! grep -q "area_00_0_trusted_01.webp" /tmp/android-apk-level0-check/app/src/main/java/com/rabpit/backroom/MainActivity.java

      - name: Commit exact originals and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add android-apk/patch-level-snapshot-backgrounds.py \
                  android-apk/ci_apply_runtime_patches.py \
                  android-apk/app/src/main/assets/level_snapshots/SOURCES.md \
                  android-apk/app/src/main/assets/level_snapshots/level_0_1.webp \
                  android-apk/app/src/main/assets/level_snapshots/level_0_2.webp \
                  android-apk/app/src/main/assets/level_snapshots/level_0_3.webp \
                  android-apk/app/src/main/assets/level_snapshots/level_0_4.webp
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use original Level 0 snapshots"
          git push origin HEAD:codex/level0-original-quality
