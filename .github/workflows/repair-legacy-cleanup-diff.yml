name: Repair legacy cleanup diff

on:
  push:
    branches:
      - cleanup/remove-legacy-dinner-noclip

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-dinner-noclip
          fetch-depth: 0

      - name: Repair cleanup scope
        run: python android-apk/repair_legacy_cleanup_diff.py

      - name: Commit repaired diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Keep legacy cleanup diff minimal"
          git push origin HEAD:cleanup/remove-legacy-dinner-noclip
