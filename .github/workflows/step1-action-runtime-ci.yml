name: Step 1 Action Runtime CI

on:
  push:
    branches: [step1-action-runtime]
    paths:
      - "android-apk/app/src/main/java/com/rabpit/backroom/core/ActionRuntime.kt"
      - "android-apk/app/src/test/java/com/rabpit/backroom/core/ActionRuntimeTest.kt"
      - ".github/workflows/step1-action-runtime-ci.yml"

permissions:
  contents: write

concurrency:
  group: step1-action-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  action-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture active run id
        run: |
          set -euo pipefail
          mkdir -p ci-status
          printf 'status=RUNNING\nrun_id=%s\nsource_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-status/step1-action-runtime.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-status/step1-action-runtime.txt
          git commit -m "Record Step 1 CI run $GITHUB_RUN_ID"
          git push origin HEAD:step1-action-runtime

      - name: Apply Android runtime patch chain
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-drive-online-save-step1.py patch-online-only-save-step2.py patch-named-online-save-step3.py patch-overwrite-online-save-step4.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run ActionRuntime tests
        id: runtime_tests
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --tests 'com.rabpit.backroom.core.ActionRuntimeTest' --no-daemon

      - name: Record final Step 1 status
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.patch_chain.outcome }}" = "success" ] && [ "${{ steps.runtime_tests.outcome }}" = "success" ]; then
            status=GREEN
          else
            status=RED
          fi
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\npatch_chain=%s\nruntime_tests=%s\n' "$status" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.patch_chain.outcome }}" "${{ steps.runtime_tests.outcome }}" > ci-status/step1-action-runtime.txt
          git add ci-status/step1-action-runtime.txt
          git commit -m "Record Step 1 CI $status for run $GITHUB_RUN_ID"
          git push origin HEAD:step1-action-runtime

      - name: Enforce Step 1 green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.runtime_tests.outcome }}" = "success"
