name: Step 1 Action Runtime CI

on:
  push:
    branches: [step1-action-runtime]
    paths:
      - "android-apk/app/src/main/java/com/rabpit/backroom/core/ActionRuntime.kt"
      - "android-apk/app/src/test/java/com/rabpit/backroom/core/ActionRuntimeTest.kt"
      - ".github/workflows/step1-action-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: step1-action-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  action-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run ActionRuntime tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --tests 'com.rabpit.backroom.core.ActionRuntimeTest' --no-daemon
