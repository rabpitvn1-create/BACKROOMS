name: Import Red Flood Drive snapshot

on:
  push:
    branches: [fix/red-flood-drive-snapshot]
    paths:
      - ".github/workflows/import-red-flood-drive-snapshot.yml"

permissions:
  contents: write

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/red-flood-drive-snapshot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Import user-provided Red Flood snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import io
          import json
          import urllib.request

          FILE_ID = "1VK-sNfwVRPUqXTbxpJ9mOVCPUHYw077G"
          VIEW_URL = f"https://drive.google.com/file/d/{FILE_ID}/view?usp=drivesdk"
          DOWNLOAD_URL = f"https://drive.usercontent.google.com/download?id={FILE_ID}&export=download&confirm=t"
          ROOT = Path("android-apk/app/src/main/assets/level_snapshots")
          ASSET = ROOT / "area_24_2_2_trusted_01.webp"
          MANIFEST = ROOT / "fandom_manifest.json"

          request = urllib.request.Request(DOWNLOAD_URL, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              source_bytes = response.read()

          if len(source_bytes) < 100:
              raise RuntimeError(f"Drive download is unexpectedly small: {len(source_bytes)} bytes")

          source_sha = hashlib.sha256(source_bytes).hexdigest()
          with Image.open(io.BytesIO(source_bytes)) as source:
              source.load()
              source_width, source_height = source.size
              source_format = source.format
              image = source.convert("RGB")

          if source_format != "WEBP":
              raise RuntimeError(f"Expected Drive source WEBP, got {source_format}")
          if (source_width, source_height) != (1920, 1080):
              raise RuntimeError(f"Unexpected Drive source dimensions: {(source_width, source_height)}")

          image = image.resize((512, 288), Image.Resampling.LANCZOS)
          image.save(ASSET, "WEBP", quality=88, method=6)
          asset_bytes = ASSET.read_bytes()
          asset_sha = hashlib.sha256(asset_bytes).hexdigest()

          with Image.open(ASSET) as check:
              check.load()
              if check.format != "WEBP" or check.size != (512, 288):
                  raise RuntimeError(f"Invalid packaged snapshot: format={check.format} size={check.size}")

          manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
          area = manifest["areas"]["2.2"]
          if area.get("area_name") != "The Red Flood":
              raise RuntimeError(f"Unexpected area mapping for 2.2: {area.get('area_name')}")
          images = area.get("images", [])
          if len(images) != 4:
              raise RuntimeError(f"Expected four Red Flood snapshots, found {len(images)}")

          area["resolution"] = "user_override_plus_parent_fallback"
          images[0] = {
              "local_file": ASSET.name,
              "file_title": "User-provided Level_21.webp",
              "page_url": VIEW_URL,
              "description_url": VIEW_URL,
              "download_url": DOWNLOAD_URL,
              "source_site": "user_google_drive",
              "source_license": "User-provided asset",
              "source_sha256": source_sha,
              "source_width": source_width,
              "source_height": source_height,
              "derived_operation": "user-provided source; resize+webp encoding only",
              "mime": "image/webp",
              "width": 512,
              "height": 288,
              "bytes": len(asset_bytes),
              "sha256": asset_sha,
          }

          manifest["source"] = "Trusted Backrooms sources + explicit user overrides"
          manifest["selection"]["policy"] = (
              "Approved Backrooms source imagery plus explicit user-provided overrides; "
              "crop/resize/WebP encoding only."
          )
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          reloaded = json.loads(MANIFEST.read_text(encoding="utf-8"))
          record = reloaded["areas"]["2.2"]["images"][0]
          if record["bytes"] != ASSET.stat().st_size:
              raise RuntimeError("Manifest byte count does not match packaged Red Flood snapshot")
          if record["sha256"] != hashlib.sha256(ASSET.read_bytes()).hexdigest():
              raise RuntimeError("Manifest checksum does not match packaged Red Flood snapshot")

          print(
              "Imported Red Flood Drive snapshot: "
              f"source={source_width}x{source_height} {source_format} source_sha={source_sha} "
              f"asset=512x288 WEBP bytes={len(asset_bytes)} sha256={asset_sha}"
          )
          PY

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-apk/app/src/main/assets/level_snapshots/area_24_2_2_trusted_01.webp \
                  android-apk/app/src/main/assets/level_snapshots/fandom_manifest.json
          git diff --cached --check
          git commit -m "Replace Red Flood snapshot with Drive asset"
          git push origin HEAD:fix/red-flood-drive-snapshot
