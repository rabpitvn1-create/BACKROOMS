name: Release Backroom 1.1.64

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-backroom-1.1.64.yml"
  push:
    branches: [main, release/1.1.64]
    paths:
      - ".github/workflows/release-backroom-1.1.64.yml"

permissions:
  contents: write

concurrency:
  group: release-backroom-1.1.64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Stamp 1.1.64 package version
        run: |
          set -euo pipefail
          sed -i "s/versionCode 65/versionCode 66/" android-apk/app/build.gradle
          sed -i "s/versionName '1.1.63'/versionName '1.1.64'/" android-apk/app/build.gradle
          grep -q "versionCode 66" android-apk/app/build.gradle
          grep -q "versionName '1.1.64'" android-apk/app/build.gradle

      - name: Verify final runtime contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-apk')
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          chain = (root / 'patch-party-combat-tests-compat.py').read_text(encoding='utf-8')
          pov = (root / 'patch-kai-immersive-pov-final.py').read_text(encoding='utf-8')
          assert "versionCode 66" in gradle
          assert "versionName '1.1.64'" in gradle
          assert 'POV HARD LOCK: người chơi nhập vai trực tiếp Kai Akechi.' in java
          assert 'Mọi văn xuôi gameplay phải kể ở ngôi thứ hai giới hạn từ trải nghiệm của Kai' in java
          assert 'patch-kai-immersive-pov-final.py' in chain
          assert "gọi Kai là 'bạn'" in pov
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.64.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          APK=Backroom-1.1.64.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='66'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='1.1.64'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.64-debug-apk
          path: Backroom-1.1.64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.64
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Backroom 1.1.64 Debug

          - Chuyển toàn bộ văn xuôi gameplay sang góc nhìn nhập vai trực tiếp của Kai Akechi ở ngôi thứ hai giới hạn.
          - Game Master gọi Kai là “bạn”, chỉ kể những gì Kai trực tiếp thấy, nghe, cảm nhận hoặc có căn cứ biết.
          - Game Master không được tự viết suy nghĩ, lựa chọn, lời thoại hoặc hành động có chủ ý mới thay cho người chơi.
          - NPC và Entity vẫn được kể bình thường trong phạm vi nhận biết của Kai.
          - Giữ nguyên gameplay/state mechanics, combat, inventory, encounter rate và canon hiện có.
          EOF
          gh release create v1.1.64 Backroom-1.1.64.apk --target "$GITHUB_SHA" --title "Backroom 1.1.64 Debug" --notes-file release-notes.txt

      - name: Verify published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.64-verified.apk
          gh release download v1.1.64 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.64.apk' --output Backroom-1.1.64-verified.apk
          test -s Backroom-1.1.64-verified.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.64-verified.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.64-verified.apk | grep -q "versionCode='66'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.64-verified.apk | grep -q "versionName='1.1.64'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.64-verified.apk
