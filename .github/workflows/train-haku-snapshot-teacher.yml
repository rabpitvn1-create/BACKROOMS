name: HAKU Snapshot Vision Probe

on:
  push:
    branches:
      - ai/haku-snapshot-teacher-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haku-snapshot-vision-probe:
    runs-on: ubuntu-latest
    env:
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_API_URL: https://api.vilao.ai/v1/chat/completions
      HAKU_SNAPSHOT_MODEL: claude-haiku-4-5-20251001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Snapshot teacher code
        run: |
          python -m py_compile android-apk/ml/haku_snapshot_teacher.py android-apk/ml/test_haku_snapshot_teacher.py
          python android-apk/ml/test_haku_snapshot_teacher.py -v

      - name: Require HAKU credential
        run: |
          test -n "$HAKU_API_KEY" || (echo "Missing GitHub Secret: HAKU_API_KEY" && exit 1)

      - name: Probe HAKU image understanding
        run: |
          python android-apk/ml/haku_snapshot_teacher.py probe \
            --output snapshot_teacher/haku_snapshot_probe.json

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haku-snapshot-vision-probe
          path: snapshot_teacher/
          if-no-files-found: warn
          retention-days: 14
