name: HAKU Snapshot Teacher Bootstrap

on:
  push:
    branches:
      - ai/haku-snapshot-teacher-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haku-snapshot-teacher-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Use the requested CLAUDE_API_KEY with the project's OpenAI-compatible
      # Claude gateway. The exact provider-prefixed model is resolved from the
      # models available to this key instead of being hard-coded.
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      HAKU_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      HAKU_API_URL: https://api.vilao.ai/v1/chat/completions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Snapshot teacher code
        run: |
          python -m py_compile \
            android-apk/ml/haku_snapshot_teacher.py \
            android-apk/ml/haku_snapshot_candidate_teacher.py \
            android-apk/ml/train_snapshot_fixture_filter.py \
            android-apk/ml/test_haku_snapshot_teacher.py \
            android-apk/ml/test_haku_snapshot_candidate_teacher.py
          python android-apk/ml/test_haku_snapshot_teacher.py -v
          python android-apk/ml/test_haku_snapshot_candidate_teacher.py -v

      - name: Require Claude credential
        run: |
          test -n "$CLAUDE_API_KEY" || (echo "Missing GitHub Secret: CLAUDE_API_KEY" && exit 1)

      - name: Resolve subscribed Claude model
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["CLAUDE_API_KEY"].strip()
          request = urllib.request.Request(
              "https://api.vilao.ai/v1/models",
              headers={"Authorization": f"Bearer {key}"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")[:600]
              raise SystemExit(f"Claude model discovery failed: HTTP {error.code}: {detail}")
          except Exception as error:
              raise SystemExit(f"Claude model discovery failed: {error}")

          raw_models = payload.get("data", payload.get("models", [])) if isinstance(payload, dict) else payload
          if not isinstance(raw_models, list):
              raise SystemExit("Claude model discovery returned an unexpected payload")

          model_ids = []
          for item in raw_models:
              if isinstance(item, str):
                  model_id = item
              elif isinstance(item, dict):
                  model_id = item.get("id") or item.get("model") or item.get("name")
              else:
                  model_id = None
              if isinstance(model_id, str) and "claude" in model_id.lower():
                  model_ids.append(model_id)

          if not model_ids:
              raise SystemExit("CLAUDE_API_KEY has no subscribed Claude models")

          preferred_suffixes = (
              "claude-haiku-4-5-20251001",
              "claude-haiku-4-5",
              "claude-haiku-4.5",
              "claude-sonnet-4-6",
              "claude-sonnet-4-5-20250929",
              "claude-sonnet-4-5",
              "claude-opus-4-8",
          )

          def score(model_id):
              lower = model_id.lower()
              for index, suffix in enumerate(preferred_suffixes):
                  if lower == suffix or lower.endswith("/" + suffix):
                      return (0, index, len(model_id), lower)
              family = 0 if "haiku" in lower else 1 if "sonnet" in lower else 2 if "opus" in lower else 3
              return (1, family, len(model_id), lower)

          selected = min(model_ids, key=score)
          print(f"Resolved Claude model: {selected} ({len(model_ids)} Claude models visible to key)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"HAKU_SNAPSHOT_MODEL={selected}\n")
          PY

      - name: Validate Claude vision credential
        run: |
          python android-apk/ml/haku_snapshot_teacher.py probe \
            --output snapshot_teacher/haku_snapshot_probe.json

      - name: Install Snapshot image decoder
        run: |
          python -m pip install pillow==12.3.0

      - name: Fetch 28 rotation Snapshots
        run: |
          python android-apk/fetch-level-snapshots.py
          test "$(find android-apk/app/src/main/assets/level_snapshots/rotation -maxdepth 1 -type f | wc -l)" -eq 28

      - name: Label fallback and rotation candidates with Claude
        run: |
          python android-apk/ml/haku_snapshot_candidate_teacher.py \
            --glob 'android-apk/app/src/main/assets/level_snapshots/rotation/*' \
            --limit 35 \
            --passes 2 \
            --max-candidates 4 \
            --output snapshot_teacher/haku_snapshot_candidate_labels.jsonl

      - name: Install LiteRT training dependencies
        run: |
          python -m pip install -r android-apk/ml/requirements.txt

      - name: Train tiny Snapshot fixture filter
        run: |
          python android-apk/ml/train_snapshot_fixture_filter.py \
            --labels snapshot_teacher/haku_snapshot_candidate_labels.jsonl \
            --output snapshot_teacher/backroom_snapshot_filter_v0.tflite \
            --report snapshot_teacher/backroom_snapshot_filter_v0_report.json \
            --min-samples 60 \
            --min-per-class 18 \
            --min-images 16

      - name: Upload Snapshot teacher artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haku-snapshot-teacher-bootstrap
          path: snapshot_teacher/
          if-no-files-found: warn
          retention-days: 14
