name: Story Level 1 Finalizer

on:
  push:
    branches:
      - story/hourly-main-level-1-r01

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[story-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/hourly-main-level-1-r01
          fetch-depth: 0
      - name: Append Level 1 continuity exactly once
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('android-apk/app/src/main/assets/campaign_story/hourly-story-evolution.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          sequence = [str(x) for x in data.get('sequence', [])]
          completed = [str(x) for x in data.get('completedSteps', [])]
          expected = ['PROLOGUE','0','epsilon','0.01','0.1','0.11','0.22','0.23','0.41','0.5','0.66','0.7','0.8','0.99','LS-2','Dullness','Red Rooms','1']
          if sequence != expected:
              raise SystemExit('story sequence changed unexpectedly')
          if completed != expected[:-1] or data.get('nextStep') != '1':
              raise SystemExit(f'unexpected pre-final state: completed={completed!r} next={data.get("nextStep")!r}')
          if '1' in (data.get('steps') or {}):
              raise SystemExit('Level 1 step already exists unexpectedly')

          data['steps']['1'] = {
            'phase': 'LEVEL1_PARKING_ZONE_ENTRY',
            'storyUpdate': 'Khi và chỉ khi Core đã commit transition từ Red Rooms sang area 1, chuỗi dấu chuyển vùng mới được khóa thành Level 1 / Parking Zone: giấy vàng và motif Level 0 đã nhường chỗ đủ ổn định cho bê tông, cột chịu lực, vạch sơn, đường dốc, cầu thang, đèn treo và không gian gara. Kai không coi việc tới Level 1 là lời giải cho Backrooms hay nhiệm vụ Async; hắn xác nhận môi trường mới bằng nhiều cue độc lập, kiểm lại liên lạc và tiếp tục giữ vị trí Iris/Syvial ở UNKNOWN nếu state chưa surface dữ kiện mới. Nhiệt độ cao, sương lạnh cục bộ, xe hiếm và hệ điện của Parking Zone chỉ được mô tả khi đúng state/canon; một chiếc xe, ổ cắm hoặc vùng sáng không tự là tài nguyên hay nơi an toàn. Nếu Lucia đang ở party sau identity/join gate, cô đi qua transition như một companion đã được Core xác nhận, không phải thành viên SRU tự động; cô giữ phán đoán riêng, giới hạn con người và kỷ luật quan sát đã hình thành qua Level 0. Việc rời Level 0 khép một chặng sinh tồn, không reset nhiệm vụ, thương tích, tài nguyên hoặc quan hệ đã tích lũy.',
            'survivalFocus': 'Level 1 đổi loại áp lực chứ không xóa hao mòn: đói, khát, thiếu ngủ, mệt, thương tích, nhiễm bẩn, ẩm/lạnh còn dư và tài nguyên hữu hạn chỉ thay đổi nếu Core/state đã thay đổi. Parking Zone có nhiệt cao, bê tông rộng, cầu thang, đường dốc, thép gỉ/cốt thép lộ và sương lạnh cục bộ; blackout có thể kéo dài và khi xảy ra làm âm thanh truyền xa hơn, tăng nguy cơ tách nhóm và khiến nguồn sáng di động vừa hữu ích vừa dễ lộ vị trí. Kai giữ đầy đủ năng lực, cảm biến, SRU-MK20 và kỹ năng đã khóa để giảm sai số, nhưng không được bịa climate-control, nguồn điện an toàn, bản đồ tuyệt đối hay khả năng khiến blackout vô hại. Lucia vẫn là con người được huấn luyện tốt; nếu state đã tích hao mòn, nhịp di chuyển, thao tác súng, nghỉ, nước và vệ sinh phải phản ánh thực tế. Cả hai ưu tiên tuyến có đường rút, kiểm nguồn điện trước khi dùng và không coi không gian rộng hơn là an toàn mặc định.',
            'npcPolicy': 'Không sinh survivor/NPC để chào đón nhóm ở Level 1, giải thích Parking Zone, cấp nơi trú, xác nhận nguồn điện, chỉ supply crate hoặc tiết lộ Iris/Syvial/Async. Chỉ khi Core/RNG commit encounter mới được đưa người đó vào văn xuôi; họ phải có nhu cầu sinh tồn cụ thể như nước, nơi nghỉ, tránh blackout, tìm tuyến ít nguy hiểm hoặc bảo vệ người đi cùng, và tri thức chỉ có giá trị cục bộ theo trải nghiệm. Lời kể về Maintenance Halls, Luxury Lots, Entity, lối sang Level 2 hay vị trí đồng đội SRU không tự trở thành sự thật đã kiểm chứng. Lucia không phải procedural NPC và tiếp tục chỉ ở party nếu state đã xác nhận join hợp lệ.',
            'itemPolicy': 'Không thưởng tự động supply crate, Almond Water, thức ăn, thuốc, đạn, pin, dụng cụ, phương tiện hoặc điện chỉ vì đã tới Level 1. Xe trong Parking Zone hiếm và phần lớn không hoạt động; không kể một xe chạy được nếu Core/state chưa xác nhận. Maintenance Halls có hạ tầng kỹ thuật và Luxury Lots có thể có nguồn điện hoặc crate thường hơn khu chính, nhưng mọi vật phẩm mới vẫn phải qua Core/world-loot/inventory, còn điện áp phải được đo trước khi tin cậy. Vật thể môi trường như cột, vạch sơn, dây, hộp điện, xe và cửa chỉ là dữ kiện/địa hình cho tới khi hệ thống xác nhận tương tác hoặc loot. Không reset đạn, nước, pin, contamination hay độ bền trang bị khi đổi Level.',
            'relationshipStage': 'LEVEL1_SHARED_RELIANCE_WITHOUT_FORCED_PAYOFF. Chỉ áp dụng nếu Lucia đang thực sự đồng hành sau identity/join gate. Qua trọn chuỗi Level 0, Kai đã có đủ mẫu hành vi để xem khả năng Lucia dành cho mình tình cảm riêng là đáng kể; sang Level 1 hắn không cần giả vờ mù dấu hiệu, nhưng vẫn không đọc ý nghĩ, ép cô xác nhận hay biến transition thành thời điểm tỏ tình bắt buộc. Lucia có thể tiếp tục ưu tiên kiểm tình trạng, đường rút hoặc vị trí của Kai vì cả kỷ luật sống sót lẫn sự quan tâm đã tích lũy, trong khi vẫn có mục tiêu, giới hạn và quyết định riêng. Kai đáp lại bằng sự tin cậy và chú ý thực tế, không sở hữu, không bảo bọc quá mức và không biến chênh lệch sức mạnh thành quyền quyết định hộ cô. Không ghen, không thử lòng, không therapist hóa, không dùng việc vừa thoát Level 0 làm công tắc intimacy; xưng hô Lucia-Kai vẫn OPEN.',
            'endingState': 'Level 1 / Parking Zone được khóa là bước cuối của sequence continuity này chỉ sau Core transition hợp lệ. OBJ_08_REACH_LEVEL_ONE thuộc quest engine và chỉ Core được quyền hoàn tất; story ledger không tự cộng tiến độ. Nhiệm vụ điều tra Async vẫn ACTIVE, vị trí Iris/Syvial vẫn UNKNOWN trừ khi state surface dữ kiện mới, Lucia không tự trở thành SRU và không có survivor, Entity, loot hay discovery mới nếu Core/RNG/world state chưa commit. Mọi hao mòn và tài nguyên tiếp tục từ state thật. Tiến trình tương lai trong Level 1 và transition sang Level 2 thuộc campaign/Core hiện hành, không được bước này viết trước. Hourly continuity sequence PROLOGUE→1 hoàn tất tại đây.'
          }
          data['completedSteps'] = expected
          data['nextStep'] = 'COMPLETE'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot finalizer from final tree
        run: git rm .github/workflows/story-finalize-level1.yml
      - name: Commit finalized ledger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/campaign_story/hourly-story-evolution.json
          git commit -m 'Hourly story: enter Level 1 [story-finalized]'
          git push origin HEAD:story/hourly-main-level-1-r01
