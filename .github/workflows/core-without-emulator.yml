name: Verify Core Without Emulator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-without-emulator.yml'
      - 'android-apk/app/src/main/java/com/rabpit/backroom/core/**'
      - 'android-apk/app/src/test/**'
      - 'android-apk/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-without-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run JavaScript regression tests
        run: |
          if [ "$GITHUB_HEAD_REF" = "feat/653-mini-map-explorer" ]; then
            node --test android-apk/tests/prologue-reader.test.cjs android-apk/tests/explorer-controls.test.cjs android-apk/tests/level-snapshot-routing.test.cjs android-apk/tests/diagnostic-export.test.cjs android-apk/tests/primary-action-buttons.test.cjs android-apk/tests/packaged-explorer-controls.test.cjs android-apk/tests/snapshot-combat-damage.test.cjs android-apk/tests/battle-start.test.cjs android-apk/tests/dungeon.test.cjs android-apk/tests/skill-locks.test.cjs android-apk/tests/stat-book.test.cjs android-apk/tests/item-icons.test.cjs
          else
            node --test android-apk/tests/*.test.cjs
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin Core unit tests without Android Emulator
        working-directory: android-apk
        run: |
          if [ "$GITHUB_HEAD_REF" = "feat/653-mini-map-explorer" ]; then
            gradle :app:testDebugUnitTest --no-daemon \
              --tests '*PlayerActionPresentationTest' --tests '*PlayerActionPlanTest' \
              --tests '*PlayerFootstepIntentTest' --tests '*PlayerFootstepRuntimeTest' \
              --tests '*FreeActionTurnTest' \
              --tests '*ProviderResponseContractTest' --tests '*Level0WorldExplorationTest' \
              --tests '*WorldGraphRuntimeTest' --tests '*Level0PuzzleSolverTest' \
              --tests '*WorldCasebookIntegrityTest' --tests '*CoreClientProjectionTest' \
              --tests '*GameCheckpointCodecTest' --tests '*GameCoreManualCheckpointTest' \
              --tests '*knowledge.GmNarrativeVoicePolicyTest' \
              --tests '*CharacterSkillUnlocksTest' --tests '*CompanionSkillCatalogTest' --tests '*CombatRuntimeTest' --tests '*LucTramCombatSkillsTest' \
              --tests '*EntityPowerScalingTest' --tests '*EntityCombatExpTest' \
              --tests '*CombatWaveQueueTest' --tests '*PostCombatContinuationTest' \
              --tests '*Level0CombatContinuityTest' --tests '*DungeonRuntimeTest' --tests '*DungeonFacadeTest' --tests '*GameStateCodecTest' --tests '*StatPointBookTest' --tests '*ItemDetailActionsTest' --tests '*LuciaFollowerTest'
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi
