# Backroom 1.1.45 release verification trigger
name: Train LiteRT Intent Classifier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-apk/ml/**"
      - "android-apk/app/src/main/java/com/rabpit/backroom/core/**"
      - "android-apk/app/src/test/java/com/rabpit/backroom/core/**"
      - "android-apk/app/src/main/assets/models/**"
      - "android-apk/app/build.gradle"
      - "android-apk/build.gradle"
      - ".github/workflows/train-litert-intent.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android-apk/ml/**"
      - "android-apk/app/src/main/java/com/rabpit/backroom/core/**"
      - "android-apk/app/src/test/java/com/rabpit/backroom/core/**"
      - "android-apk/app/src/main/assets/models/**"
      - "android-apk/app/build.gradle"
      - "android-apk/build.gradle"
      - ".github/workflows/train-litert-intent.yml"

permissions:
  contents: read

concurrency:
  group: litert-intent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Install ML toolchain
        run: python -m pip install --requirement android-apk/ml/requirements.txt

      - name: Rebuild reviewed dataset
        run: python android-apk/ml/build_intent_dataset.py

      - name: Gate dataset and feature quality
        run: python android-apk/ml/evaluate_seed_classifier.py

      - name: Train, quantize and validate exported LiteRT model
        working-directory: android-apk/ml
        run: >-
          python train_intent_classifier.py
          --dataset intent_dataset.csv
          --labels ../app/src/main/assets/models/backroom_intent_labels.txt
          --output ../app/src/main/assets/models/backroom_intent.tflite
          --report intent_model_report.json

      - name: Enforce APK model footprint
        run: |
          test -s android-apk/app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s android-apk/app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Apply exact Android release patch chain before core tests
        run: |
          python3 android-apk/patch-provider-status.py
          python3 android-apk/patch-luna-text.py
          python3 android-apk/patch-level-snapshot-backgrounds.py
          python3 android-apk/patch-snapshot-fallback.py
          python3 android-apk/patch-kai-hd-continuous.py
          python3 android-apk/patch-kai-png-preferred.py
          python3 android-apk/patch-kai-codex.py
          python3 android-apk/patch-r06-source-marker.py
          python3 android-apk/patch-drive-canon-gameplay.py
          python3 android-apk/patch-inventory-persistence.py
          python3 android-apk/patch-ai-orchestrator.py
          python3 android-apk/patch-state-op-hardening.py
          python3 android-apk/patch-gemini-health-pool.py
          python3 android-apk/patch-conditional-audit.py
          python3 android-apk/patch-audit-validated-risk.py
          python3 android-apk/patch-gameplay-parity-final.py
          python3 android-apk/patch-final-authority-hardening.py
          python3 android-apk/patch-rejected-op-repair-final.py
          python3 android-apk/patch-kai-resource-policy-final.py
          python3 android-apk/patch-provider-deadline-final.py
          python3 android-apk/patch-gemini-model-matrix-final.py
          python3 android-apk/patch-java-compile-hardening.py
          python3 android-apk/patch-save-controls-final.py
          python3 android-apk/patch-hard-mode-label.py
          python3 android-apk/patch-snapshot-unconfigured.py
          python3 android-apk/patch-game-state-core-bridge.py
          python3 android-apk/patch-character-inventory-ui.py
          python3 android-apk/patch-character-detail-avatar-fallback.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Kotlin core and run unit tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload verified model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: backroom-litert-intent-${{ github.sha }}
          path: |
            android-apk/app/src/main/assets/models/backroom_intent.tflite
            android-apk/ml/intent_model_report.json
            android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
