name: Emulator - One Checkpoint Then Repeat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable Linux hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run one full Checkpoint on Android Emulator API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd android-apk && gradle :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.rabpit.backroom.core.FirstSixCheckpointsEmulatorTest#firstCheckpointWithLuciaAndMixedEntityCombats' --no-daemon

      - name: Publish instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-checkpoint-emulator-report
          path: |
            android-apk/app/build/reports/androidTests/connected/
            android-apk/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  repeat-checkpoint:
    needs: first-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable Linux hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Repeat one full Checkpoint with Iris and different Entity order
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd android-apk && gradle :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.rabpit.backroom.core.FirstSixCheckpointsEmulatorTest#repeatCheckpointWithIrisAndDifferentStoryArc' --no-daemon

      - name: Publish instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeat-checkpoint-emulator-report
          path: |
            android-apk/app/build/reports/androidTests/connected/
            android-apk/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
