name: Release Version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/release-version.yml'
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'android-apk/**'
      - '.github/workflows/release-version.yml'

permissions:
  contents: write

concurrency:
  group: build-backroom-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Audit canon sources
        run: |
          python3 -m unittest discover -s android-apk/tools/tests -p 'test_canon_audit.py'
          python3 android-apk/tools/canon_audit.py

      - name: Apply patch profile
        run: |
          set -euo pipefail
          python3 android-apk/tools/patchctl.py validate
          python3 android-apk/tools/patchctl.py apply full
          cat android-apk/build/generated/patch-report.json

      - name: Install Pretendard Std UI font
        run: |
          set -euo pipefail
          FONT_DIR='android-apk/app/src/main/assets/fonts'
          PRETENDARD_COMMIT='7aeb0698819be2b4097dae8ec8fe6a795e5cf3ae'
          mkdir -p "$FONT_DIR"

          fetch_asset() {
            local source_path="$1"
            local output_path="$2"
            local expected_blob="$3"
            if [ ! -s "$output_path" ] || [ "$(git hash-object "$output_path" 2>/dev/null || true)" != "$expected_blob" ]; then
              curl --fail --location --retry 3 --retry-delay 1 \
                "https://raw.githubusercontent.com/orioncactus/pretendard/$PRETENDARD_COMMIT/$source_path" \
                --output "$output_path"
            fi
            test "$(git hash-object "$output_path")" = "$expected_blob"
          }

          fetch_asset 'packages/pretendard-std/dist/web/static/woff2/PretendardStd-Regular.woff2' \
            "$FONT_DIR/PretendardStd-Regular.woff2" '531b0a139eb067f5e2349482f123b386986ba7e1'
          fetch_asset 'packages/pretendard-std/dist/web/static/woff2/PretendardStd-Bold.woff2' \
            "$FONT_DIR/PretendardStd-Bold.woff2" '806634ebc8048e18eba84ae0b1fd1b4c09fb7fc1'
          fetch_asset 'packages/pretendard-std/dist/web/static/woff2/PretendardStd-ExtraBold.woff2' \
            "$FONT_DIR/PretendardStd-ExtraBold.woff2" 'e6dd8487bbde0df0128fe5f421e2e382505b8f92'
          fetch_asset 'LICENSE' "$FONT_DIR/OFL-Pretendard.txt" '160421b6039671e5c85e1646bee4167844a5d69c'

      - name: Commit Pretendard Std UI font
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-apk/app/src/main/assets/fonts/PretendardStd-Regular.woff2 \
            android-apk/app/src/main/assets/fonts/PretendardStd-Bold.woff2 \
            android-apk/app/src/main/assets/fonts/PretendardStd-ExtraBold.woff2 \
            android-apk/app/src/main/assets/fonts/OFL-Pretendard.txt
          if git diff --cached --quiet; then
            echo 'Pretendard Std assets already pinned.'
          else
            git commit -m 'Bundle Pretendard Std UI font'
            git push origin HEAD:main
          fi

      - name: Verify GM-driven baseline
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 117' android-apk/app/build.gradle
          grep -Fq "versionName '1.1.73'" android-apk/app/build.gradle
          test -s android-apk/RELEASE_NOTES_1.1.73.txt

          test -s android-apk/app/src/main/assets/fonts/PretendardStd-Regular.woff2
          test -s android-apk/app/src/main/assets/fonts/PretendardStd-Bold.woff2
          test -s android-apk/app/src/main/assets/fonts/PretendardStd-ExtraBold.woff2
          test -s android-apk/app/src/main/assets/fonts/OFL-Pretendard.txt
          test "$(git hash-object android-apk/app/src/main/assets/fonts/PretendardStd-Regular.woff2)" = '531b0a139eb067f5e2349482f123b386986ba7e1'
          test "$(git hash-object android-apk/app/src/main/assets/fonts/PretendardStd-Bold.woff2)" = '806634ebc8048e18eba84ae0b1fd1b4c09fb7fc1'
          test "$(git hash-object android-apk/app/src/main/assets/fonts/PretendardStd-ExtraBold.woff2)" = 'e6dd8487bbde0df0128fe5f421e2e382505b8f92'
          test "$(git hash-object android-apk/app/src/main/assets/fonts/OFL-Pretendard.txt)" = '160421b6039671e5c85e1646bee4167844a5d69c'
          grep -Fq "font:15px 'Pretendard Std'" android-apk/app/src/main/assets/index.html
          grep -Fq "font-family:'Play','Pretendard Std'" android-apk/app/src/main/assets/index.html

          test -z "$(find android-apk/app/src -type f -name '*.kt' -print -quit)"
          ! grep -R -n -E 'org\.jetbrains\.kotlin|LiteRTIntentInterpreter|com\.google\.ai\.edge\.litert' android-apk --include='*.gradle' --include='*.java'

          test ! -e android-apk/app/src/main/java/com/rabpit/backroom/core/StoryCore.java
          test ! -e android-apk/app/src/main/java/com/rabpit/backroom/core/StoryRepository.java
          test ! -e android-apk/app/src/main/java/com/rabpit/backroom/core/EnvironmentActionPacket.java
          test ! -d android-apk/app/src/main/assets/story
          ! grep -R -Fq 'state.story' android-apk/app/src/main/assets
          ! grep -R -Fq 'submitEnvironmentAction' android-apk/app/src/main android-apk/app/src/test

          grep -Fq 'GmNarrativePacket.build' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java
          grep -Fq 'Android.submitTurn(JSON.stringify(state), text)' android-apk/app/src/main/assets/player-action-ui.js
          grep -Fq 'function submitExplorerChoice(entry, choice)' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'form.requestSubmit()' android-apk/app/src/main/assets/gm-choice-ui.js
          grep -Fq 'CURRENT_SAVE_VERSION = 14' android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.java

          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/LevelCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterEncounterCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CharacterProgressionCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/SurvivalCore.java

          node --check android-apk/app/src/main/assets/gm-choice-ui.js
          node --check android-apk/app/src/main/assets/player-action-ui.js
          node --check android-apk/app/src/main/assets/snapshot-ui.js
          node --check android-apk/app/src/main/assets/party-ui.js
          node --check android-apk/app/src/main/assets/prologue.js
          node --test android-apk/tests/sol-provider.test.cjs android-apk/tests/font-contract.test.cjs android-apk/tests/gm-choice-ui.test.cjs android-apk/tests/manual-save-prefetch.test.cjs android-apk/tests/ma-ton-ui.test.cjs android-apk/tests/player-action-gm-contract.test.cjs android-apk/tests/prologue-contract.test.cjs android-apk/tests/viewport-layout.test.cjs

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in SOL_API_KEY GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 HAKU_API_KEY; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          echo "Optional Haku base/model overrides: ${HAKU_BASE_URL:+configured} ${HAKU_MODEL:+configured}"

      - name: Smoke test Gemini 3.8 Flash
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          grep -Fq 'private static final String GEMINI_MODEL = "gemini-3.8-flash";' android-apk/app/src/main/java/com/rabpit/backroom/MainActivity.java

          REQUEST_BODY=$(jq -nc '{
            contents: [{
              role: "user",
              parts: [{text: "Return exactly this JSON object: {\"ok\":true}"}]
            }],
            generationConfig: {
              responseMimeType: "application/json",
              thinkingConfig: {thinkingLevel: "low"}
            }
          }')

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          success=0
          configured=0
          hard_failure=0

          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            key="${!name:-}"
            [ -n "$key" ] || continue
            configured=1

            http_code=$(curl --silent --show-error \
              --connect-timeout 10 --max-time 45 \
              -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $key" \
              -X POST \
              -d "$REQUEST_BODY" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" || true)

            if [ "$http_code" = "200" ]; then
              if jq -e '(.candidates[0].content.parts[0].text | fromjson | .ok) == true' "$RESPONSE_FILE" >/dev/null 2>&1; then
                echo "Gemini smoke test passed with $name."
                success=1
                break
              fi
              echo "::error::Gemini returned HTTP 200 but failed the expected JSON contract with $name."
              hard_failure=1
              break
            fi

            case "$http_code" in
              429|500|502|503|504|000|"")
                echo "::warning::Gemini transient failure with $name (HTTP ${http_code:-curl_error}); trying next configured key."
                ;;
              *)
                echo "::error::Gemini smoke test failed with non-transient HTTP $http_code using $name."
                hard_failure=1
                break
                ;;
            esac
            sleep 1
          done

          test "$configured" -eq 1 || { echo "::error::No Gemini API key is configured."; exit 1; }
          test "$hard_failure" -eq 0 || exit 1

          if [ "$success" -ne 1 ]; then
            echo "::warning::All configured Gemini keys returned transient provider errors; continuing release without treating an upstream outage as a code failure."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test snapshot overlay geometry
        run: |
          java android-apk/tools/GenerateOverlayMetrics.java --check

      - name: Run Java tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Run PR #425 emulator gameplay audit
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 425
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emu-audit.sh

      - name: Upload PR #425 emulator audit
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 425
        uses: actions/upload-artifact@v4
        with:
          name: pr-425-emulator-audit
          path: emu-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.73.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          test -s Backroom-1.1.73.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.73.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging Backroom-1.1.73.apk)
          printf '%s\n' "$BADGING"
          grep -Fq "package: name='com.rabpit.backroom'" <<<"$BADGING"
          grep -Fq "versionCode='117'" <<<"$BADGING"
          grep -Fq "versionName='1.1.73'" <<<"$BADGING"
          grep -Fq "launchable-activity: name='com.rabpit.backroom.MainActivity'" <<<"$BADGING"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.73.apk
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/prologue.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/snapshot-ui.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/gm-choice-ui.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/Play-Regular.ttf'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/inventory-ui.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/party-ui.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/player-action-ui.js'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/dice/die-1.svg'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/dice/die-6.svg'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/avatars/cao_minh_avatar.jpg'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/cao_minh_snapshot_overlay.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/cao_minh_entity_overlay.png'
          test "$(unzip -p Backroom-1.1.73.apk assets/avatars/cao_minh_avatar.jpg | sha256sum | awk '{print $1}')" = 'bddf46b160f690dcfe300d7ac603a2663ceb47fe2042424d8fe571b064f9fb67'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/avatars/kai_avatar.jpg'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/avatars/kai_avatar.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/avatars/luctram_avatar.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/avatars/lucia_avatar.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/luctram_overlay.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/lucia_overlay.png'
          cmp <(unzip -p Backroom-1.1.73.apk assets/avatars/luctram_avatar.png) android-apk/app/src/main/assets/avatars/luctram_avatar.png
          cmp <(unzip -p Backroom-1.1.73.apk assets/avatars/lucia_avatar.png) android-apk/app/src/main/assets/avatars/lucia_avatar.png
          test "$(unzip -p Backroom-1.1.73.apk assets/avatars/lucia_avatar.png | sha256sum | awk '{print $1}')" = '935b40cfc59d77c688f21901328992e2398b7457a50a1ccf6a5b54bc7ca91b4d'
          cmp <(unzip -p Backroom-1.1.73.apk assets/luctram_overlay.png) android-apk/app/src/main/assets/luctram_overlay.png
          cmp <(unzip -p Backroom-1.1.73.apk assets/lucia_overlay.png) android-apk/app/src/main/assets/lucia_overlay.png
          test "$(unzip -p Backroom-1.1.73.apk assets/lucia_overlay.png | sha256sum | awk '{print $1}')" = '66ae60dcd2a08eb644ccc67b953e0b7de62c4c28ddfd24c26cea143db1d3961b'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/chest_overlay.png'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/status/status_'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/Play-Bold.ttf'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/OFL-Play.txt'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/PretendardStd-Regular.woff2'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/PretendardStd-Bold.woff2'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/PretendardStd-ExtraBold.woff2'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/fonts/OFL-Pretendard.txt'
          cmp <(unzip -p Backroom-1.1.73.apk assets/fonts/PretendardStd-Regular.woff2) android-apk/app/src/main/assets/fonts/PretendardStd-Regular.woff2
          cmp <(unzip -p Backroom-1.1.73.apk assets/fonts/PretendardStd-Bold.woff2) android-apk/app/src/main/assets/fonts/PretendardStd-Bold.woff2
          cmp <(unzip -p Backroom-1.1.73.apk assets/fonts/PretendardStd-ExtraBold.woff2) android-apk/app/src/main/assets/fonts/PretendardStd-ExtraBold.woff2
          cmp <(unzip -p Backroom-1.1.73.apk assets/fonts/OFL-Pretendard.txt) android-apk/app/src/main/assets/fonts/OFL-Pretendard.txt
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/hud/snapshot_frame.png'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/hud/action_plate.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/hound.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/slenderman.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/diep_minh.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/async_rifleman.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/copx.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/tam_ma_cao_minh.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -E -q 'assets/entity/.*\.png$'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/async_vanguard.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/async_tactical.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/async_decon.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/Anysc.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/hazmat_pistol_tactical_03.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/hazmat_pistol_tank_04.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/hazmat_rifle_ASNC_02.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/entity/hazmat_rifle_A_01.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/kai_snapshot_overlay.png'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/kai_snapshot_overlay.webp'
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/kai_entity_overlay.png'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/knowledge/knowledge_db.json'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/knowledge/entity_encounters.json'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/level_snapshots/drive/manifest.json'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/level_snapshots/drive/level_0/01.webp'
          unzip -l Backroom-1.1.73.apk | grep -q 'assets/level_snapshots/drive/level_6/03.webp'
          test "$(unzip -l Backroom-1.1.73.apk | grep -c 'assets/level_snapshots/drive/level_')" -eq 26
          ! unzip -l Backroom-1.1.73.apk | grep -q 'assets/level_snapshots/wiki/'
          ! unzip -l Backroom-1.1.73.apk | grep -E -q 'assets/level_snapshots/level_[0-6]\.webp'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.73-debug-apk
          path: Backroom-1.1.73.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release 1.1.73
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='BR-1.1.73'
          TITLE='Backroom 1.1.73'
          NOTES=$(cat android-apk/RELEASE_NOTES_1.1.73.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" Backroom-1.1.73.apk --clobber
          else
            gh release create "$TAG" Backroom-1.1.73.apk --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Verify published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download BR-1.1.73 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.73.apk' --output Backroom-1.1.73-verified.apk
          test -s Backroom-1.1.73-verified.apk
          cmp Backroom-1.1.73.apk Backroom-1.1.73-verified.apk
          sha256sum Backroom-1.1.73-verified.apk
