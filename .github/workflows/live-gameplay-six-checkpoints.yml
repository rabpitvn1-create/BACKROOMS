name: Live Gameplay - First Two Checkpoints

# Temporary single-run trigger; restore manual-only after the PR run starts.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/app/src/androidTest/java/com/rabpit/backroom/core/LiveSixCheckpointsGameplayTest.kt"

permissions:
  contents: read

jobs:
  live-six-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 235
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require real SOL and GM credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in GEHIHI_API_KEY GEHIHI_MODEL SOL_API_KEY; do
            test -n "${!key:-}" || { echo "Missing required provider configuration: $key"; exit 1; }
          done

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Play CP-L00-01 and CP-L00-02 using SOL and Gehihi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd android-apk && bash -c 'gradle :app:connectedDebugAndroidTest -PbackroomTwoProviderTest=true -Pandroid.testInstrumentationRunnerArguments.class=com.rabpit.backroom.core.LiveSixCheckpointsGameplayTest --no-daemon; result=$?; adb logcat -d -s BackroomLiveSixCP:I > app/build/live-six-cp-log.txt; cat app/build/live-six-cp-log.txt; exit $result'

      - name: Save first two Checkpoints emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-two-checkpoints-emulator-reports
          path: |
            android-apk/app/build/reports/androidTests/connected/
            android-apk/app/build/outputs/androidTest-results/connected/
            android-apk/app/build/live-six-cp-log.txt
          if-no-files-found: warn
