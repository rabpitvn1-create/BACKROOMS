name: PR Android targeted unit tests

on:
  pull_request:
    paths:
      - "android-apk/app/src/main/**"
      - "android-apk/app/src/test/**"
      - "android-apk/app/build.gradle"
      - "android-apk/patch-level-travel.py"
      - "android-apk/tests/level-travel-ui.test.cjs"
      - ".github/workflows/android-targeted-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Multiple pushes to the PR should not waste runners compiling superseded HEADs.
concurrency:
  group: targeted-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate CR2 wiring patch syntax and idempotence
        run: |
          python3 -m py_compile android-apk/patch-canon-runtime-2.py
          python3 android-apk/patch-canon-runtime-2.py
      - name: Validate named follower wiring and local visuals
        run: |
          python3 -m py_compile android-apk/patch-nam-lan-followers.py
          python3 android-apk/patch-nam-lan-followers.py
          node --test android-apk/tests/lucia-visuals.test.cjs android-apk/tests/named-follower-visuals.test.cjs android-apk/tests/party-combat-choice.test.cjs
      - name: Verify final Level travel authority and UI lifecycle
        run: |
          python3 -m py_compile android-apk/patch-level-travel.py
          python3 android-apk/patch-level-travel.py
          git diff --exit-code -- android-apk/app/src/main
          node android-apk/tests/level-travel-ui.test.cjs
          node --test android-apk/tests/snapshot-hud-regression.test.cjs
      - name: Verify diagnostic log export and redaction
        run: node --test android-apk/tests/diagnostic-export.test.cjs
      - name: Compile application and execute full Android unit regression suite
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Package debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify restored runtime inside packaged APK
        run: python3 android-apk/tests/verify-restored-apk.py android-apk/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-pr-debug-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
