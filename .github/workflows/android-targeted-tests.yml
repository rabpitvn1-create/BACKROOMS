name: PR Android targeted unit tests

on:
  pull_request:
    paths:
      - "android-apk/app/src/main/**"
      - "android-apk/app/src/test/**"
      - "android-apk/app/build.gradle"
      - ".github/workflows/android-targeted-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Multiple pushes to the PR should not waste runners compiling superseded HEADs.
concurrency:
  group: targeted-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile application and test sources; run targeted regression tests
        working-directory: android-apk
        run: |
          gradle :app:testDebugUnitTest --no-daemon \
            --tests com.rabpit.backroom.core.CombatFeedback1193aTest \
            --tests com.rabpit.backroom.core.CharacterStatusEquipmentSystemTest \
            --tests com.rabpit.backroom.core.CharacterStats1193aRegressionTest \
            --tests com.rabpit.backroom.core.InventoryCapacityNewGameTest \
            --tests com.rabpit.backroom.core.InventoryPolicyTest \
            --tests com.rabpit.backroom.core.ItemDetailActionsTest \
            --tests com.rabpit.backroom.core.RuleIntentInterpreterTest
