name: Preflight Snapshot Rotation

on:
  pull_request:
    branches:
      - main
    paths:
      - "android-apk/fetch-level-snapshots.py"
      - "android-apk/snapshot_sources.json"
      - "android-apk/sublevel_snapshot_sources.json"
      - "android-apk/sublevels_0_1.json"
      - "android-apk/patch-sublevels-0-1.py"
      - "android-apk/patch-level-snapshot-backgrounds.py"
      - "android-apk/patch-level-transition-sync.py"
      - "android-apk/patch-character-detail-avatar-fallback.py"
      - "android-apk/app/src/main/assets/level_snapshots/**"
      - ".github/workflows/preflight-snapshot-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source manifests and fetch parent plus sub-level images
        run: |
          python3 -m py_compile \
            android-apk/fetch-level-snapshots.py \
            android-apk/patch-level-snapshot-backgrounds.py \
            android-apk/patch-level-transition-sync.py \
            android-apk/patch-sublevels-0-1.py
          python3 android-apk/fetch-level-snapshots.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('android-apk')
          parent = json.loads((root / 'snapshot_sources.json').read_text(encoding='utf-8'))
          sub = json.loads((root / 'sublevel_snapshot_sources.json').read_text(encoding='utf-8'))
          expected = 28 + sum(len(entry['images']) for entry in sub['sublevels'])
          actual = len(list((root / 'app/src/main/assets/level_snapshots/rotation').glob('*')))
          assert actual == expected, (actual, expected)
          assert [entry['id'] for entry in sub['sublevels']] == ['0.1','0.2','0.3','0.5','0.7','1.1','1.2','1.3','1.5']
          assert all(1 <= len(entry['images']) <= 4 for entry in sub['sublevels'])
          assert all([image['slot'] for image in entry['images']] == list(range(1, len(entry['images']) + 1)) for entry in sub['sublevels'])
          assert [entry['level'] for entry in parent['levels']] == list(range(7))
          PY

      - name: Apply exact Android release patch chain
        run: |
          python3 android-apk/patch-provider-status.py
          python3 android-apk/patch-luna-text.py
          python3 android-apk/patch-level-snapshot-backgrounds.py
          python3 android-apk/patch-snapshot-fallback.py
          python3 android-apk/patch-kai-hd-continuous.py
          python3 android-apk/patch-kai-png-preferred.py
          python3 android-apk/patch-kai-codex.py
          python3 android-apk/patch-r06-source-marker.py
          python3 android-apk/patch-drive-canon-gameplay.py
          python3 android-apk/patch-inventory-persistence.py
          python3 android-apk/patch-ai-orchestrator.py
          python3 android-apk/patch-state-op-hardening.py
          python3 android-apk/patch-gemini-health-pool.py
          python3 android-apk/patch-conditional-audit.py
          python3 android-apk/patch-audit-validated-risk.py
          python3 android-apk/patch-gameplay-parity-final.py
          python3 android-apk/patch-final-authority-hardening.py
          python3 android-apk/patch-rejected-op-repair-final.py
          python3 android-apk/patch-kai-resource-policy-final.py
          python3 android-apk/patch-provider-deadline-final.py
          python3 android-apk/patch-gemini-model-matrix-final.py
          python3 android-apk/patch-java-compile-hardening.py
          python3 android-apk/patch-save-controls-final.py
          python3 android-apk/patch-hard-mode-label.py
          python3 android-apk/patch-snapshot-unconfigured.py
          python3 android-apk/patch-game-state-core-bridge.py
          python3 android-apk/patch-character-inventory-ui.py
          python3 android-apk/patch-character-detail-avatar-fallback.py
          python3 android-apk/patch-level-transition-sync.py

      - name: Verify sub-level knowledge, variable rotation and parent-level state contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('android-apk')
          manifest = json.loads((root / 'snapshot_sources.json').read_text(encoding='utf-8'))
          sub = json.loads((root / 'sublevel_snapshot_sources.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'sublevels_0_1.json').read_text(encoding='utf-8'))
          knowledge = json.loads((root / 'app/src/main/assets/knowledge/knowledge_db.json').read_text(encoding='utf-8'))
          assert manifest['rotation_turns'] == 3
          assert [entry['level'] for entry in manifest['levels']] == list(range(7))
          assert all([image['slot'] for image in entry['images']] == [1, 2, 3, 4] for entry in manifest['levels'])
          assert [entry['id'] for entry in catalog['sublevels']] == [entry['id'] for entry in sub['sublevels']]

          records = {record['id']: record for record in knowledge['records']}
          assert 'SUBLEVEL.INDEX.00' in records
          assert 'SUBLEVEL.INDEX.01' in records
          assert 'SUBLEVEL.INDEX.00' in records['LEVEL.00']['references']
          assert 'SUBLEVEL.INDEX.01' in records['LEVEL.01']['references']
          assert 'state.level.number at the integer parent' in records['SUBLEVEL.INDEX.00']['text']

          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'Math.floor((snapshotTurn-1)/3)%seq.length' in java
          assert 'var levelNumber=state&&state.level&&state.level.number;' in java
          assert "var subkey=sm&&subrefs[sm[1]]?sm[1]:'';" in java
          assert 'var seq=subkey?subrefs[subkey]:(refs[lv]||refs[0]);' in java
          assert "Snapshot '+(snapshotSlot+1)+' / '+seq.length" in java
          assert 'put("location", canonicalLevelLocation)' in java
          assert 'function displayLocation(s)' in html
          assert 'Number(m[1])!==n?canonical' in html
          assert 'locationEl.textContent=displayLocation(state)' in html
          for level in range(7):
              for slot in range(1, 5):
                  marker = f'level_snapshots/rotation/level_{level}_{slot}.'
                  assert marker in java, marker
          for entry in sub['sublevels']:
              for image in entry['images']:
                  marker = f"level_snapshots/rotation/sublevel_{entry['id'].replace('.', '_')}_{image['slot']}."
                  assert marker in java, marker
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android unit tests and compile debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
