name: Preflight Snapshot Rotation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preflight-snapshot-rotation.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup-stale-workflow-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete workflow run history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "/repos/${REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .name] | @tsv' > /tmp/all-runs.tsv

          deleted=0
          while IFS=$'\t' read -r run_id run_name; do
            case "$run_name" in
              "Import Lucia avatar from Drive"|\
              "Import Packaged Level Snapshots"|\
              "Import Red Flood Drive snapshot"|\
              "Local Save Level Sync CI"|\
              "One-shot legacy premise cleanup"|\
              "Apply hourly Dullness continuity"|\
              "Apply hourly story step"|\
              "Build Physical Diagnostic APK"|\
              "Entity Drive Overlay Step 4 Test")
                echo "Deleting run ${run_id}: ${run_name}"
                gh api --method DELETE "/repos/${REPO}/actions/runs/${run_id}"
                deleted=$((deleted + 1))
                ;;
            esac
          done < /tmp/all-runs.tsv

          echo "Deleted ${deleted} obsolete workflow runs."
