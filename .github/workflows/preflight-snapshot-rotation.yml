name: Preflight Snapshot Rotation

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  purge-deleted-workflow-history:
    runs-on: ubuntu-latest
    steps:
      - name: Purge every run belonging to deleted workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== WORKFLOWS BEFORE ==="
          gh api --paginate "/repos/${REPO}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .state, .name, .path] | @tsv' | tee /tmp/workflows.tsv

          deleted_workflows=0
          deleted_runs=0

          while IFS=$'\t' read -r workflow_id workflow_state workflow_name workflow_path; do
            [ "$workflow_state" = "deleted" ] || continue
            deleted_workflows=$((deleted_workflows + 1))
            echo "PURGING deleted workflow ${workflow_id}: ${workflow_name} (${workflow_path})"

            gh api --paginate "/repos/${REPO}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[].id' > "/tmp/runs-${workflow_id}.txt" || true

            while read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Deleting run ${run_id}"
              if gh api --method DELETE "/repos/${REPO}/actions/runs/${run_id}"; then
                deleted_runs=$((deleted_runs + 1))
              fi
            done < "/tmp/runs-${workflow_id}.txt"
          done < /tmp/workflows.tsv

          echo "Purged ${deleted_runs} runs across ${deleted_workflows} deleted workflows."
          echo "=== DELETED WORKFLOWS AFTER PURGE ==="
          gh api --paginate "/repos/${REPO}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "deleted") | [.id, .state, .name, .path] | @tsv'
