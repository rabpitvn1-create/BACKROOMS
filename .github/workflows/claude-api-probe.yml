name: Claude API Probe

on:
  push:
    branches:
      - opus/snapshot-character-entity-layout-v1
    paths:
      - .github/workflows/claude-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Claude Fable response shape
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL || secrets.CLAUDE_API_URL || secrets.CLAUDE_URL }}
          CLAUDE_MODEL: claude-fable-5
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get('CLAUDE_API_KEY', '').strip()
          base = os.environ.get('CLAUDE_BASE_URL', '').strip().rstrip('/')
          model = os.environ.get('CLAUDE_MODEL', 'claude-fable-5').strip()
          if not key or not base:
              raise SystemExit('missing provider configuration')
          for suffix in ('/chat/completions', '/messages'):
              if base.endswith(suffix):
                  base = base[:-len(suffix)]
                  break

          req = urllib.request.Request(
              base + '/chat/completions',
              data=json.dumps({
                  'model': model,
                  'messages': [{'role': 'user', 'content': 'Reply exactly: MODEL_OK'}],
                  'max_tokens': 128,
                  'stream': False,
              }).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read().decode('utf-8', errors='replace')
                  print('status=' + str(response.status))
          except urllib.error.HTTPError as error:
              print('status=' + str(error.code))
              print('error=' + error.read().decode('utf-8', errors='replace')[:800])
              raise

          payload = json.loads(raw)
          print('root_keys=' + ','.join(sorted(payload.keys())) if isinstance(payload, dict) else 'root_not_object')
          if isinstance(payload, dict) and isinstance(payload.get('error'), dict):
              err = payload['error']
              print('root_error_type=' + str(err.get('type')))
              print('root_error_code=' + str(err.get('code')))
              print('root_error_message=' + str(err.get('message'))[:500])
              raise SystemExit(2)

          choices = payload.get('choices', []) if isinstance(payload, dict) else []
          print('choices_count=' + str(len(choices) if isinstance(choices, list) else -1))
          if not (isinstance(choices, list) and choices and isinstance(choices[0], dict)):
              raise SystemExit('provider returned no choices')
          choice = choices[0]
          print('choice_keys=' + ','.join(sorted(choice.keys())))
          print('finish_reason=' + str(choice.get('finish_reason')))
          message = choice.get('message')
          if not isinstance(message, dict):
              raise SystemExit('provider returned no assistant message')
          print('message_keys=' + ','.join(sorted(message.keys())))
          content = message.get('content')
          print('content_type=' + type(content).__name__)
          if not isinstance(content, str):
              raise SystemExit('provider returned non-text content')
          print('content_len=' + str(len(content)))
          print('content_preview=' + content[:160])
          if content.strip() != 'MODEL_OK':
              raise SystemExit('provider did not return MODEL_OK')
          print('probe_result=PASS')
          PY
