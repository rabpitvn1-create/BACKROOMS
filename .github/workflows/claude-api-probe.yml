name: Claude API Probe

on:
  push:
    branches:
      - opus/snapshot-character-entity-layout-v1
    paths:
      - .github/workflows/claude-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Claude Fable response shape
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL || secrets.CLAUDE_API_URL || secrets.CLAUDE_URL }}
          CLAUDE_MODEL: claude-fable-5
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get('CLAUDE_API_KEY', '').strip()
          base = os.environ.get('CLAUDE_BASE_URL', '').strip().rstrip('/')
          model = os.environ.get('CLAUDE_MODEL', 'claude-fable-5').strip()
          if not key or not base:
              raise SystemExit('missing provider configuration')
          for suffix in ('/chat/completions', '/messages'):
              if base.endswith(suffix):
                  base = base[:-len(suffix)]
                  break

          req = urllib.request.Request(
              base + '/chat/completions',
              data=json.dumps({
                  'model': model,
                  'messages': [{'role': 'user', 'content': 'Reply exactly: MODEL_OK'}],
                  'max_tokens': 128,
                  'stream': False,
              }).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read().decode('utf-8', errors='replace')
                  print('status=' + str(response.status))
          except urllib.error.HTTPError as error:
              print('status=' + str(error.code))
              print('error=' + error.read().decode('utf-8', errors='replace')[:800])
              raise

          payload = json.loads(raw)
          print('root_keys=' + ','.join(sorted(payload.keys())) if isinstance(payload, dict) else 'root_not_object')
          choices = payload.get('choices', []) if isinstance(payload, dict) else []
          print('choices_count=' + str(len(choices) if isinstance(choices, list) else -1))
          if isinstance(choices, list) and choices and isinstance(choices[0], dict):
              choice = choices[0]
              print('choice_keys=' + ','.join(sorted(choice.keys())))
              print('finish_reason=' + str(choice.get('finish_reason')))
              message = choice.get('message')
              if isinstance(message, dict):
                  print('message_keys=' + ','.join(sorted(message.keys())))
                  for field in ('content', 'reasoning_content', 'reasoning', 'text', 'output_text'):
                      value = message.get(field)
                      print(f'{field}_type={type(value).__name__}')
                      if isinstance(value, str):
                          print(f'{field}_len={len(value)}')
                          print(f'{field}_preview={value[:160]}')
          for field in ('content', 'text', 'output_text', 'response'):
              value = payload.get(field) if isinstance(payload, dict) else None
              print(f'root_{field}_type={type(value).__name__}')
              if isinstance(value, str):
                  print(f'root_{field}_len={len(value)}')
                  print(f'root_{field}_preview={value[:160]}')
          PY
