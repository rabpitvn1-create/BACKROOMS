name: One-shot legacy premise cleanup

on:
  push:
    branches:
      - cleanup/remove-legacy-dinner-noclip

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-dinner-noclip

      - name: Remove legacy premise sources
        run: python android-apk/cleanup_legacy_entry_premise.py

      - name: Commit cleaned sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Remove legacy dinner no-clip premise"
          git push origin HEAD:cleanup/remove-legacy-dinner-noclip
