name: Import Packaged Level Snapshots

on:
  push:
    branches: [feature/package-all-level-snapshots]
    paths:
      - ".github/workflows/import-packaged-level-snapshots.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover verified level snapshots from 1.1.72 debug artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/backroom-1.1.72-artifact.zip"
          artifact_dir="$RUNNER_TEMP/backroom-1.1.72-artifact"
          apk_dir="$RUNNER_TEMP/backroom-1.1.72-apk"
          snapshots="android-apk/app/src/main/assets/level_snapshots"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9549275923/zip" \
            --output "$artifact_zip"

          echo "37f0cdfb378f986719e57904165bf192b7f05bd21bb679d4492c2959c32611be  $artifact_zip" | sha256sum --check --strict

          mkdir -p "$artifact_dir" "$apk_dir" "$snapshots"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          apk="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"

          rm -f "$snapshots"/area_*_fandom_* "$snapshots/fandom_manifest.json"
          unzip -q "$apk" \
            'assets/level_snapshots/area_*_fandom_*' \
            'assets/level_snapshots/fandom_manifest.json' \
            -d "$apk_dir"
          cp "$apk_dir"/assets/level_snapshots/area_*_fandom_* "$snapshots"/
          cp "$apk_dir"/assets/level_snapshots/fandom_manifest.json "$snapshots"/

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('android-apk/app/src/main/assets/level_snapshots')
          manifest_path = root / 'fandom_manifest.json'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert data.get('route_count') == 43, data.get('route_count')
          assert len(data.get('areas', {})) == 43, len(data.get('areas', {}))
          records = [record for area in data['areas'].values() for record in area.get('images', [])]
          assert len(records) == 95, len(records)
          for record in records:
              path = root / record['local_file']
              assert path.is_file() and path.stat().st_size == int(record['bytes']), path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256'], path
          print(f"Verified {len(records)} packaged Fandom snapshots across {len(data['areas'])} campaign areas.")
          PY

      - name: Commit packaged snapshots to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-apk/app/src/main/assets/level_snapshots/area_*_fandom_* \
                  android-apk/app/src/main/assets/level_snapshots/fandom_manifest.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Package verified level snapshot assets"
          git push origin HEAD:feature/package-all-level-snapshots
