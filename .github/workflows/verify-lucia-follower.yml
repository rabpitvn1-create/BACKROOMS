name: Verify Lucia Follower

on:
  push:
    branches: [feat/lucia-follower]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-lucia-follower.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-lucia-follower.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify Lucia contracts and final diff
        id: contracts
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          lucia = (core / 'LuciaCanon.kt').read_text(encoding='utf-8')
          stats = (core / 'CharacterStats.kt').read_text(encoding='utf-8')
          equipment = (core / 'CharacterEquipmentSystem.kt').read_text(encoding='utf-8')
          policy = (core / 'InventoryPolicy.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          test = (root / 'app/src/test/java/com/rabpit/backroom/core/LuciaFollowerTest.kt').read_text(encoding='utf-8')
          avatar = root / 'app/src/main/assets/avatars/lucia_avatar.jpg'

          for marker in (
              'const val LUCIA_ID = "lucia"',
              'const val NAME = "Lucia \\"Lục\\""',
              'const val AGE = 19',
              'const val HOME_LEVEL = 0',
              'const val ENCOUNTER_CHANCE = "50%"',
              'const val AVATAR_REF = "avatars/lucia_avatar.jpg"',
              '"weapon" to LUCIA_M4A1_ID',
              '"blade" to LUCIA_KNIFE_ID',
              '"wrist" to LUCIA_WATCH_ID',
              '"startingLoadedAmmo" to "60"',
              '"startingReserveAmmo" to "90"',
              '"startingTotalAmmo" to "150"',
          ):
              assert marker in lucia, marker

          for marker in ('baseMaxHp = 100', 'str = 7', 'df = 7', 'agi = 8', 'crit = 7'):
              assert marker in stats, marker

          for marker in (
              'BLADE("blade")', 'WRIST("wrist")',
              'id = LUCIA_M4A1_ID', 'id = LUCIA_KNIFE_ID', 'id = LUCIA_WATCH_ID',
              'EquipmentSlot.WEAPON to LUCIA_M4A1_ID',
              'EquipmentSlot.BLADE to LUCIA_KNIFE_ID',
              'EquipmentSlot.WRIST to LUCIA_WATCH_ID',
              'val input = LuciaCanon.ensure(source)',
          ):
              assert marker in equipment, marker

          assert 'val LUCIA = InventoryProfile(maxTypes = 3, maxPerType = 100)' in policy
          assert 'ItemSystem.capacityFor(state, characterId)' in policy
          assert '"inventoryProfile" to "lucia_gift_inventory"' in lucia

          encounter = 'thresholdRoll("luciaEncounter", 10000, 5000, exploreAction && level == 0 && !flagSpawned(state, "lucia")'
          assert encounter in main, encounter
          assert 'LUCIA FOLLOWER HARD LOCK:' in main
          assert 'không được xác nhận Hound cư trú ở Level 0' in main
          assert 'thresholdRoll("luciaEncounter", 10000, 5000, physical' not in main
          assert 'thresholdRoll("luciaEncounter", 10000, 5000, entityAllowed' not in main

          for marker in (
              'assertEquals(100, profile.baseMaxHp)',
              'assertEquals(listOf(7, 7, 8, 7)',
              'assertEquals(3, slots.size)',
              'assertEquals(3, profile.maxTypes)',
              'assertEquals(100, profile.maxPerType)',
          ):
              assert marker in test, marker

          assert avatar.is_file() and avatar.stat().st_size > 0, avatar
          PY
          git diff --check

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        id: android_build
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify debug APK
        id: apk_check
        if: steps.android_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          rm -rf lucia-apk-check && mkdir lucia-apk-check
          unzip -q "$APK" 'assets/avatars/lucia_avatar.jpg' -d lucia-apk-check
          test -s lucia-apk-check/assets/avatars/lucia_avatar.jpg

      - name: Upload verification APK
        if: steps.apk_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lucia-follower-debug-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Enforce pre-merge green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.contracts.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.apk_check.outcome }}" = "success"
