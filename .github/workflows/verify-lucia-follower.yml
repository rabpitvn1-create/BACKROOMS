name: Verify Lucia Follower

on:
  push:
    branches: [feat/lucia-follower]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-lucia-follower.yml"
      - ".github/workflows/build-backroom-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-lucia-follower.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow = Path('.github/workflows/build-backroom-apk.yml').read_text(encoding='utf-8')
          scripts = re.search(r'scripts=\(([^)]+)\)', workflow).group(1).split()
          for script in scripts:
              print("==>", script)
              subprocess.run(['python3', 'android-apk/' + script], check=True)
          PY

      - name: Verify Lucia contracts and final diff
        id: contracts
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          lucia = (core / 'LuciaCanon.kt').read_text(encoding='utf-8')
          stats = (core / 'CharacterStats.kt').read_text(encoding='utf-8')
          progression = (core / 'CharacterProgressionCore.kt').read_text(encoding='utf-8')
          equipment = (core / 'CharacterEquipmentSystem.kt').read_text(encoding='utf-8')
          policy = (core / 'InventoryPolicy.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          test = (root / 'app/src/test/java/com/rabpit/backroom/core/LuciaFollowerTest.kt').read_text(encoding='utf-8')
          avatar = root / 'app/src/main/assets/avatars/lucia_avatar.jpg'
          combat_overlay = root / 'app/src/main/assets/LUCIA_LUC_OVERLAY.png'

          for marker in (
              'const val LUCIA_ID = "lucia"',
              'const val NAME = "Lucia \\"Lục\\""',
              'const val AGE = 19',
              'const val HOME_LEVEL = 0',
              'const val ENCOUNTER_CHANCE = "50%"',
              'const val AVATAR_REF = "avatars/lucia_avatar.jpg"',
              '"weapon" to LUCIA_M4A1_ID',
              '"blade" to LUCIA_KNIFE_ID',
              '"wrist" to LUCIA_WATCH_ID',
              '"startingLoadedAmmo" to "60"',
              '"startingReserveAmmo" to "90"',
              '"startingTotalAmmo" to "150"',
          ):
              assert marker in lucia, marker

          for marker in (
              'const val BASE_STAT = 5',
              'const val MAX_STAT = 999',
              'const val BASE_MAX_HP = 50',
          ):
              assert marker in progression, marker
          for marker in (
              'val str: Int = CharacterProgressionCore.BASE_STAT',
              'val def: Int = CharacterProgressionCore.BASE_STAT',
              'val skl: Int = CharacterProgressionCore.BASE_STAT',
              'val vit: Int = CharacterProgressionCore.BASE_STAT',
          ):
              assert marker in stats, marker
          for forbidden in ('val df:', 'val agi:', 'val crit:'):
              assert forbidden not in stats, forbidden

          for marker in (
              'BLADE("blade")', 'WRIST("wrist")',
              'id = LUCIA_M4A1_ID', 'id = LUCIA_KNIFE_ID', 'id = LUCIA_WATCH_ID',
              'EquipmentSlot.WEAPON to LUCIA_M4A1_ID',
              'EquipmentSlot.BLADE to LUCIA_KNIFE_ID',
              'EquipmentSlot.WRIST to LUCIA_WATCH_ID',
              'val input = LuciaCanon.ensure(source)',
          ):
              assert marker in equipment, marker

          assert 'val LUCIA = InventoryProfile(maxTypes = 3, maxPerType = 100)' in policy
          assert 'if (characterId == LUCIA_ID) return LUCIA' in policy

          encounter = 'thresholdRoll("luciaEncounter", 10000, 5000, exploreAction && level == 0 && !flagSpawned(state, "lucia")'
          assert encounter in main, encounter
          assert 'LUCIA FOLLOWER HARD LOCK:' in main
          assert 'không được xác nhận Hound cư trú ở Level 0' in main
          assert 'thresholdRoll("luciaEncounter", 10000, 5000, physical' not in main
          assert 'thresholdRoll("luciaEncounter", 10000, 5000, entityAllowed' not in main

          for marker in (
              'LUCIA_COMBAT_OVERLAY_R01',
              'function luciaCombatVisible()',
              "img.className='snapshot-lucia'",
              "img.src='file:///android_asset/LUCIA_LUC_OVERLAY.png'",
              "renderSnapshot=function(){__luciaBaseRenderSnapshot();appendLuciaCombatOverlay();};",
              "if(!c||c.active!==true)return false;",
          ):
              assert marker in main, marker
          assert 'CAO_MINH_OVERLAY_ENTITY_ENCOUNTER.png' in main
          assert "img.className='snapshot-character'" not in main or 'snapshot-character' in main

          for marker in (
              'luciaUsesCanonical1193aBaseStats',
              'assertEquals(50, lucia.statProfile.baseMaxHp)',
              'assertEquals(listOf(5,5,5,5)',
              'assertEquals(3, slots.size)',
              'assertEquals(3, profile.maxTypes)',
              'assertEquals(100, profile.maxPerType)',
          ):
              assert marker in test, marker

          assert avatar.is_file() and avatar.stat().st_size > 0, avatar
          assert combat_overlay.is_file() and combat_overlay.stat().st_size > 0, combat_overlay
          raw = combat_overlay.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', 'Lucia combat overlay PNG signature'
          PY
          git diff --check

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        id: android_build
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify debug APK
        id: apk_check
        if: steps.android_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          rm -rf lucia-apk-check && mkdir lucia-apk-check
          unzip -q "$APK" 'assets/avatars/lucia_avatar.jpg' 'assets/LUCIA_LUC_OVERLAY.png' -d lucia-apk-check
          test -s lucia-apk-check/assets/avatars/lucia_avatar.jpg
          test -s lucia-apk-check/assets/LUCIA_LUC_OVERLAY.png

      - name: Upload verification APK
        if: steps.apk_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lucia-follower-debug-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Enforce pre-merge green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.contracts.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.apk_check.outcome }}" = "success"
