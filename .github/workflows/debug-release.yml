name: Backrooms debug release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-release.yml'
      - 'scripts/**'
      - 'android-debug/**'

concurrency:
  group: backrooms-debug-release-1.0.0.0
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-debug]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test recovered package and key replacement
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build disposable offline smoke fixture
        env:
          GEMINI_API_KEY_1: offline-new-key-1
          GEMINI_API_KEY_2: offline-new-key-2
          GEMINI_API_KEY_3: offline-new-key-3
          GEMINI_API_KEY_4: offline-new-key-4
          GEMINI_API_KEY_5: offline-new-key-5
          GEMINI_API_KEY_6: offline-new-key-6
          ARGON: offline-argon-fixture
        run: python3 scripts/debug_release.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android signing tools
        run: sdkmanager 'build-tools;35.0.0' 'platform-tools' 'platforms;android-35'
      - name: Align and sign personal debug build
        run: |
          keytool -genkeypair -keystore build/debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 build/Backrooms-1.0.0.0-debug-unsigned.apk build/aligned.apk
          "$tools/apksigner" sign --ks build/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/Backrooms-1.0.0.0-debug.apk build/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs build/Backrooms-1.0.0.0-debug.apk
          "$tools/zipalign" -c -v 4 build/Backrooms-1.0.0.0-debug.apk
          "$tools/aapt" dump badging build/Backrooms-1.0.0.0-debug.apk > build/apk-metadata.txt
          cat build/apk-metadata.txt
          grep -F "versionName='1.0.0.0'" build/apk-metadata.txt
          grep -F "versionCode='90000001'" build/apk-metadata.txt
          grep -F 'application-debuggable' build/apk-metadata.txt
      - name: Compile tests for the actual APK provider router
        run: |
          mkdir -p build/router-classes
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d build/router-classes scripts/RouterSmoke.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 24 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output build/router-tests.jar build/router-classes/*.class
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install build/Backrooms-1.0.0.0-debug.apk
            adb push build/Backrooms-1.0.0.0-debug.apk /data/local/tmp/backrooms.apk
            adb push build/router-tests.jar /data/local/tmp/router-tests.jar
            adb shell chmod 444 /data/local/tmp/backrooms.apk /data/local/tmp/router-tests.jar
            adb shell 'CLASSPATH=/data/local/tmp/router-tests.jar app_process /system/bin RouterSmoke /data/local/tmp/backrooms.apk' > build/router-smoke.txt
            cat build/router-smoke.txt
            adb logcat -c
            adb shell am start -W -n com.rabpit.caominh/com.rabpit.backroom.MainActivity
            sleep 10
            adb shell pidof com.rabpit.caominh
            adb shell run-as com.rabpit.caominh id
            adb shell dumpsys activity activities > build/activity.txt
            grep -E 'topResumedActivity.*com.rabpit.caominh|mResumedActivity.*com.rabpit.caominh' build/activity.txt
            adb logcat -d -s AndroidRuntime:E > build/android-runtime.txt
            test ! -s build/android-runtime.txt || ! grep -E 'FATAL EXCEPTION|VerifyError' build/android-runtime.txt
            adb exec-out screencap -p > build/android15-debug.png
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-debug-verification
          path: |
            build/*metadata.txt
            build/activity.txt
            build/android-runtime.txt
            build/router-smoke.txt
            build/android15-debug.png
          if-no-files-found: ignore
  connection:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-debug]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify all six primary keys and final Argon fallback
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          ARGON: ${{ secrets.Argon_api_key }}
        run: python3 scripts/debug_release.py --probe-only
  debug:
    needs: [verify, connection]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-debug]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAG: v1.0.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Version 1.0.0.0 already exists; refusing to replace it.'
            exit 1
          fi
      - name: Test recovered package and key replacement
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Package six current primary keys and Argon fallback
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          ARGON: ${{ secrets.Argon_api_key }}
        run: python3 scripts/debug_release.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android signing tools
        run: sdkmanager 'build-tools;35.0.0' 'platform-tools' 'platforms;android-35'
      - name: Align and sign personal debug build
        run: |
          keytool -genkeypair -keystore build/debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 build/Backrooms-1.0.0.0-debug-unsigned.apk build/aligned.apk
          "$tools/apksigner" sign --ks build/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/Backrooms-1.0.0.0-debug.apk build/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs build/Backrooms-1.0.0.0-debug.apk
          "$tools/zipalign" -c -v 4 build/Backrooms-1.0.0.0-debug.apk
          "$tools/aapt" dump badging build/Backrooms-1.0.0.0-debug.apk > build/apk-metadata.txt
          cat build/apk-metadata.txt
          grep -F "versionName='1.0.0.0'" build/apk-metadata.txt
          grep -F "versionCode='90000001'" build/apk-metadata.txt
          grep -F 'application-debuggable' build/apk-metadata.txt
      - name: Publish 1.0.0.0 debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          sha256sum Backrooms-1.0.0.0-debug.apk > SHA256SUMS.txt
          gh release create "$TAG" Backrooms-1.0.0.0-debug.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Backrooms 1.0.0.0 debug' --notes-file ../android-debug/RELEASE_NOTES.md
