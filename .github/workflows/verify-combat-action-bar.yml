name: Verify Direct Poker Combat

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-combat-action-bar.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow = Path('.github/workflows/build-backroom-apk.yml').read_text(encoding='utf-8')
          scripts = re.search(r'scripts=\(([^)]+)\)', workflow).group(1).split()
          for script in scripts:
              print("==>", script)
              subprocess.run(['python3', 'android-apk/' + script], check=True)
          PY

      - name: Verify direct Poker combat and Party runtime contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          combat = (root / 'app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt').read_text(encoding='utf-8')
          facade = (root / 'app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          poker = (root / 'app/src/main/java/com/rabpit/backroom/core/PokerDiceCore.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')

          for marker in (
              'DIRECT_COMBAT_GATE_V1',
              "row.classList.toggle('combat-direct',active)",
              'POKER_DICE_CORE_BACKPORT_R01',
              'id="pokerDiceModal"',
              'ensureDirectCombatDice',
              'DIRECT_COMBAT_ACTION',
              'POKER_DICE_119_POLISH_R01',
              'poker-die-shadow',
              'poker-die-object',
              'poker-die-hold-seal',
              '@keyframes poker-die-3d',
              '@keyframes poker-die-toss',
              '@keyframes poker-die-shadow-roll',
              '@keyframes poker-die-settle',
              'DICE_ROLL_ANIMATION_MS=680',
              'DICE_SETTLE_ANIMATION_MS=170',
              'FINALIZE_PREVIEW_MS=2000',
              'setProperty("--die-delay",String(index*-55)+"ms")',
              'Android.combatDicePrepare',
              'Android.combatDiceFinish',
          ):
              assert marker in html or marker in poker, marker

          for retired in (
              "label:'TẤN CÔNG'", "label:'NÉ TRÁNH'", "label:'BỎ CHẠY'",
              "dataset.combatAction", "function submitCombat(action)", "openCombatDiceForAction",
              'PRESSURE_COMBAT_HUD_V1', 'id="combatHud"',
          ):
              assert retired not in html, retired

          assert 'const val DIRECT_COMBAT_ACTION = "Cả Party cùng tấn công"' in poker
          assert 'PokerDiceCore.isFinalizedFor(current, action, activeCombat.encounterId)' in facade
          assert 'if (action != PokerDiceCore.DIRECT_COMBAT_ACTION)' in facade

          # Party attack/skill/ultimate runtime stays available behind the direct dice resolve.
          for marker in (
              'PARTY_ACTIONS_V1',
              'PARTY ACTION TẤN CÔNG:',
              'PARTY_FOLLOWER_BASE_ATTACKS_V1',
              'val jointOrder = true // PARTY_ACTIONS_V1',
              'Iris thực hiện lệnh TẤN CÔNG',
              'Syvial thực hiện lệnh TẤN CÔNG',
              'PARTY_ATTACK_GCO_GATE_V1',
          ):
              assert marker in combat, marker

          assert 'file:///android_asset/entity/' in main
          assert 'function activeEntityKey()' in main
          assert 'state.combat' in main
          assert 'POKER_DICE_SNAPSHOT_CLEAR_R01' in html
          assert 'POKER_DICE_NEAR_SNAPSHOT_R01' in html
          assert '.poker-dice-backdrop{display:none}' in html
          assert 'function mountNearSnapshot()' in html
          assert 'snapshot.insertAdjacentElement("afterend",modal)' in html
          assert 'function ensureDirectCombatDice(){\n    mountNearSnapshot();' in html
          assert '.poker-dice-modal{position:fixed' not in html
          assert 'COMBAT_STACK_FLOW_R01' in html
          assert 'body.poker-dice-open .game{display:block;overflow-y:auto;overscroll-behavior-y:contain}' in html
          assert 'COMBAT_HIDE_GM_LOG_R01' in html
          assert 'body.poker-dice-open .game>.log{display:none!important}' in html
          assert 'document.body.classList.add("poker-dice-open")' in html
          assert 'document.body.classList.remove("poker-dice-open")' in html
          assert 'id="log"' in html
          feedback_js = (root / 'app/src/main/assets/combat-feedback-1193a.js').read_text(encoding='utf-8')
          feedback_css = (root / 'app/src/main/assets/combat-feedback-1193a.css').read_text(encoding='utf-8')
          assert 'COMBAT_TRANSIENT_LOG_R01' in feedback_js
          assert "combatPanel.id='combatFeedbackPanel'" in feedback_js
          assert "var dice=document.getElementById('pokerDiceModal')" in feedback_js
          assert "anchor=dice&&dice.isConnected!==false?dice:snapshot" in feedback_js
          assert "anchor.insertAdjacentElement('afterend',combatPanel)" in feedback_js
          assert "resetCombatPanel()" in feedback_js
          assert 'state.log' not in feedback_js
          assert 'localStorage' not in feedback_js
          assert '.combat-feedback-panel' in feedback_css
          assert 'ENTITY_SHARED_GROUND_PLANE_R02' in main
          assert 'ENTITY_PRECOMPUTED_ALPHA_BOUNDS_R02' in main
          assert "__entityVisualBounds" in main
          assert "rect=img.getBoundingClientRect()" in main
          assert "x=-Number(b.left||0)*ew*scale,y=(1-Number(b.bottom||1))*eh*scale" in main
          assert 'combat-feedback-1193a.js' in html
          assert 'combat-feedback-1193a.css' in html
          assert 'output.put("combatFeedback"' in facade
          assert 'put("summary", combatReply)' in facade
          assert 'if (action != PokerDiceCore.DIRECT_COMBAT_ACTION)' in facade
          assert 'log.put(JSONObject().put("role", "gm").put("text", combatReply))' not in facade
          assert 'feedback = feedback.toList()' in combat
          assert 'function normalizeEntityVisual(img)' in main
          assert 'ctx.getImageData(0,0,pw,ph)' not in main
          assert "document.createElement('canvas')" not in main
          assert "img.onload=function(){normalizeEntityVisual(img)" in main
          assert "modal.hidden=true" not in feedback_js
          PY
          node --test android-apk/tests/snapshot-combat-damage.test.cjs
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run all unit tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify packaged direct-combat WebView UI
        run: |
          set -euo pipefail
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf combat-apk-check && mkdir combat-apk-check
          unzip -q "$APK" 'assets/index.html' 'assets/dice/*' 'assets/combat-feedback-1193a.*' 'assets/fonts/*' -d combat-apk-check
          html=combat-apk-check/assets/index.html
          grep -q 'DIRECT_COMBAT_GATE_V1' "$html"
          grep -q 'POKER_DICE_CORE_BACKPORT_R01' "$html"
          grep -q 'pokerDiceModal' "$html"
          grep -q 'ensureDirectCombatDice' "$html"
          grep -q 'mountNearSnapshot();' "$html"
          grep -q 'POKER_DICE_119_POLISH_R01' "$html"
          grep -q 'poker-die-shadow' "$html"
          grep -q 'poker-die-hold-seal' "$html"
          grep -q 'DICE_ROLL_ANIMATION_MS=680' "$html"
          grep -q 'DICE_SETTLE_ANIMATION_MS=170' "$html"
          grep -q 'FINALIZE_PREVIEW_MS=2000' "$html"
          grep -q 'POKER_DICE_SNAPSHOT_CLEAR_R01' "$html"
          grep -q 'POKER_DICE_NEAR_SNAPSHOT_R01' "$html"
          grep -q 'poker-dice-backdrop{display:none}' "$html"
          grep -q 'snapshot.insertAdjacentElement("afterend",modal)' "$html"
          ! grep -q 'if(window.__combatFeedbackBusy){hide();return;}' "$html"
          ! grep -q '.poker-dice-modal{position:fixed' "$html"
          grep -q 'combat-feedback-1193a.js' "$html"
          grep -q 'COMBAT_FEEDBACK_1193A' combat-apk-check/assets/combat-feedback-1193a.js
          grep -q 'COMBAT_TRANSIENT_LOG_R01' combat-apk-check/assets/combat-feedback-1193a.js
          grep -q "packet&&packet.summary" combat-apk-check/assets/combat-feedback-1193a.js
          grep -q "combatPanel.id='combatFeedbackPanel'" combat-apk-check/assets/combat-feedback-1193a.js
          grep -q "var dice=document.getElementById('pokerDiceModal')" combat-apk-check/assets/combat-feedback-1193a.js
          grep -q "anchor.insertAdjacentElement('afterend',combatPanel)" combat-apk-check/assets/combat-feedback-1193a.js
          ! grep -q "modal.hidden=true" combat-apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'state.log' combat-apk-check/assets/combat-feedback-1193a.js
          ! grep -q 'localStorage' combat-apk-check/assets/combat-feedback-1193a.js
          grep -q '.combat-feedback-panel' combat-apk-check/assets/combat-feedback-1193a.css
          test -s combat-apk-check/assets/combat-feedback-1193a.css
          test -s combat-apk-check/assets/fonts/Play-Bold.ttf
          ! grep -q "label:'TẤN CÔNG'" "$html"
          ! grep -q "label:'NÉ TRÁNH'" "$html"
          ! grep -q "label:'BỎ CHẠY'" "$html"
          ! grep -q 'openCombatDiceForAction' "$html"
          ! grep -q 'PRESSURE_COMBAT_HUD_V1' "$html"
          test -s combat-apk-check/assets/dice/die-1.png
          test -s combat-apk-check/assets/dice/die-6.png
          test -s combat-apk-check/assets/dice/roll-3d.png
