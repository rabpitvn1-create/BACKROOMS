name: Verify Direct Poker Combat

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-combat-action-bar.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-provider-key-pool.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py patch-ui-1.1.99-shell.py patch-poker-dice-core-backport.py patch-poker-dice-ui-119-polish.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done
          # PR merge refs may include item-action tests added by main after this branch.
          if test -f android-apk/app/src/test/java/com/rabpit/backroom/core/ItemDetailActionsTest.kt; then
            python3 android-apk/patch-item-detail-actions.py
            python3 android-apk/patch-item-whole-unit.py
          fi

      - name: Verify direct Poker combat and Party runtime contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          combat = (root / 'app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt').read_text(encoding='utf-8')
          facade = (root / 'app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          poker = (root / 'app/src/main/java/com/rabpit/backroom/core/PokerDiceCore.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')

          for marker in (
              'DIRECT_COMBAT_GATE_V1',
              "row.classList.toggle('combat-direct',active)",
              'POKER_DICE_CORE_BACKPORT_R01',
              'id="pokerDiceModal"',
              'ensureDirectCombatDice',
              'DIRECT_COMBAT_ACTION',
              'POKER_DICE_119_POLISH_R01',
              'poker-die-shadow',
              'poker-die-object',
              'poker-die-hold-seal',
              '@keyframes poker-die-3d',
              '@keyframes poker-die-toss',
              '@keyframes poker-die-shadow-roll',
              '@keyframes poker-die-settle',
              'DICE_ROLL_ANIMATION_MS=680',
              'DICE_SETTLE_ANIMATION_MS=170',
              'FINALIZE_PREVIEW_MS=2000',
              'setProperty("--die-delay",String(index*-55)+"ms")',
              'Android.combatDicePrepare',
              'Android.combatDiceFinish',
          ):
              assert marker in html or marker in poker, marker

          for retired in (
              "label:'TẤN CÔNG'", "label:'NÉ TRÁNH'", "label:'BỎ CHẠY'",
              "dataset.combatAction", "function submitCombat(action)", "openCombatDiceForAction",
              'PRESSURE_COMBAT_HUD_V1', 'id="combatHud"',
          ):
              assert retired not in html, retired

          assert 'const val DIRECT_COMBAT_ACTION = "Cả Party cùng tấn công"' in poker
          assert 'PokerDiceCore.isFinalizedFor(current, action, activeCombat.encounterId)' in facade
          assert 'if (action == PokerDiceCore.DIRECT_COMBAT_ACTION)' in facade

          # Party attack/skill/ultimate runtime stays available behind the direct dice resolve.
          for marker in (
              'PARTY_ACTIONS_V1',
              'PARTY ACTION TẤN CÔNG:',
              'PARTY_FOLLOWER_BASE_ATTACKS_V1',
              'val jointOrder = true // PARTY_ACTIONS_V1',
              'Iris thực hiện lệnh TẤN CÔNG',
              'Syvial thực hiện lệnh TẤN CÔNG',
              'PARTY_ATTACK_GCO_GATE_V1',
          ):
              assert marker in combat, marker

          assert 'file:///android_asset/entity/' in main
          assert 'function activeEntityKey()' in main
          assert 'state.combat' in main
          assert 'POKER_DICE_SNAPSHOT_CLEAR_R01' in html
          assert '.poker-dice-backdrop{position:absolute;inset:0;background:transparent}' in html
          assert 'SNAPSHOT_COMBAT_DAMAGE_RUNTIME_R01' in html
          assert 'before.entityHp-after.entityHp' in html
          assert 'snapshot-combat-dmg' in html
          assert 'function normalizeEntityVisual(img)' in main
          assert 'ctx.getImageData(0,0,pw,ph)' in main
          assert "img.onload=function(){normalizeEntityVisual(img)" in main
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run all unit tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify packaged direct-combat WebView UI
        run: |
          set -euo pipefail
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf combat-apk-check && mkdir combat-apk-check
          unzip -q "$APK" 'assets/index.html' 'assets/dice/*' -d combat-apk-check
          html=combat-apk-check/assets/index.html
          grep -q 'DIRECT_COMBAT_GATE_V1' "$html"
          grep -q 'POKER_DICE_CORE_BACKPORT_R01' "$html"
          grep -q 'pokerDiceModal' "$html"
          grep -q 'ensureDirectCombatDice' "$html"
          grep -q 'POKER_DICE_119_POLISH_R01' "$html"
          grep -q 'poker-die-shadow' "$html"
          grep -q 'poker-die-hold-seal' "$html"
          grep -q 'DICE_ROLL_ANIMATION_MS=680' "$html"
          grep -q 'DICE_SETTLE_ANIMATION_MS=170' "$html"
          grep -q 'FINALIZE_PREVIEW_MS=2000' "$html"
          grep -q 'POKER_DICE_SNAPSHOT_CLEAR_R01' "$html"
          grep -q 'background:transparent' "$html"
          grep -q 'SNAPSHOT_COMBAT_DAMAGE_RUNTIME_R01' "$html"
          grep -q 'snapshot-combat-dmg' "$html"
          ! grep -q "label:'TẤN CÔNG'" "$html"
          ! grep -q "label:'NÉ TRÁNH'" "$html"
          ! grep -q "label:'BỎ CHẠY'" "$html"
          ! grep -q 'openCombatDiceForAction' "$html"
          ! grep -q 'PRESSURE_COMBAT_HUD_V1' "$html"
          test -s combat-apk-check/assets/dice/die-1.png
          test -s combat-apk-check/assets/dice/die-6.png
          test -s combat-apk-check/assets/dice/roll-3d.png
