name: Verify Combat Action Bar

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-combat-action-bar.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify combat action bar, icon and Party command contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          combat = (root / 'app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          patch = (root / 'patch-combat-action-bar-finalize.py').read_text(encoding='utf-8')
          base_ui_patch = (root / 'patch-three-action-ui-only.py').read_text(encoding='utf-8')
          party_patch = (root / 'patch-party-combat-actions-finalize.py').read_text(encoding='utf-8')
          chain = (root / 'patch-inventory-capacity-final-fix.py').read_text(encoding='utf-8')
          party_test = (root / 'app/src/test/java/com/rabpit/backroom/core/PartyCombatActionsTest.kt').read_text(encoding='utf-8')

          required_html = (
              'COMBAT_ACTION_BAR_V2',
              "label:'TẤN CÔNG'",
              "label:'NÉ TRÁNH'",
              "label:'BỎ CHẠY'",
              "action:'Cả Party cùng tấn công'",
              "action:'Cả Party cùng né tránh'",
              "action:'Cả Party cùng bỏ chạy'",
              "window.Android.submitAction(JSON.stringify(state),'EXECUTE',action)",
              "document.addEventListener('click',interceptCombatClick,true)",
              "form.addEventListener('submit'",
              "actionInput.addEventListener('input'",
              "row.classList.toggle('combat-actions',active)",
              "middle.type='button'",
              "middle.type='submit'",
              'icon-search',
              'icon-execute',
              'icon-explore',
              'icon-attack',
              'icon-evade',
              'icon-flee',
          )
          for marker in required_html:
              assert marker in html, marker

          for forbidden in (
              'PRESSURE_COMBAT_HUD_V1',
              'id="pressureCombatStyle"',
              'id="combatHud"',
              'footprint-icon',
              'ai-action-icon',
              '>AI</text>',
          ):
              assert forbidden not in html, forbidden

          for marker in (
              'PARTY_ACTIONS_V1',
              'PARTY ACTION TẤN CÔNG:',
              'PARTY ACTION NÉ TRÁNH:',
              'PARTY ACTION BỎ CHẠY:',
              'PARTY_FOLLOWER_BASE_ATTACKS_V1',
              'val jointOrder = true // PARTY_ACTIONS_V1',
              'Iris thực hiện lệnh TẤN CÔNG',
              'Syvial thực hiện lệnh TẤN CÔNG',
              'An Nhiên thực hiện lệnh TẤN CÔNG theo vai trò hỗ trợ',
              'PARTY_ATTACK_GCO_GATE_V1',
          ):
              assert marker in combat, marker

          # Offensive actions cannot leak into the two non-attack Party commands.
          assert 'intent == Intent.ATTACK && !isGuiltyCrownTurn' in combat
          assert 'intent == Intent.ATTACK && c.eventCounter % IRIS_ULTIMATE_INTERVAL_TURNS == 0' in combat
          assert 'intent == Intent.ATTACK && syvialDevilTrigger' in combat
          assert 'intent == Intent.ESCAPE && c.eventCounter % AN_NHIEN_ULTIMATE_INTERVAL_TURNS == 0' in combat

          # All three commands are covered as one-event Party resolutions.
          for marker in (
              'attackButtonResolvesEveryActivePartyMemberInOneCombatEvent',
              'evadeButtonMovesTheWholePartyAndDoesNotFireOffensiveSkills',
              'fleeButtonWithdrawsTheWholePartyWithoutDroppingFollowersOrFiring',
          ):
              assert marker in party_test, marker

          # Existing scene/Entity visual authority remains untouched.
          assert 'file:///android_asset/entity/' in main
          assert 'function activeEntityKey()' in main
          assert 'state.combat' in main

          # Patch chain order is intentional: the base three-action UI is established first;
          # combat finalizer replaces only the button presentation; Party authority follows it;
          # state-fix/rest finalizers still run later through their existing nested chain.
          ui_call = 'runpy.run_path(str(ROOT / "patch-combat-action-bar-finalize.py"), run_name="__main__")'
          party_call = 'runpy.run_path(str(ROOT / "patch-party-combat-actions-finalize.py"), run_name="__main__")'
          assert ui_call in chain and party_call in chain
          assert chain.index(ui_call) < chain.index(party_call)

          # The normal buttons and the post-combat restoration must share the same icon language.
          for marker in ('icon-search', 'icon-execute', 'icon-explore'):
              assert marker in base_ui_patch
              assert marker in patch
          for obsolete in ('footprint-icon', 'ai-action-icon', '>AI</text>'):
              assert obsolete not in base_ui_patch
              assert obsolete not in patch

          # No bitmap/network dependency is introduced for action icons.
          combined_patch = (patch + base_ui_patch + party_patch).lower()
          assert '.png' not in combined_patch
          assert '.jpg' not in combined_patch
          assert '.jpeg' not in combined_patch
          assert '<svg' in patch and '<svg' in base_ui_patch

          assert html.count('COMBAT_ACTION_BAR_V2') == 1
          assert html.count("document.addEventListener('click',interceptCombatClick,true)") == 1
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run all unit tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify packaged WebView UI
        run: |
          set -euo pipefail
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf combat-apk-check && mkdir combat-apk-check
          unzip -q "$APK" 'assets/index.html' -d combat-apk-check
          html=combat-apk-check/assets/index.html
          grep -q 'COMBAT_ACTION_BAR_V2' "$html"
          grep -q 'TẤN CÔNG' "$html"
          grep -q 'NÉ TRÁNH' "$html"
          grep -q 'BỎ CHẠY' "$html"
          grep -q 'Cả Party cùng tấn công' "$html"
          grep -q 'Cả Party cùng né tránh' "$html"
          grep -q 'Cả Party cùng bỏ chạy' "$html"
          for icon in search execute explore attack evade flee; do
            grep -q "icon-$icon" "$html"
          done
          ! grep -q 'footprint-icon' "$html"
          ! grep -q 'ai-action-icon' "$html"
          ! grep -q '>AI</text>' "$html"
          ! grep -q 'PRESSURE_COMBAT_HUD_V1' "$html"
          ! grep -q 'id="combatHud"' "$html"
