name: Cleanup skipped Actions runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-skipped-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: delete-skipped-runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete all skipped workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while true; do
            mapfile -t ids < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=skipped&per_page=100" \
                --jq '.workflow_runs[].id'
            )
            if (( ${#ids[@]} == 0 )); then
              break
            fi
            for id in "${ids[@]}"; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted $deleted skipped workflow runs."
