name: Materialize Kai Visuals

on:
  push:
    branches:
      - feat/kai-dual-overlay-avatar
    paths:
      - "android-apk/kai-visual-source.json"
      - ".github/workflows/materialize-kai-visuals.yml"

permissions:
  contents: write

concurrency:
  group: materialize-kai-visuals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image decoder
        run: python -m pip install pillow

      - name: Download and verify Kai visuals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import io
          import json
          import urllib.request

          root = Path('.')
          manifest = json.loads((root / 'android-apk/kai-visual-source.json').read_text(encoding='utf-8'))
          entries = manifest['assets']
          assert {entry['role'] for entry in entries} == {'normalOverlay', 'entityEncounterOverlay', 'avatar'}

          def fetch_original(file_id: str) -> bytes:
              urls = [
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t',
              ]
              errors = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                      if data.startswith(b'\x89PNG\r\n\x1a\n') or data.startswith(b'\xff\xd8\xff'):
                          return data
                      errors.append(f'{url}: unsupported image payload ({len(data)} bytes)')
                  except Exception as exc:
                      errors.append(f'{url}: {exc}')
              raise RuntimeError('Drive download failed: ' + ' | '.join(errors))

          for entry in entries:
              data = fetch_original(entry['driveFileId'])
              size = len(data)
              sha = hashlib.sha256(data).hexdigest()
              if size != entry['sourceSize']:
                  raise RuntimeError(f"{entry['sourceFile']}: size changed, expected {entry['sourceSize']}, got {size}")
              if sha != entry['sourceSha256']:
                  raise RuntimeError(f"{entry['sourceFile']}: SHA-256 changed, expected {entry['sourceSha256']}, got {sha}")

              with Image.open(io.BytesIO(data)) as image:
                  image.load()
                  if image.size != (entry['width'], entry['height']):
                      raise RuntimeError(f"{entry['sourceFile']}: dimensions changed, got {image.size}")
                  runtime = root / 'android-apk' / entry['runtimeFile']
                  runtime.parent.mkdir(parents=True, exist_ok=True)
                  if entry['runtimePolicy'] == 'exact-source-bytes':
                      if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise RuntimeError(f"{entry['sourceFile']}: exact overlay source is not PNG")
                      runtime.write_bytes(data)
                  elif entry['runtimePolicy'] == 'decode-jpeg-and-encode-png-without-resize':
                      image.convert('RGB').save(runtime, format='PNG', optimize=True)
                  else:
                      raise RuntimeError(f"Unsupported runtime policy: {entry['runtimePolicy']}")

              print(f"OK {entry['role']} -> {runtime} ({size} source bytes, {sha})")
          PY

      - name: Commit runtime visuals and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-kai-visuals.yml
          git add android-apk/app/src/main/assets/kai_snapshot_overlay.png
          git add android-apk/app/src/main/assets/kai_snapshot_overlay_combat.png
          git add android-apk/app/src/main/assets/avatars/kai_avatar.png
          git commit -m "Update Kai overlay and avatar assets"
          git push origin HEAD:${GITHUB_REF_NAME}
