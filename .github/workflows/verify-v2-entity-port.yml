name: Verify V2 Entity Port

on:
  push:
    branches:
      - agent-ponytail/port-v2-entity-system
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-v2-entity-port.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "\${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify V2 Entity contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("android-apk")
          registry = json.loads((root / "app/src/main/assets/knowledge/entity_encounters.json").read_text(encoding="utf-8"))
          java = (root / "app/src/main/java/com/rabpit/backroom/MainActivity.java").read_text(encoding="utf-8")
          combat = (root / "app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt").read_text(encoding="utf-8")
          tests = (root / "app/src/test/java/com/rabpit/backroom/core/CombatRuntimeTest.kt").read_text(encoding="utf-8")

          expected = {
              "hound": 3.5, "clump": 3.5, "duller": 3.25, "deathmoth": 3.4,
              "hostile_faceling": 3.2, "false_puddle": 3.15, "paintings": 3.1,
              "smiler": 3.4, "skin-stealer": 3.25, "predatory_window": 3.1,
              "biological_pipeline": 3.0, "wretch": 3.3, "cable_mimic": 3.2,
              "the_beast_of_level_5": 3.0, "hotel_corpse_lure": 3.0,
              "jeff_the_killer": 3.0, "async_rifleman": 3.0, "copx": 3.0,
              "tam_ma_cao_minh": 4.0,
          }
          actual = {e["key"]: float(e["ratePercent"]) for e in registry["entities"]}
          assert registry["rollMode"] == "independent_per_entity"
          assert actual == expected
          for marker in (
              'rolls.put("entityRolls", perEntityRolls)',
              'thresholdRoll("entity:tam_ma_cao_minh", 10000, 400',
              'thresholdRoll("entity:jeff_the_killer", 10000, 300',
              'thresholdRoll("entity:jane_the_killer", 180000, legacyEntityPoolThresholds[level]',
              'thresholdRoll("entity:slenderman", 180000, legacyEntityPoolThresholds[level]',
              'thresholdRoll("diepMinhEncounter", 10000, 300',
              'entityAssetExists(webpAsset) ? ".webp" : ".png"',
              'case "async_rifleman":', 'case "copx":', 'case "tam_ma_cao_minh":',
          ):
              assert marker in java, marker
          assert "String[] roamingPool =" not in java
          assert 'thresholdRoll("entityEncounter", 10000, entityThresholds[level]' not in java
          assert 'Profile("async_rifleman", "ASYNC Rifleman", 150, 20, 5, 7)' in combat
          assert 'Profile("copx", "CopX", 230, 22, 8, 7)' in combat
          assert 'Profile("tam_ma_cao_minh", "Tâm Ma Cao Minh", 270, 30, 8, 10)' in combat
          assert "v2PortedEntitiesStartWithCanonicalFinalHp" in tests

          for name in ("async_rifleman.webp", "copx.webp", "tam_ma_cao_minh.webp"):
              p = root / "app/src/main/assets/entity" / name
              assert p.is_file() and p.stat().st_size > 0, name
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
