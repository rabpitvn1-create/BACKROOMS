name: Verify Companion S1c2 Binding Slice

on:
  pull_request:
    branches: [feat/companion-core-stage-s1c1]
    paths:
      - "android-apk/app/src/main/java/com/rabpit/backroom/core/companion/**"
      - "android-apk/app/src/test/java/com/rabpit/backroom/core/companion/**"
      - ".github/workflows/verify-companion-s1c2-binding.yml"

permissions:
  contents: read

jobs:
  real-core-binding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify PR branch exact source revision
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - name: Apply authoritative recursive release patch chain
        run: python3 android-apk/apply-release-patch-chain.py
      - name: Run real production Core binding + all Android JVM tests
        run: gradle -p android-apk :app:testDebugUnitTest :app:assembleDebug --no-daemon

  real-sqlite-regression:
    needs: real-core-binding-tests
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Apply authoritative recursive release patch chain
        run: python3 android-apk/apply-release-patch-chain.py
      - name: Build test APK for production SQLite path
        run: gradle -p android-apk -PcompanionStorageSmoke :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Existing companion SQLite and process kill suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 android-apk/run-companion-storage-smoke.py ${{ matrix.api }}
