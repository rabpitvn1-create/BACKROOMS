name: Materialize Entity Overlays

on:
  push:
    branches:
      - feature/async-member-entity
    paths:
      - "android-apk/entity-overlay-source.json"
      - ".github/workflows/materialize-entity-overlays.yml"

permissions:
  contents: write

concurrency:
  group: materialize-entity-overlays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact original PNG files from Drive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import urllib.request

          root = Path('.')
          manifest = json.loads((root / 'android-apk/entity-overlay-source.json').read_text(encoding='utf-8'))
          entries = manifest['entities']
          assert len(entries) == 19
          assert len({e['id'] for e in entries}) == 19
          out = root / 'android-apk/app/src/main/assets/entity_overlays'
          out.mkdir(parents=True, exist_ok=True)

          def fetch_original(file_id: str) -> bytes:
              urls = [
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t',
              ]
              errors = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                      if data.startswith(b'\x89PNG\r\n\x1a\n'):
                          return data
                      errors.append(f'{url}: not PNG ({len(data)} bytes)')
                  except Exception as exc:
                      errors.append(f'{url}: {exc}')
              raise RuntimeError('Drive download failed: ' + ' | '.join(errors))

          for entry in entries:
              data = fetch_original(entry['driveFileId'])
              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != entry['size']:
                  raise RuntimeError(f"{entry['file']}: size changed, expected {entry['size']}, got {actual_size}")
              if actual_sha != entry['sha256']:
                  raise RuntimeError(f"{entry['file']}: SHA-256 changed, expected {entry['sha256']}, got {actual_sha}")
              (out / entry['file']).write_bytes(data)
              print(f"OK {entry['file']} {actual_size} {actual_sha}")
          PY

      - name: Commit exact PNG bytes to the feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-apk/app/src/main/assets/entity_overlays
          if git diff --cached --quiet; then
            echo "Entity overlay PNGs already match the Drive originals."
            exit 0
          fi
          git commit -m "Add lossless Entity overlay PNGs"
          git push origin HEAD:${GITHUB_REF_NAME}
