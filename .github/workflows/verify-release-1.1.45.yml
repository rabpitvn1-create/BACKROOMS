name: Verify Backroom 1.1.45

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-release-1.1.45.yml"
      - "android-apk/**"

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py \
            --dataset intent_dataset.csv \
            --labels ../app/src/main/assets/models/backroom_intent_labels.txt \
            --output ../app/src/main/assets/models/backroom_intent.tflite \
            --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880 || (echo "LiteRT model exceeds 5 MiB: $bytes" && exit 1)

      - name: Apply exact release patch chain
        run: |
          python3 android-apk/patch-provider-status.py
          python3 android-apk/patch-luna-text.py
          python3 android-apk/patch-level-snapshot-backgrounds.py
          python3 android-apk/patch-snapshot-fallback.py
          python3 android-apk/patch-kai-hd-continuous.py
          python3 android-apk/patch-kai-png-preferred.py
          python3 android-apk/patch-kai-codex.py
          python3 android-apk/patch-r06-source-marker.py
          python3 android-apk/patch-drive-canon-gameplay.py
          python3 android-apk/patch-inventory-persistence.py
          python3 android-apk/patch-ai-orchestrator.py
          python3 android-apk/patch-state-op-hardening.py
          python3 android-apk/patch-gemini-health-pool.py
          python3 android-apk/patch-conditional-audit.py
          python3 android-apk/patch-audit-validated-risk.py
          python3 android-apk/patch-gameplay-parity-final.py
          python3 android-apk/patch-final-authority-hardening.py
          python3 android-apk/patch-rejected-op-repair-final.py
          python3 android-apk/patch-kai-resource-policy-final.py
          python3 android-apk/patch-provider-deadline-final.py
          python3 android-apk/patch-gemini-model-matrix-final.py
          python3 android-apk/patch-java-compile-hardening.py
          python3 android-apk/patch-save-controls-final.py
          python3 android-apk/patch-hard-mode-label.py
          python3 android-apk/patch-snapshot-unconfigured.py
          python3 android-apk/patch-game-state-core-bridge.py
          python3 android-apk/patch-character-inventory-ui.py
          python3 android-apk/patch-character-detail-avatar-fallback.py

      - name: Verify 1.1.45 and An Nhien cheat contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android-apk/app/build.gradle').read_text(encoding='utf-8')
          canon = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/AnNhienCanon.kt').read_text(encoding='utf-8')
          facade = Path('android-apk/app/src/main/java/com/rabpit/backroom/core/GameCoreFacade.kt').read_text(encoding='utf-8')
          tests = Path('android-apk/app/src/test/java/com/rabpit/backroom/core/AnNhienFollowerTest.kt').read_text(encoding='utf-8')
          assert "versionCode 47" in gradle
          assert "versionName '1.1.45'" in gradle
          assert 'PARTY_CHEAT_CODE = "/annhien1234"' in canon
          assert 'matchesPartyCheatCode(action)' in facade
          assert 'applyAnNhienPartyCheat(legacy, state)' in facade
          assert 'slashCheatInstantlyAddsAnNhienAndIsIdempotent' in tests
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin core tests and build APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -s android-apk/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-apk/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'

  verify-published:
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Release v1.1.45
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.1.45 --repo "$GITHUB_REPOSITORY"

      - name: Download published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.45 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.45.apk'
          test -s Backroom-1.1.45.apk

      - name: Verify published APK structure
        run: |
          unzip -l Backroom-1.1.45.apk | grep -q 'AndroidManifest.xml'
          unzip -l Backroom-1.1.45.apk | grep -q 'assets/index.html'
          unzip -l Backroom-1.1.45.apk | grep -q 'classes.dex'
