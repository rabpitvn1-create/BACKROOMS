name: Verify Diep Minh Boss

on:
  push:
    branches: [feat/diep-minh-boss]
    paths:
      - "android-apk/**"
      - "ENTITY_ASSETS.md"
      - ".github/workflows/verify-diep-minh-boss.yml"
      - ".github/workflows/build-backroom-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - "ENTITY_ASSETS.md"
      - ".github/workflows/verify-diep-minh-boss.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain first
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow = Path('.github/workflows/build-backroom-apk.yml').read_text(encoding='utf-8')
          scripts = re.search(r'scripts=\(([^)]+)\)', workflow).group(1).split()
          for script in scripts:
              print("==>", script)
              subprocess.run(['python3', 'android-apk/' + script], check=True)
          PY

      - name: Verify Diệp Minh contracts and final diff
        id: contracts
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          combat = (root / 'app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          test = (root / 'app/src/test/java/com/rabpit/backroom/core/CombatRuntimeTest.kt').read_text(encoding='utf-8')
          finalizer = (root / 'patch-healing-items-finalize.py').read_text(encoding='utf-8')
          asset = root / 'app/src/main/assets/entity/diep_minh.webp'

          for marker in (
              'private const val DIEP_MINH_MAX_HP = 2999',
              'private const val DIEP_MINH_ATTACK_PERCENT = 10',
              'private const val DIEP_MINH_REGEN_PER_TURN = 30',
              'private const val DIEP_MINH_ULTIMATE_INTERVAL_TURNS = 5',
              'private const val DIEP_MINH_ULTIMATE_PERCENT = 5',
              'Devils And Gold kích hoạt',
              'damageActivePartyByPercent(resolvedState, DIEP_MINH_ULTIMATE_PERCENT)',
              'percentDamage(c.playerMaxHp, DIEP_MINH_ATTACK_PERCENT)',
              'thresholdRoll("diepMinhEncounter", 10000, 100, entityEncounterAction && entityAllowed',
              'int[] entityThresholds = {100, 100, 100, 100, 100, 100, 100}',
              'entityKey = "diep_minh";',
              'case "diep_minh": name = "Diệp Minh"; break;',
              'diepMinhHasExact2999HpAndRegeneratesThirtyPerSurvivingTurn',
              'diepMinhDevilsAndGoldHitsEveryActivePartyMemberForFivePercentMaxHpOnTurnFive',
              'runpy.run_path(str(ROOT / "patch-diep-minh-boss.py"), run_name="__main__")',
          ):
              assert marker in combat + java + test + finalizer, marker

          pool = next(line for line in java.splitlines() if 'String[] roamingPool =' in line)
          assert 'diep_minh' not in pool, 'Diệp Minh must not be in shared roaming pool'
          assert asset.is_file() and asset.stat().st_size > 0
          raw = asset.read_bytes()
          assert len(raw) >= 12 and raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
          assert b'data:image' not in asset.read_bytes()[:1024]
          assert finalizer.index('patch-kai-guilty-crown-override.py') < finalizer.index('patch-diep-minh-boss.py')
          PY
          python3 android-apk/verify-four-1193a-entities.py
          git diff --check

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        id: android_build
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify all Entity WebPs are packaged as raw assets
        id: packaged_asset
        if: steps.android_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          assets = Path('android-apk/app/src/main/assets/entity')
          expected = {p.name for p in assets.glob('*.webp')}
          assert len(expected) == 24, expected
          assert "luc_tram_hac_hoa.webp" in expected, expected
          with ZipFile('android-apk/app/build/outputs/apk/debug/app-debug.apk') as apk:
              packaged = {name.removeprefix('assets/entity/') for name in apk.namelist() if name.startswith('assets/entity/') and not name.endswith('/')}
              assert packaged == expected, (packaged - expected, expected - packaged)
              for name in expected:
                  assert apk.read('assets/entity/' + name) == (assets / name).read_bytes(), name
          PY

      - name: Enforce pre-merge green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.contracts.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.packaged_asset.outcome }}" = "success"
