name: Verify Diep Minh Boss

on:
  push:
    branches: [feat/diep-minh-boss]
    paths:
      - "android-apk/**"
      - "ENTITY_ASSETS.md"
      - ".github/workflows/verify-diep-minh-boss.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - "ENTITY_ASSETS.md"
      - ".github/workflows/verify-diep-minh-boss.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain first
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify Diệp Minh contracts and final diff
        id: contracts
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          combat = (root / 'app/src/main/java/com/rabpit/backroom/core/CombatRuntime.kt').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          test = (root / 'app/src/test/java/com/rabpit/backroom/core/CombatRuntimeTest.kt').read_text(encoding='utf-8')
          finalizer = (root / 'patch-healing-items-finalize.py').read_text(encoding='utf-8')
          asset = root / 'app/src/main/assets/entity/diep_minh.png'

          for marker in (
              'private const val DIEP_MINH_MAX_HP = 2999',
              'private const val DIEP_MINH_ATTACK_PERCENT = 10',
              'private const val DIEP_MINH_REGEN_PER_TURN = 30',
              'private const val DIEP_MINH_ULTIMATE_INTERVAL_TURNS = 5',
              'private const val DIEP_MINH_ULTIMATE_PERCENT = 5',
              'Devils And Gold kích hoạt',
              'damageActivePartyByPercent(resolvedState, DIEP_MINH_ULTIMATE_PERCENT)',
              'percentDamage(c.playerMaxHp, DIEP_MINH_ATTACK_PERCENT)',
              'thresholdRoll("diepMinhEncounter", 10000, 300, entityEncounterAction && entityAllowed',
              'entityKey = "diep_minh";',
              'case "diep_minh": name = "Diệp Minh"; break;',
              'diepMinhHasExact2999HpAndRegeneratesThirtyPerSurvivingTurn',
              'diepMinhDevilsAndGoldHitsEveryActivePartyMemberForFivePercentMaxHpOnTurnFive',
              'runpy.run_path(str(ROOT / "patch-diep-minh-boss.py"), run_name="__main__")',
          ):
              assert marker in combat + java + test + finalizer, marker

          pool = next(line for line in java.splitlines() if 'String[] roamingPool =' in line)
          assert 'diep_minh' not in pool, 'Diệp Minh must not be in shared roaming pool'
          assert asset.is_file() and asset.stat().st_size > 0
          assert asset.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          assert b'data:image' not in asset.read_bytes()[:1024]
          assert finalizer.index('patch-kai-guilty-crown-override.py') < finalizer.index('patch-diep-minh-boss.py')
          PY
          git diff --check

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        id: android_build
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify boss PNG is packaged as a raw asset
        id: packaged_asset
        if: steps.android_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          unzip -l android-apk/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/entity/diep_minh.png'

      - name: Enforce pre-merge green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.contracts.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.packaged_asset.outcome }}" = "success"
