name: Release Backroom 1.1.67

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-backroom-1.1.67.yml"
  push:
    branches: [main, release/1.1.67]
    paths:
      - ".github/workflows/release-backroom-1.1.67.yml"

permissions:
  contents: write

concurrency:
  group: release-backroom-1.1.67-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Apply complete Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Stamp 1.1.67 package version
        run: |
          set -euo pipefail
          sed -i "s/versionCode 65/versionCode 69/" android-apk/app/build.gradle
          sed -i "s/versionName '1.1.63'/versionName '1.1.67'/" android-apk/app/build.gradle
          grep -q "versionCode 69" android-apk/app/build.gradle
          grep -q "versionName '1.1.67'" android-apk/app/build.gradle

      - name: Verify final runtime contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          combat = (core / 'CombatRuntime.kt').read_text(encoding='utf-8')
          combat_test = (root / 'app/src/test/java/com/rabpit/backroom/core/CombatRuntimeTest.kt').read_text(encoding='utf-8')
          chain = (root / 'patch-unified-entity-spawn-pool.py').read_text(encoding='utf-8')
          rest_chain = (root / 'patch-combat-action-bar-state-fix.py').read_text(encoding='utf-8')
          john_asset = root / 'app/src/main/assets/entity/John.png'

          assert "versionCode 69" in gradle
          assert "versionName '1.1.67'" in gradle

          fixed = "function combatActive(){return !!(typeof state!=='undefined'&&state&&state.combat&&state.combat.active===true);}"
          legacy = "function combatActive(){return !!(window.state&&state.combat&&state.combat.active===true);}"
          assert fixed in html and legacy not in html
          assert 'TẤN CÔNG' in html and 'NÉ TRÁNH' in html and 'BỎ CHẠY' in html
          assert 'patch-rest-physiology-state-finalize.py' in rest_chain

          combined = combat + java + combat_test
          for marker in (
              'private const val JOHN_DOE_KEY = "john_doe"',
              'private const val JOHN_DOE_MAX_HP = 1234',
              'private const val JOHN_DOE_ATTACK_PERCENT = 6',
              'private const val JOHN_DOE_REGEN_PER_TURN = 30',
              'private const val JOHN_DOE_POISON_INTERVAL_TURNS = 3',
              'private const val JOHN_DOE_POISON_CHANCE_PERCENT = 50',
              'private const val JOHN_DOE_POISON_DAMAGE_PERCENT = 4',
              'private const val JOHN_DOE_STUN_INTERVAL_TURNS = 2',
              'private const val JOHN_DOE_STUN_GATE_PERCENT = 30',
              'private const val JOHN_DOE_STUN_PROC_PERCENT = 20',
              'damageJohnDoePoisoned(resolvedState, JOHN_DOE_POISON_DAMAGE_PERCENT)',
              'John Doe Stun: Kai bị Stun',
              'John Doe tấn công: Kai -$damage HP',
              'thresholdRoll("johnDoeEncounter", 10000, 1000',
              'johnDoeLevel >= 0 && johnDoeLevel <= 999',
              'case "john_doe": name = "John Doe"; break;',
              '"john_doe".equals(entityKey) ? "John.png"',
              'johnDoeHasExactHpAndThirtyRegen',
              'johnDoePoisonTracksAffectedPartyMembersSeparatelyAndTicksFourPercent',
              'johnDoeStunUsesThirtyThenTwentyPercentAndBlocksOnlyTargetForOneTurn',
          ):
              assert marker in combined, marker

          assert 'JOHN_DOE_STUN_DAMAGE' not in combat
          assert 'JOHN_DOE_KEY -> JOHN_DOE_REGEN_PER_TURN' in combat
          assert 'JOHN_DOE_KEY -> JOHN_DOE_MAX_HP' in combat
          assert 'data:image' not in java.lower()
          assert 'base64,' not in java.lower()

          monster_marker = 'runpy.run_path(str(ROOT / "patch-monster-x-entity.py"), run_name="__main__")'
          john_marker = 'runpy.run_path(str(ROOT / "patch-john-doe-entity.py"), run_name="__main__")'
          assert monster_marker in chain and john_marker in chain
          assert chain.index(monster_marker) < chain.index(john_marker)

          assert john_asset.is_file() and john_asset.stat().st_size > 0
          raw = john_asset.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          assert b'data:image' not in raw[:1024].lower()
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.67.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          APK=Backroom-1.1.67.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='69'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='1.1.67'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          rm -rf apk-check && mkdir apk-check
          unzip -q "$APK" 'assets/index.html' 'assets/entity/John.png' -d apk-check
          test -s apk-check/assets/entity/John.png
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('apk-check/assets/entity/John.png').read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          assert b'data:image' not in raw[:1024].lower()
          PY
          grep -q "typeof state!='undefined'\|typeof state!==\x27undefined\x27" apk-check/assets/index.html || grep -q "typeof state!=='undefined'" apk-check/assets/index.html
          grep -q 'TẤN CÔNG' apk-check/assets/index.html
          grep -q 'NÉ TRÁNH' apk-check/assets/index.html
          grep -q 'BỎ CHẠY' apk-check/assets/index.html

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.67-debug-apk
          path: Backroom-1.1.67.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.1.67
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          Backroom 1.1.67 Debug

          - Thêm ENTITY John Doe với HP 1234 và đòn đánh gây đúng 6% Max HP của mục tiêu.
          - John Doe có Poison toàn đội: kiểm tra 50% mỗi 3 lượt, lưu trạng thái riêng cho từng thành viên và gây 4% Max HP mỗi lượt cho từng mục tiêu đang bị ảnh hưởng.
          - John Doe có Stun hai tầng: mỗi 2 lượt kiểm tra cổng 30%, sau đó proc Stun 20%; mục tiêu bị Stun mất đúng 1 lượt và không có sát thương 20% phát sinh ngoài mô tả.
          - John Doe hồi 30 HP sau mỗi turn, không vượt 1234 HP.
          - John Doe có encounter riêng 10% và roaming trên Level 0-999.
          - Snapshot/overlay dùng trực tiếp raw asset assets/entity/John.png; không dùng Base64 hoặc Data URI.
          - Giữ nguyên Monster X, Diệp Minh, Party Combat, Combat Action Bar, rest/sleep state, inventory authority, follower systems và các cơ chế đã có.
          EOF
          gh release create v1.1.67 Backroom-1.1.67.apk --target "$GITHUB_SHA" --title "Backroom 1.1.67 Debug" --notes-file release-notes.txt

      - name: Verify published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.67-verified.apk
          gh release download v1.1.67 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.67.apk' --output Backroom-1.1.67-verified.apk
          test -s Backroom-1.1.67-verified.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.67-verified.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.67-verified.apk | grep -q "versionCode='69'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.67-verified.apk | grep -q "versionName='1.1.67'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.67-verified.apk
