name: Verify Novel Asset Canon

on:
  push:
    branches: [feat/novel-asset-canon-full-registry]
  pull_request:
    paths:
      - 'android-apk/**'
      - '.github/workflows/verify-novel-asset-canon.yml'

permissions:
  contents: read

jobs:
  verify-canon-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 11 source documents
        run: python3 android-apk/build-novel-asset-canon-index.py --check
      - name: Apply release runtime patches before compilation
        run: |
          set -euo pipefail
          python3 android-apk/apply-release-patch-chain.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify complete JVM suite and assemble debug APK
        run: gradle -p android-apk :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify all 11 canon sources packaged into APK
        run: python3 android-apk/verify-novel-asset-apk.py android-apk/app/build/outputs/apk/debug/app-debug.apk
      - name: Show failed test detail
        if: failure()
        run: |
          for report in android-apk/app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
