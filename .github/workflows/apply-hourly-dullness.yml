name: Apply hourly Dullness continuity

on:
  push:
    branches: [story/hourly-main-dullness]
    paths:
      - 'android-apk/apply-hourly-dullness.py'
      - '.github/workflows/apply-hourly-dullness.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/hourly-main-dullness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exactly one continuity step
        run: python android-apk/apply-hourly-dullness.py
      - name: Validate JSON and one-step route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('android-apk/app/src/main/assets/campaign_story/hourly-story-evolution.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['completedSteps'] == d['sequence'][:len(d['completedSteps'])]
          assert d['completedSteps'][-1] == 'Dullness'
          assert d['nextStep'] == 'Red Rooms'
          assert set(d['steps']['Dullness']) == {'phase','storyUpdate','survivalFocus','npcPolicy','itemPolicy','relationshipStage','endingState'}
          PY
      - name: Commit generated story ledger
        run: |
          if git diff --quiet -- android-apk/app/src/main/assets/campaign_story/hourly-story-evolution.json; then
            echo 'No ledger change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-apk/app/src/main/assets/campaign_story/hourly-story-evolution.json
          git commit -m 'Advance hourly story to Dullness'
          git push origin HEAD:story/hourly-main-dullness
