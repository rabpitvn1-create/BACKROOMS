name: Verify Combat 1.1.93a Port
on:
  pull_request:
    branches: [main]
    paths: ['android-apk/**', '.github/workflows/verify-combat-93-port.yml']
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test imported combat mechanics
        run: |
          mkdir -p /tmp/combat93-jars /tmp/combat93-classes
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/combat93-jars/json.jar
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o /tmp/combat93-jars/junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o /tmp/combat93-jars/hamcrest.jar
          javac -cp '/tmp/combat93-jars/*' -d /tmp/combat93-classes android-apk/app/src/main/java/com/rabpit/backroom/core/{CombatChoiceEngine,Combat93Support,EntityStatCore,TurnRng}.java android-apk/app/src/test/java/com/rabpit/backroom/core/{Combat93EngineTest,LucTramEntityTest}.java
          java -cp '/tmp/combat93-classes:/tmp/combat93-jars/*' org.junit.runner.JUnitCore com.rabpit.backroom.core.Combat93EngineTest com.rabpit.backroom.core.LucTramEntityTest
  core-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply the release runtime patch chain
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          workflow = Path('.github/workflows/build-backroom-apk.yml').read_text()
          scripts = re.search(r'scripts=\(([^)]+)\)', workflow).group(1).split()
          for script in scripts:
              subprocess.run(['python3', str(Path('android-apk') / script)], check=True)
          PY
      - name: Test save, HP, actor turns, and reward boundaries
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --tests 'com.rabpit.backroom.core.Combat93*' --tests 'com.rabpit.backroom.core.LucTram*' --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium presentation test runtime
        run: |
          npm install --prefix /tmp/combat93-browser playwright@1.58.2
          /tmp/combat93-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual WebView HTML in Chromium
        env:
          NODE_PATH: /tmp/combat93-browser/node_modules
        run: node android-apk/tests/combat93-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat93-chromium-preview
          path: android-apk/app/build/combat93-preview/*.png
          if-no-files-found: ignore
