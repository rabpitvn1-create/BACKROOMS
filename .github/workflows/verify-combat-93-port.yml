name: Verify Combat 1.1.93a Port
on:
  pull_request:
    branches: [main]
    paths: ['android-apk/**', '.github/workflows/verify-combat-93-port.yml']
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test imported combat mechanics
        run: |
          mkdir -p /tmp/combat93-jars /tmp/combat93-classes
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/combat93-jars/json.jar
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o /tmp/combat93-jars/junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o /tmp/combat93-jars/hamcrest.jar
          javac -cp '/tmp/combat93-jars/*' -d /tmp/combat93-classes android-apk/app/src/main/java/com/rabpit/backroom/core/{CombatChoiceEngine,Combat93Support,EntityStatCore,TurnRng}.java android-apk/app/src/test/java/com/rabpit/backroom/core/Combat93EngineTest.java
          java -cp '/tmp/combat93-classes:/tmp/combat93-jars/*' org.junit.runner.JUnitCore com.rabpit.backroom.core.Combat93EngineTest
