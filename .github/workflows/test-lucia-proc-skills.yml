name: Test Lucia Proc Skills

on:
  push:
    branches:
      - feature/lucia-proc-skills-turn5
    paths:
      - "android-apk/**"
      - ".github/workflows/test-lucia-proc-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/patch-lucia-proc-skills-final.py"
      - "android-apk/patch-character-detail-avatar-fallback.py"
      - ".github/workflows/test-lucia-proc-skills.yml"

permissions:
  contents: read

jobs:
  lucia-proc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Lucia finalizer
        run: python3 -m py_compile android-apk/patch-lucia-proc-skills-final.py

      - name: Apply exact Android release patch chain
        run: |
          python3 android-apk/patch-provider-status.py
          python3 android-apk/patch-luna-text.py
          python3 android-apk/patch-level-snapshot-backgrounds.py
          python3 android-apk/patch-snapshot-fallback.py
          python3 android-apk/patch-kai-hd-continuous.py
          python3 android-apk/patch-kai-png-preferred.py
          python3 android-apk/patch-kai-codex.py
          python3 android-apk/patch-r06-source-marker.py
          python3 android-apk/patch-drive-canon-gameplay.py
          python3 android-apk/patch-inventory-persistence.py
          python3 android-apk/patch-ai-orchestrator.py
          python3 android-apk/patch-state-op-hardening.py
          python3 android-apk/patch-gemini-health-pool.py
          python3 android-apk/patch-conditional-audit.py
          python3 android-apk/patch-audit-validated-risk.py
          python3 android-apk/patch-gameplay-parity-final.py
          python3 android-apk/patch-final-authority-hardening.py
          python3 android-apk/patch-rejected-op-repair-final.py
          python3 android-apk/patch-kai-resource-policy-final.py
          python3 android-apk/patch-provider-deadline-final.py
          python3 android-apk/patch-gemini-model-matrix-final.py
          python3 android-apk/patch-java-compile-hardening.py
          python3 android-apk/patch-save-controls-final.py
          python3 android-apk/patch-hard-mode-label.py
          python3 android-apk/patch-snapshot-unconfigured.py
          python3 android-apk/patch-game-state-core-bridge.py
          python3 android-apk/patch-character-inventory-ui.py
          python3 android-apk/patch-character-detail-avatar-fallback.py

      - name: Verify Lucia generated contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          java = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          combat = (core / 'CombatCore.kt').read_text(encoding='utf-8')
          continuity = (core / 'StoryCompanionContinuity.kt').read_text(encoding='utf-8')
          serializer = (core / 'CharacterDetailJson.kt').read_text(encoding='utf-8')
          db = json.loads((root / 'app/src/main/assets/knowledge/knowledge_db.json').read_text(encoding='utf-8'))

          assert 'state.optInt("turn", 1) >= 6' in java
          assert 'mandatory after 5 completed turns' in java
          assert '!(level == 0 && !luciaEncountered(state))' in java
          assert 'lootThreshold + 500' in java
          assert 'LUCIA_MIN_COMPLETED_TURNS = 5' in continuity
          assert 'canMaterializeLucia(currentLevel: Int, completedTurns: Int' in continuity

          assert 'LUCIA_PROC_SKILLS_PATCHED' in combat
          assert 'object LuciaSkillBook' in combat
          assert '"Trinh sát chiến trường"' in combat
          assert '"Kỷ luật hỏa lực"' in combat
          assert '"M4A1 Full Auto Burst"' in combat
          assert '"Too Young To Die"' in combat
          assert 'fullAutoEligible(actor.luciaTurnsTaken)' in combat
          assert 'tooYoungToDieChance(actor.stats)' in combat
          assert 'resolveLuciaAction(actor, enemy, timeline)' in combat
          assert 'KaiSkillBook.skillsFor(character.id) + LuciaSkillBook.skillsFor(character.id)' in serializer

          records = {r['id']: r for r in db['records']}
          assert 'CHAR.LUCIA.SKILLS_PROC' in records
          assert 'Five gameplay turns must complete first' in records['STORY.LUCIA.LEVEL0_FIXED_ENCOUNTER']['text']
          assert records['CHAR.LUCIA.SKILLS_PROC']['authority'] == 'USER_RETCON'
          PY

      - name: Check generated diff
        run: git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
