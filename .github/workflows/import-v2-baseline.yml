name: Import BACKROOMsV2 Baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-v2-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-backroomsv2-baseline
  cancel-in-progress: false

jobs:
  import-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned BACKROOMsV2 source
        run: |
          set -euo pipefail
          V2_SHA='93f89028e6b501857d8615373fd833d26e234f29'
          git clone --filter=blob:none --no-checkout https://github.com/rabpitvn1-create/BACKROOMsV2.git /tmp/backroomsv2
          git -C /tmp/backroomsv2 fetch --depth=1 origin "$V2_SHA"
          git -C /tmp/backroomsv2 checkout --detach "$V2_SHA"
          test "$(git -C /tmp/backroomsv2 rev-parse HEAD)" = "$V2_SHA"

      - name: Replace legacy Android subtree with V2
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/backroomsv2/android-apk/ android-apk/
          diff -qr /tmp/backroomsv2/android-apk android-apk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify imported V2 baseline
        run: |
          set -euo pipefail
          test -z "$(find android-apk/app/src -type f -name '*.kt' -print -quit)"
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/ItemCore.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/CombatChoiceEngine.java
          test -s android-apk/app/src/main/java/com/rabpit/backroom/core/EntityCore.java
          test -s android-apk/app/src/main/assets/inventory-ui.js
          test -s android-apk/app/src/main/assets/gm-choice-ui.js
          ! grep -R -n -E 'MadGod|madgod|AN_NHIEN|AnNhien|annhien' android-apk/app/src/main android-apk/app/src/test
          node --check android-apk/app/src/main/assets/inventory-ui.js
          node --check android-apk/app/src/main/assets/gm-choice-ui.js
          node --check android-apk/app/src/main/assets/player-action-ui.js
          node --test android-apk/tests/inventory-ui.test.cjs android-apk/tests/gm-choice-ui.test.cjs android-apk/tests/poker-dice-ui.test.cjs
          cd android-apk
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Commit verified V2 baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A android-apk
          if git diff --cached --quiet; then
            echo 'Android subtree already matches the pinned V2 baseline.'
            exit 0
          fi
          git commit -m 'Replace legacy Android runtime with V2 baseline'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
