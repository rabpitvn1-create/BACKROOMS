name: Refresh Level 0 originals on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-level0:
    if: github.head_ref == 'codex/level0-original-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/level0-original-quality
      - name: Fetch exact Drive originals and commit final snapshot state
        shell: bash
        run: bash android-apk/one-shot-refresh-level0-v2.sh
