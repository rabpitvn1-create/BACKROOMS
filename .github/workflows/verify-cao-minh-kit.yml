name: Verify Cao Minh Skills and Equipment

on:
  push:
    branches: [feat/cao-minh-skills-equipment, feat/cao-minh-prologue]
    paths:
      - 'android-apk/**'
      - '.github/workflows/verify-cao-minh-kit.yml'
      - '.github/workflows/build-backroom-apk.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release patch chain and verify final contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow = Path('.github/workflows/build-backroom-apk.yml').read_text()
          scripts = re.search(r'scripts=\((.*?)\)', workflow).group(1).split()
          for script in scripts:
              subprocess.run(['python3', 'android-apk/' + script], check=True)
          contracts = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S).group(1)
          import textwrap
          exec(compile(textwrap.dedent(contracts), 'release-runtime-contracts', 'exec'))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests and build APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cao-minh-test-reports
          path: android-apk/app/build/reports/tests/testDebugUnitTest
