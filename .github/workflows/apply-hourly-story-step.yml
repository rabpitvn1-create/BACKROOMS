name: Apply hourly story step
on:
  push:
    branches:
      - story/hourly-main-0-8-r01
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply 0.8 continuity step
        run: python android-apk/apply-hourly-story-step.py
      - name: Remove one-shot helper and commit ledger
        run: |
          rm android-apk/apply-hourly-story-step.py
          rm .github/workflows/apply-hourly-story-step.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Advance hourly story to 0.8 Inundation"
          git push
