name: Cleanup stale Actions history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-stale-actions-history.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete stale workflow run histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          targets=(
            "Regenerate trusted Backrooms snapshots"
            "Release Backroom 1.3"
            "Release Backroom 1.3.1"
            "Test Android Game Core"
          )

          for target in "${targets[@]}"; do
            echo "Cleaning workflow history: $target"
            ids="$({ gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" || true; } | jq -r --arg target "$target" '.workflow_runs[]? | select(.name == $target) | .id')"
            deleted=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              [ "$id" != "$GITHUB_RUN_ID" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
              deleted=$((deleted + 1))
            done <<< "$ids"
            echo "Deleted $deleted run(s) for $target"
          done

      - name: Remove one-shot cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=".github/workflows/cleanup-stale-actions-history.yml"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='Remove one-shot stale Actions cleanup workflow' \
            -f sha="$sha" \
            -f branch='main'
