name: Repair Drive canon clean prologue

on:
  push:
    branches:
      - cleanup/remove-legacy-dinner-noclip

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-dinner-noclip

      - name: Adapt Drive canon patch
        run: python android-apk/repair_drive_canon_patch_for_clean_prologue.py

      - name: Commit patch repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Adapt Drive canon patch to clean prologue"
          git push origin HEAD:cleanup/remove-legacy-dinner-noclip
