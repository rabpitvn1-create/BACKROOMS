name: TEMP Cleanup workflow runs older than 2 days

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE_WORKFLOW_RUNS_OLDER_THAN_2_DAYS to permanently delete old Actions runs"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DELETE_WORKFLOW_RUNS_OLDER_THAN_2_DAYS" ]; then
            echo "::error::Confirmation text does not match. Nothing was deleted."
            exit 1
          fi

      - name: Collect workflow runs older than 2 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/actions/runs?per_page=100"             --jq '.workflow_runs[] | [.id, .name, .created_at, .status, .conclusion] | @tsv'             > all-workflow-runs.tsv

          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=2)
          targets = []

          for raw in Path("all-workflow-runs.tsv").read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              run_id, name, created_at, status, conclusion = raw.split("\t", 4)
              created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if created < cutoff:
                  targets.append((created, run_id, name, status, conclusion))

          targets.sort()
          Path("targets.tsv").write_text(
              "".join(
                  f"{run_id}\t{created.isoformat()}\t{name}\t{status}\t{conclusion}\n"
                  for created, run_id, name, status, conclusion in targets
              ),
              encoding="utf-8",
          )

          print(f"UTC cutoff: {cutoff.isoformat()}")
          print(f"Matched {len(targets)} workflow run(s).")
          PY

          {
            echo "### Workflow runs scheduled for deletion"
            echo
            echo "Cutoff: runs created more than 2 days before this job starts."
            echo
            if [ -s targets.tsv ]; then
              echo "| Run ID | Created | Workflow | Status | Conclusion |"
              echo "| --- | --- | --- | --- | --- |"
              awk -F '\t' '{printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5}' targets.tsv
            else
              echo "No matching workflow runs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Permanently delete matching workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ ! -s targets.tsv ]; then
            echo "No workflow runs older than 2 days; nothing to delete."
            exit 0
          fi

          failures=0
          while IFS=$'\t' read -r run_id created_at name status conclusion; do
            [ -n "$run_id" ] || continue
            echo "Deleting run $run_id ($name, $created_at)"
            if ! gh api --method DELETE "repos/$REPO/actions/runs/$run_id"; then
              echo "::error::Failed to delete workflow run $run_id"
              failures=$((failures + 1))
            fi
          done < targets.tsv

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures workflow run(s) could not be deleted."
            exit 1
          fi

      - name: Verify cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/actions/runs?per_page=100"             --jq '.workflow_runs[] | [.id, .created_at] | @tsv'             > remaining-workflow-runs.tsv

          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=2)
          remaining = []

          for raw in Path("remaining-workflow-runs.tsv").read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              run_id, created_at = raw.split("\t", 1)
              created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if created < cutoff:
                  remaining.append((created_at, run_id))

          if remaining:
              sample = ", ".join(run_id for _, run_id in remaining[:20])
              raise SystemExit(
                  f"Cleanup incomplete; {len(remaining)} run(s) older than 2 days remain. "
                  f"Sample run IDs: {sample}"
              )

          print("Verified: no workflow runs older than 2 days remain.")
          PY
