name: Verify Backroom 1.1.42 Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-release-1.1.42.yml"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.42 --repo "$GITHUB_REPOSITORY"

      - name: Download published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.42 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.42.apk'
          test -s Backroom-1.1.42.apk

      - name: Verify published APK structure and UX contracts
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          apk = Path('Backroom-1.1.42.apk')
          assert apk.stat().st_size > 0
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'assets/index.html' in names
              assert 'assets/avatars/kai_avatar.png' in names
              assert any(name.startswith('classes') and name.endswith('.dex') for name in names)
              html = z.read('assets/index.html').decode('utf-8')

          required = [
              'id="characterSurvivalHud"',
              "survivalMeter('🥩'",
              "survivalMeter('💧'",
              "survivalMeter('Zzz'",
              'foodPercent',
              'waterPercent',
              'restPercent',
              '.message.gm{',
              'focusLatestGmStart()',
              "querySelectorAll('.message.gm')",
              'getBoundingClientRect().top-logEl.getBoundingClientRect().top+logEl.scrollTop',
              '#characterEquipmentList span,#characterInventoryItems span{text-transform:uppercase',
          ]
          for token in required:
              assert token in html, token
          assert "physiology:{hunger:'NORMAL',thirst:'NORMAL',sleepDeprivation:'NORMAL',foodPercent:100,waterPercent:100,restPercent:100}" in html
          print('Published Backroom-1.1.42.apk contains the survival HUD and chat UX contracts.')
          PY
