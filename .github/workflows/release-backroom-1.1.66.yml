name: Release Backroom 1.1.66

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-backroom-1.1.66.yml"
  push:
    branches: [main, release/1.1.66]
    paths:
      - ".github/workflows/release-backroom-1.1.66.yml"

permissions:
  contents: write

concurrency:
  group: release-backroom-1.1.66-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-apk/ml/requirements.txt

      - name: Train and verify tiny LiteRT intent model
        run: |
          set -euo pipefail
          python -m pip install --requirement android-apk/ml/requirements.txt
          python android-apk/ml/build_intent_dataset.py
          python android-apk/ml/evaluate_seed_classifier.py
          cd android-apk/ml
          python train_intent_classifier.py --dataset intent_dataset.csv --labels ../app/src/main/assets/models/backroom_intent_labels.txt --output ../app/src/main/assets/models/backroom_intent.tflite --report intent_model_report.json
          test -s ../app/src/main/assets/models/backroom_intent.tflite
          bytes=$(stat -c%s ../app/src/main/assets/models/backroom_intent.tflite)
          test "$bytes" -le 5242880

      - name: Validate Game Master configuration
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 LUNA_API_KEY LUNA_MODEL; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done

      - name: Apply complete Android runtime patch chain
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Stamp 1.1.66 package version
        run: |
          set -euo pipefail
          sed -i "s/versionCode 65/versionCode 68/" android-apk/app/build.gradle
          sed -i "s/versionName '1.1.63'/versionName '1.1.66'/" android-apk/app/build.gradle
          grep -q "versionCode 68" android-apk/app/build.gradle
          grep -q "versionName '1.1.66'" android-apk/app/build.gradle

      - name: Verify final runtime contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          html = (root / 'app/src/main/assets/index.html').read_text(encoding='utf-8')
          turn = (core / 'TurnCoordinator.kt').read_text(encoding='utf-8')
          policy = (core / 'RestActionPolicy.kt').read_text(encoding='utf-8')
          rest_test = (root / 'app/src/test/java/com/rabpit/backroom/core/RestActionPolicyTest.kt').read_text(encoding='utf-8')
          chain = (root / 'patch-combat-action-bar-state-fix.py').read_text(encoding='utf-8')
          assert "versionCode 68" in gradle
          assert "versionName '1.1.66'" in gradle
          fixed = "function combatActive(){return !!(typeof state!=='undefined'&&state&&state.combat&&state.combat.active===true);}"
          legacy = "function combatActive(){return !!(window.state&&state.combat&&state.combat.active===true);}"
          assert fixed in html and legacy not in html
          assert 'TẤN CÔNG' in html and 'NÉ TRÁNH' in html and 'BỎ CHẠY' in html
          assert 'patch-rest-physiology-state-finalize.py' in chain
          assert 'patch-two-page-swipe-ui.py' in chain
          assert 'RestActionPolicy.targets(state, pending.input)' in turn
          assert 'val authoritativeCommands = commands + restCommands' in turn
          assert 'StateReducer.executeAll(executing, authoritativeCommands)' in turn
          assert 'PhysiologyCommand.Operation.RECORD_SLEEP' in turn
          assert 'object RestActionPolicy' in policy
          assert 'coordinatorCommitsTimeThenKaiSleepRecoveryAtomically' in rest_test
          assert 'coordinatorSharedShiftRestRecoversKaiAndLucia' in rest_test
          PY
          python3 android-apk/verify-two-page-swipe-ui.py android-apk/app/src/main/assets/index.html
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Kotlin tests and build debug APK
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Backroom-1.1.66.apk

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          APK=Backroom-1.1.66.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.rabpit.backroom'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionCode='68'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='1.1.66'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "launchable-activity: name='com.rabpit.backroom.MainActivity'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          rm -rf apk-check && mkdir apk-check
          unzip -q "$APK" 'assets/index.html' -d apk-check
          grep -q "typeof state!='undefined'\|typeof state!==\x27undefined\x27" apk-check/assets/index.html || grep -q "typeof state!=='undefined'" apk-check/assets/index.html
          grep -q 'TẤN CÔNG' apk-check/assets/index.html
          grep -q 'NÉ TRÁNH' apk-check/assets/index.html
          grep -q 'BỎ CHẠY' apk-check/assets/index.html
          python3 android-apk/verify-two-page-swipe-ui.py apk-check/assets/index.html

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backroom-1.1.66-debug-apk
          path: Backroom-1.1.66.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or refresh GitHub Release v1.1.66
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.1.66
          TITLE="Backroom 1.1.66 Debug"
          cat > release-notes.txt <<'EOF'
          Backroom 1.1.66 Debug

          - Chia giao diện thành hai trang GAME và STATUS độc lập theo chiều dọc; vuốt ngang để chuyển trang nhưng vẫn dùng chung một Game State.
          - Giữ vị trí cuộn riêng của từng trang; chặn swipe bắt đầu trên ô nhập, nút, Party card, Character Detail, Equipment Detail và Skills overlay.
          - STATUS sắp Party trước Save / Load để phần quản lý nhân vật nằm trước thao tác lưu game.
          - Sửa state nghỉ/ngủ: hành động sleep/rest hợp lệ commit RECORD_SLEEP vào Game State Core sau khi thời gian trôi.
          - Kai nghỉ một mình chỉ cập nhật Kai; nghỉ chia ca/cả nhóm cập nhật đúng các follower ACTIVE liên quan.
          - Character Detail không còn tình trạng narration nói đã nghỉ nhưng thanh Ngủ tiếp tục giảm.
          - Combat Action Bar vẫn đổi đúng sang TẤN CÔNG / NÉ TRÁNH / BỎ CHẠY khi Entity encounter đang active.
          - Giữ nguyên inventory authority, combat mechanics, follower systems, canon và các chức năng hiện có.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release-notes.txt
            gh release upload "$TAG" Backroom-1.1.66.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Backroom-1.1.66.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.txt
          fi

      - name: Verify published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f Backroom-1.1.66-verified.apk
          gh release download v1.1.66 --repo "$GITHUB_REPOSITORY" --pattern 'Backroom-1.1.66.apk' --output Backroom-1.1.66-verified.apk
          test -s Backroom-1.1.66-verified.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Backroom-1.1.66-verified.apk
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.66-verified.apk | grep -q "versionCode='68'"
          "$BUILD_TOOLS/aapt" dump badging Backroom-1.1.66-verified.apk | grep -q "versionName='1.1.66'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Backroom-1.1.66-verified.apk

      - name: Remove older Backroom GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=v1.1.66
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in
              v1.1.[0-9]|v1.1.[0-9][0-9])
                if [ "$tag" != "$CURRENT" ]; then
                  echo "Deleting obsolete release $tag (tag retained)"
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
                fi
                ;;
            esac
          done
