name: Combat Android emulator Level 0 to Zenith Station

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/scripts/combat-emulator-*"
      - ".github/workflows/combat-emulator-level0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-combat-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      EMULATOR_MAX_MINUTES: "12"
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build emulator debug APK and run targeted JVM tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Enable and diagnose Linux KVM acceleration
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          {
            echo "Kernel $(uname -r)"
            ls -l /dev/kvm || true
            grep -E '(vmx|svm)' /proc/cpuinfo | head -n 1 || true
          } | tee emulator-evidence/host-virtualization.txt
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This GitHub runner has no /dev/kvm. Android emulator cannot run with reliable hardware acceleration."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "KVM permissions ready" | tee -a emulator-evidence/host-virtualization.txt
      - name: Boot Android emulator and exercise genuine game progression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/combat-emulator-level0.sh
      - name: Preserve emulator screenshot, progress and crash evidence
        if: always()
        timeout-minutes: 2
        run: |
          set +e
          mkdir -p emulator-evidence
          echo "Workflow: $GITHUB_WORKFLOW, run $GITHUB_RUN_ID, SHA $GITHUB_SHA" > emulator-evidence/workflow-context.txt
          timeout -k 2s 8s adb devices -l > emulator-evidence/adb-devices.txt 2>&1
          timeout -k 2s 10s adb logcat -d -b crash > emulator-evidence/android-crash.txt 2>&1
          timeout -k 2s 10s adb logcat -d -t 1500 > emulator-evidence/android-recent-logcat.txt 2>&1
          timeout -k 2s 5s df -h > emulator-evidence/disk.txt 2>&1
          echo "evidence collection completed (ADB may have disconnected)"

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: android-emulator-combat-level0-evidence
          path: emulator-evidence/
          retention-days: 7
