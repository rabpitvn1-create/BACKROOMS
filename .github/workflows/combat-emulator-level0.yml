name: Combat Android emulator Level 0 to Zenith Station

on:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/scripts/combat-emulator-*"
      - ".github/workflows/combat-emulator-level0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-combat-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMULATOR_MAX_MINUTES: "30"
      GEHIHI_API_KEY: ${{ secrets.GEHIHI_API_KEY }}
      GEHIHI_BASE_URL: ${{ secrets.GEHIHI_BASE_URL || vars.GEHIHI_BASE_URL }}
      GEHIHI_MODEL: ${{ secrets.GEHIHI_MODEL || vars.GEHIHI_MODEL }}
      SOL_API_KEY: ${{ secrets.SOL_API_KEY }}
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      HAKU_BASE_URL: ${{ secrets.HAKU_BASE_URL || vars.HAKU_BASE_URL }}
      HAKU_MODEL: ${{ secrets.HAKU_MODEL || vars.HAKU_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build emulator debug APK and run targeted JVM tests
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Boot Android emulator and exercise genuine game progression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/combat-emulator-level0.sh
      - name: Preserve emulator screenshot, progress and crash evidence
        if: always()
        run: |
          mkdir -p emulator-evidence
          adb logcat -d -b crash > emulator-evidence/android-crash.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-combat-level0-evidence
          path: emulator-evidence/
          retention-days: 7
