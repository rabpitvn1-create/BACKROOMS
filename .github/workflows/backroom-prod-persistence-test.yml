name: backroom-prod-persistence-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exercise production canon save/load
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://backroom-rose.vercel.app'
          COOKIE="$RUNNER_TEMP/backroom.cookies"
          INITIAL="$RUNNER_TEMP/initial.json"
          RESET="$RUNNER_TEMP/reset.json"
          FINAL="$RUNNER_TEMP/final.json"
          REOPEN="$RUNNER_TEMP/reopen.json"

          # A Git push and Vercel deployment are asynchronous. Wait until the canon-enabled app owns production.
          for TRY in $(seq 1 36); do
            STATUS="$(curl -sS -o "$INITIAL" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "$BASE/api/game-state" || true)"
            if [ "$STATUS" = '200' ] && jq -e '.state.canonLoaded == true and .state.turn >= 9' "$INITIAL" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          jq -e '.state.canonLoaded == true and .state.turn >= 9' "$INITIAL" >/dev/null

          OLD_REV="$(jq -r '.state.revision' "$INITIAL")"

          curl --fail-with-body -sS -c "$COOKIE" -b "$COOKIE" \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/game-state" \
            --data '{"reset":true}' -o "$RESET"

          BASE_TURN="$(jq -r '.state.turn' "$RESET")"
          jq -e '.state.canonLoaded == true' "$RESET" >/dev/null
          jq -e '.state.location | contains("Level 0")' "$RESET" >/dev/null

          for N in 1 2 3; do
            OUT="$RUNNER_TEMP/turn-$N.json"
            EXPECTED=$((BASE_TURN + N))
            curl --fail-with-body -sS -c "$COOKIE" -b "$COOKIE" \
              -H 'Content-Type: application/json' \
              -X POST "$BASE/api/game-turn" \
              --data "{\"action\":\"Kai kiểm tra khu vực gần cánh cửa trắng, giữ nguyên nguyên tắc an toàn và không tự ý bước qua ngưỡng. Lượt kiểm thử $N.\"}" \
              -o "$OUT"
            jq -e '.saved == true' "$OUT" >/dev/null
            jq -e --argjson expected "$EXPECTED" '.state.turn == $expected' "$OUT" >/dev/null
            printf 'turn_%s=%s storage=%s saved=%s log_len=%s\n' \
              "$N" \
              "$(jq -r '.state.turn' "$OUT")" \
              "$(jq -r '.storage' "$OUT")" \
              "$(jq -r '.saved' "$OUT")" \
              "$(jq -r '.state.log | length' "$OUT")"
          done

          EXPECTED_FINAL=$((BASE_TURN + 3))
          curl --fail-with-body -sS -c "$COOKIE" -b "$COOKIE" "$BASE/api/game-state" -o "$FINAL"
          jq -e --argjson expected "$EXPECTED_FINAL" '.state.turn == $expected' "$FINAL" >/dev/null
          jq -e '.storage != "preview" and .storage != "memory"' "$FINAL" >/dev/null
          FINAL_REV="$(jq -r '.state.revision' "$FINAL")"
          FINAL_STORAGE="$(jq -r '.storage' "$FINAL")"
          FINAL_LOG_LEN="$(jq -r '.state.log | length' "$FINAL")"
          printf 'final_turn=%s final_storage=%s final_log_len=%s\n' \
            "$(jq -r '.state.turn' "$FINAL")" "$FINAL_STORAGE" "$FINAL_LOG_LEN"

          sleep 3
          curl --fail-with-body -sS -b "$COOKIE" "$BASE/api/game-state" -o "$REOPEN"
          jq -e --argjson expected "$EXPECTED_FINAL" '.state.turn == $expected' "$REOPEN" >/dev/null
          jq -e --arg rev "$FINAL_REV" '.state.revision == $rev' "$REOPEN" >/dev/null
          jq -e --arg storage "$FINAL_STORAGE" '.storage == $storage' "$REOPEN" >/dev/null

          STATUS="$(curl -sS -o "$RUNNER_TEMP/stale.json" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/game-state" \
            --data "$(jq -cn --arg old \"$OLD_REV\" --argjson state \"$(jq -c '.state' "$FINAL")\" '{state:$state,expectedRevision:$old}')")"
          test "$STATUS" = '409'

          SAVE_STATUS="$(curl --fail-with-body -sS -o "$RUNNER_TEMP/save.json" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -H 'Content-Type: application/json' \
            -X POST "$BASE/api/game-state" \
            --data "$(jq -cn --arg rev \"$FINAL_REV\" --argjson state \"$(jq -c '.state' "$FINAL")\" '{state:$state,expectedRevision:$rev}')")"
          test "$SAVE_STATUS" = '200'
          SAVE_REV="$(jq -r '.state.revision' "$RUNNER_TEMP/save.json")"
          curl --fail-with-body -sS -b "$COOKIE" "$BASE/api/game-state" -o "$RUNNER_TEMP/load-after-save.json"
          jq -e --arg rev "$SAVE_REV" '.state.revision == $rev' "$RUNNER_TEMP/load-after-save.json" >/dev/null
          jq -e --argjson expected "$EXPECTED_FINAL" '.state.turn == $expected' "$RUNNER_TEMP/load-after-save.json" >/dev/null
          printf 'manual_save_http=%s load_turn=%s\n' "$SAVE_STATUS" "$(jq -r '.state.turn' "$RUNNER_TEMP/load-after-save.json")"
