name: backroom-prod-persistence-test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://backroom-rose.vercel.app
    steps:
      - name: Exercise production save/load
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/production-test-report.txt"
          SESSION_ID="$(cat /proc/sys/kernel/random/uuid)"
          COOKIE="backroom_session=$SESSION_ID"
          RESULT="FAILED"; STAGE="boot"
          RESET_TURN="?"; RESET_SAVED="?"
          TURN1="?"; TURN2="?"; TURN3="?"; LOG_LEN="?"; STORAGE="?"; REOPEN_TURN="?"; SAVE_HTTP="?"; STALE_HTTP="?"

          publish_report() {
            local exit_code="$1"
            {
              echo "status=$RESULT"
              echo "stage=$STAGE"
              echo "session_id=$SESSION_ID"
              echo "reset_turn=$RESET_TURN"
              echo "reset_saved=$RESET_SAVED"
              echo "turn_1=$TURN1"
              echo "turn_2=$TURN2"
              echo "turn_3=$TURN3"
              echo "log_len=$LOG_LEN"
              echo "storage=$STORAGE"
              echo "reopen_turn=$REOPEN_TURN"
              echo "manual_save_http=$SAVE_HTTP"
              echo "stale_revision_http=$STALE_HTTP"
              echo "completed_at=$(date -u +%FT%TZ)"
            } > "$REPORT"

            WORK="$RUNNER_TEMP/e2e-results"
            rm -rf "$WORK"
            mkdir -p "$WORK"
            cd "$WORK"
            git init -q
            git checkout -q --orphan e2e-results
            git config user.name "backroom-e2e"
            git config user.email "actions@users.noreply.github.com"
            cp "$REPORT" production-test-report.txt
            git add production-test-report.txt
            git commit -q -m "test: production persistence result [skip e2e]"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q -f origin HEAD:e2e-results
            exit "$exit_code"
          }
          trap 'code=$?; publish_report "$code"' EXIT

          STAGE="wait-production"
          READY=0
          for TRY in $(seq 1 80); do
            HEADERS="$RUNNER_TEMP/health.headers"
            CODE="$(curl -sS -D "$HEADERS" -o "$RUNNER_TEMP/health.json" -w '%{http_code}' -H "Cookie: $COOKIE" "$BASE/api/game-state" || true)"
            BUILD="$(awk 'BEGIN{IGNORECASE=1} /^x-backroom-build:/ {gsub(/\r/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$HEADERS" 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && [ "$BUILD" = "$EXPECTED_BUILD" ] && jq -e '.storage == "vercel-runtime-cache" or .storage == "neon-postgres"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 3
          done
          test "$READY" = "1"

          STAGE="reset"
          RESET="$RUNNER_TEMP/reset.json"
          curl --fail-with-body -sS -H "Cookie: $COOKIE" -H 'Content-Type: application/json' \
            -X POST "$BASE/api/game-state" --data '{"reset":true}' -o "$RESET"
          RESET_TURN="$(jq -r '.state.turn // "missing"' "$RESET")"
          RESET_SAVED="$(jq -r '.saved // "missing"' "$RESET")"
          RESET_REV="$(jq -r '.state.revision // empty' "$RESET")"
          test "$RESET_TURN" = "0"
          test "$RESET_SAVED" = "true"
          test -n "$RESET_REV"

          for N in 1 2 3; do
            STAGE="game-turn-$N"
            OUT="$RUNNER_TEMP/turn-$N.json"
            curl --fail-with-body -sS -H "Cookie: $COOKIE" -H 'Content-Type: application/json' \
              -X POST "$BASE/api/game-turn" \
              --data "{\"action\":\"Production persistence test turn $N. Reply briefly. Do not load canon.\"}" \
              -o "$OUT"
            jq -e '.saved == true' "$OUT" >/dev/null
            jq -e --argjson n "$N" '.state.turn == $n' "$OUT" >/dev/null
            case "$N" in
              1) TURN1="$(jq -r '.state.turn' "$OUT")" ;;
              2) TURN2="$(jq -r '.state.turn' "$OUT")" ;;
              3) TURN3="$(jq -r '.state.turn' "$OUT")" ;;
            esac
          done

          STAGE="final-load"
          FINAL="$RUNNER_TEMP/final.json"
          curl --fail-with-body -sS -H "Cookie: $COOKIE" "$BASE/api/game-state" -o "$FINAL"
          jq -e '.state.turn == 3' "$FINAL" >/dev/null
          jq -e '.storage != "preview"' "$FINAL" >/dev/null
          jq -e '.state.log | length >= 7' "$FINAL" >/dev/null
          FINAL_REV="$(jq -r '.state.revision' "$FINAL")"
          STORAGE="$(jq -r '.storage' "$FINAL")"
          LOG_LEN="$(jq -r '.state.log | length' "$FINAL")"

          STAGE="reopen"
          sleep 2
          REOPEN="$RUNNER_TEMP/reopen.json"
          curl --fail-with-body -sS -H "Cookie: $COOKIE" "$BASE/api/game-state" -o "$REOPEN"
          jq -e --arg rev "$FINAL_REV" '.state.turn == 3 and .state.revision == $rev' "$REOPEN" >/dev/null
          REOPEN_TURN="$(jq -r '.state.turn' "$REOPEN")"

          STAGE="stale-write"
          STALE_HTTP="$(curl -sS -o "$RUNNER_TEMP/stale.json" -w '%{http_code}' \
            -H "Cookie: $COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/api/game-state" \
            --data "$(jq -cn --arg rev "$RESET_REV" --argjson state "$(jq -c '.state' "$FINAL")" '{state:$state,expectedRevision:$rev}')")"
          test "$STALE_HTTP" = "409"

          STAGE="manual-save-load"
          SAVE_HTTP="$(curl --fail-with-body -sS -o "$RUNNER_TEMP/save.json" -w '%{http_code}' \
            -H "Cookie: $COOKIE" -H 'Content-Type: application/json' -X POST "$BASE/api/game-state" \
            --data "$(jq -cn --arg rev "$FINAL_REV" --argjson state "$(jq -c '.state' "$FINAL")" '{state:$state,expectedRevision:$rev}')")"
          test "$SAVE_HTTP" = "200"
          SAVE_REV="$(jq -r '.state.revision' "$RUNNER_TEMP/save.json")"
          curl --fail-with-body -sS -H "Cookie: $COOKIE" "$BASE/api/game-state" -o "$RUNNER_TEMP/load-after-save.json"
          jq -e --arg rev "$SAVE_REV" '.state.turn == 3 and .state.revision == $rev' "$RUNNER_TEMP/load-after-save.json" >/dev/null

          RESULT="PASSED"; STAGE="complete"
          trap - EXIT
          publish_report 0
