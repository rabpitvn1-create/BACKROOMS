name: Verify Healing Items

on:
  push:
    branches: [feat/healing-items]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-healing-items.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/verify-healing-items.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
      LUNA_BASE_URL: https://api.vilao.ai/v1
      LUNA_MODEL: ${{ secrets.LUNA_MODEL }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply complete Android runtime patch chain
        id: patch_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts=(patch-provider-status.py patch-luna-text.py patch-level-snapshot-backgrounds.py patch-snapshot-fallback.py patch-kai-hd-continuous.py patch-kai-png-preferred.py patch-kai-codex.py patch-r06-source-marker.py patch-drive-canon-gameplay.py patch-inventory-persistence.py patch-ai-orchestrator.py patch-state-op-hardening.py patch-gemini-health-pool.py patch-conditional-audit.py patch-audit-validated-risk.py patch-gameplay-parity-final.py patch-final-authority-hardening.py patch-rejected-op-repair-final.py patch-kai-resource-policy-final.py patch-provider-deadline-final.py patch-gemini-model-matrix-final.py patch-java-compile-hardening.py patch-save-controls-final.py patch-hard-mode-label.py patch-snapshot-unconfigured.py patch-game-state-core-bridge.py patch-character-inventory-ui.py patch-character-detail-avatar-fallback.py patch-progression-snapshot-equipment.py)
          for script in "${scripts[@]}"; do
            echo "==> $script"
            python3 "android-apk/$script"
          done

      - name: Verify healing contracts and final diff
        id: contracts
        if: steps.patch_chain.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android-apk')
          core = root / 'app/src/main/java/com/rabpit/backroom/core'
          healing = (core / 'HealingItems.kt').read_text(encoding='utf-8')
          item_content = (core / 'ItemContent.kt').read_text(encoding='utf-8')
          engines = (core / 'Engines.kt').read_text(encoding='utf-8')
          main = (root / 'app/src/main/java/com/rabpit/backroom/MainActivity.java').read_text(encoding='utf-8')
          test = (root / 'app/src/test/java/com/rabpit/backroom/core/HealingItemTest.kt').read_text(encoding='utf-8')
          chain = (root / 'patch-inventory-capacity-final-fix.py').read_text(encoding='utf-8')
          catalog = (core / 'ItemCatalog.kt').read_text(encoding='utf-8')

          for marker in (
              'const val BANDAGE_HEAL_HP = 15',
              'const val ANTISEPTIC_HEAL_HP = 10',
              'const val DROP_ROLL_KEY = "official-item-pool"',
              'HealingItems.normalize(item)?.let { return it }',
              'OfficialItemEffects owns all healing for the 11-item catalog',
              'CharacterStatEngine.setCurrentHp',
              '"healing_target_defeated"',
              'HEALING ITEM HARD LOCK:',
              'class HealingItemTest',
              'runpy.run_path(str(ROOT / "patch-healing-items.py"), run_name="__main__")',
          ):
              assert marker in healing + item_content + engines + main + test + chain + catalog, marker

          assert 'thresholdRoll("bandage"' not in main
          assert 'thresholdRoll("antiseptic"' not in main
          assert 'healingLoot' not in main
          assert 'const val BANDAGE_HEAL_HP = 10' not in healing
          assert 'const val ANTISEPTIC_HEAL_HP = 20' not in healing
          assert catalog.count('OfficialItem(') == 12  # data-class constructor + exactly 11 catalog entries
          assert 'ammo' not in '\n'.join(line.lower() for line in catalog.splitlines() if 'OfficialItem(' in line)
          assert 'int[] lootThresholds = {35, 120, 100, 150, 180, 100, 45}' in main
          PY
          git diff --check

      - uses: actions/setup-java@v5
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        id: android_build
        if: steps.patch_chain.outcome == 'success' && steps.contracts.outcome == 'success'
        continue-on-error: true
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Enforce pre-merge green gate
        if: always()
        run: |
          test "${{ steps.patch_chain.outcome }}" = "success"
          test "${{ steps.contracts.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
