name: BACKROOMS Gemini Provider Lock

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: read

jobs:
  gemini-provider-lock:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Gemini is intentionally runtime-locked
        shell: bash
        run: |
          set -euo pipefail
          test -s android-apk/patch-provider-haku-luna-lock-gemini-final.py
          grep -q 'GEMINI_RUNTIME_ENABLED = false' android-apk/patch-provider-haku-luna-lock-gemini-final.py
          grep -q 'patch-provider-haku-luna-lock-gemini-final.py' android-apk/ci_apply_runtime_patches.py
          echo 'Gemini credentials remain configured, but no live Gemini probe is executed while runtime lock is active.'
