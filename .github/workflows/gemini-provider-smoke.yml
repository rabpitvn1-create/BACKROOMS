name: BACKROOMS Gemini High Priority

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: read

jobs:
  gemini-high-priority:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Gemini high-priority runtime authority
        shell: bash
        run: |
          set -euo pipefail
          test -s android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'GEMINI_RUNTIME_ENABLED = true' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'Math.min(6, keys.length)' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'this::geminiFoundationText' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'patch-gemini-foundation-authority-final.py' android-apk/ci_apply_runtime_patches.py
          grep -q 'buildConfigField "String", "GEMINI_API_KEY_6"' android-apk/app/build.gradle

      - name: Require active Gemini key pool
        shell: bash
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          if [[ -n "${GEMINI_API_KEY_6:-}" ]]; then
            echo 'Gemini K6 is provisioned.'
          else
            echo 'Gemini K6 slot is supported but not provisioned in this repository; K1-K5 remain active.'
          fi

      - name: Live smoke configured Gemini credentials
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent'
          payload='{"contents":[{"parts":[{"text":"Return exactly one JSON object with ok=true."}]}],"generationConfig":{"responseMimeType":"application/json","maxOutputTokens":32,"thinkingConfig":{"thinkingLevel":"low"}}}'
          names=(GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 GEMINI_API_KEY_6)
          passed=0
          max_attempts=5

          for index in "${!names[@]}"; do
            name="${names[$index]}"
            key="${!name:-}"
            [[ -n "$key" ]] || continue

            attempt=1
            while true; do
              output="/tmp/gemini-$index-$attempt.json"
              headers="/tmp/gemini-$index-$attempt.headers"
              if code=$(curl --silent --show-error \
                --connect-timeout 8 \
                --max-time 30 \
                --dump-header "$headers" \
                --output "$output" \
                --write-out '%{http_code}' \
                --request POST "$endpoint" \
                --header 'Content-Type: application/json' \
                --header "x-goog-api-key: $key" \
                --data "$payload"); then
                curl_status=0
              else
                curl_status=$?
                code=000
              fi

              if [[ "$code" =~ ^2 ]]; then
                passed=$((passed + 1))
                echo "Gemini credential K$((index + 1)) live smoke passed on attempt $attempt"
                break
              fi

              retryable=false
              if [[ "$curl_status" -ne 0 ]]; then
                retryable=true
              elif [[ "$code" =~ ^(408|429|500|502|503|504)$ ]]; then
                retryable=true
              fi

              if [[ "$retryable" == true && "$attempt" -lt "$max_attempts" ]]; then
                retry_after=$(awk 'BEGIN{IGNORECASE=1} /^Retry-After:[[:space:]]*[0-9]+/ {gsub("\r", "", $2); print $2; exit}' "$headers" 2>/dev/null || true)
                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  (( retry_after > 30 )) && retry_after=30
                  delay=$retry_after
                else
                  # Exponential backoff with bounded deterministic jitter: 2-18 seconds.
                  delay=$(( (1 << attempt) + ((index + attempt) % 3) ))
                fi
                echo "Gemini credential K$((index + 1)) transient smoke failure (HTTP $code, curl=$curl_status); retrying in ${delay}s"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi

              if [[ "$curl_status" -ne 0 ]]; then
                echo "Gemini credential K$((index + 1)) smoke failed with curl status $curl_status after $attempt attempt(s)"
              else
                echo "Gemini credential K$((index + 1)) smoke failed with HTTP $code after $attempt attempt(s)"
              fi
              exit 1
            done
          done

          test "$passed" -ge 5 || (echo "Expected at least five active Gemini credentials, got $passed" && exit 1)
