name: BACKROOMS Gemini High Priority

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/gemini-provider-smoke.yml"
      - ".github/workflows/build-backroom-apk.yml"

permissions:
  contents: read

jobs:
  gemini-high-priority:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Gemini high-priority runtime authority
        shell: bash
        run: |
          set -euo pipefail
          test -s android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'GEMINI_RUNTIME_ENABLED = true' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'Math.min(6, keys.length)' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'this::geminiFoundationText' android-apk/patch-gemini-foundation-authority-final.py
          grep -q 'patch-gemini-foundation-authority-final.py' android-apk/ci_apply_runtime_patches.py
          grep -q 'buildConfigField "String", "GEMINI_API_KEY_6"' android-apk/app/build.gradle

      - name: Require active Gemini key pool
        shell: bash
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5; do
            test -n "${!name:-}" || (echo "Missing GitHub Secret: $name" && exit 1)
          done
          if [[ -n "${GEMINI_API_KEY_6:-}" ]]; then
            echo 'Gemini K6 is provisioned.'
          else
            echo 'Gemini K6 slot is supported but not provisioned in this repository; K1-K5 remain active.'
          fi

      - name: Verify Gemini credentials and live provider path
        shell: bash
        run: |
          set -euo pipefail
          model_endpoint='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash'
          generation_endpoint='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent'
          payload='{"contents":[{"parts":[{"text":"Return exactly one JSON object with ok=true."}]}],"generationConfig":{"responseMimeType":"application/json","maxOutputTokens":32,"thinkingConfig":{"thinkingLevel":"low"}}}'
          names=(GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_API_KEY_5 GEMINI_API_KEY_6)
          configured=0
          metadata_success=0
          live_success=0
          transient_live=0

          for name in "${names[@]}"; do
            [[ -n "${!name:-}" ]] && configured=$((configured + 1))
          done
          test "$configured" -ge 5 || (echo "Expected at least five configured Gemini credentials, got $configured" && exit 1)

          # Validate credential/model access without consuming generation quota.
          for index in "${!names[@]}"; do
            name="${names[$index]}"
            key="${!name:-}"
            [[ -n "$key" ]] || continue
            if code=$(curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "x-goog-api-key: $key" \
              "$model_endpoint"); then
              curl_status=0
            else
              curl_status=$?
              code=000
            fi

            if [[ "$code" =~ ^2 ]]; then
              metadata_success=$((metadata_success + 1))
              echo "Gemini K$((index + 1)) credential/model metadata probe passed"
              continue
            fi

            if [[ "$curl_status" -ne 0 || "$code" =~ ^(408|429|500|502|503|504)$ ]]; then
              echo "Gemini K$((index + 1)) metadata probe transiently unavailable (HTTP $code, curl=$curl_status)"
              continue
            fi

            echo "Gemini K$((index + 1)) credential/model metadata probe failed permanently with HTTP $code"
            exit 1
          done

          test "$metadata_success" -ge 1 || (echo "No configured Gemini credential could verify model access" && exit 1)

          # One generation attempt per configured slot is enough to exercise runtime-style pool failover.
          # Do not hammer 429s: Gemini rate limits can be project-scoped, so retries may only extend throttling.
          for index in "${!names[@]}"; do
            name="${names[$index]}"
            key="${!name:-}"
            [[ -n "$key" ]] || continue
            if code=$(curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request POST "$generation_endpoint" \
              --header 'Content-Type: application/json' \
              --header "x-goog-api-key: $key" \
              --data "$payload"); then
              curl_status=0
            else
              curl_status=$?
              code=000
            fi

            if [[ "$code" =~ ^2 ]]; then
              live_success=1
              echo "Gemini credential pool live generation passed via K$((index + 1))"
              break
            fi

            if [[ "$curl_status" -ne 0 || "$code" =~ ^(408|429|500|502|503|504)$ ]]; then
              transient_live=$((transient_live + 1))
              echo "Gemini K$((index + 1)) live generation transiently unavailable (HTTP $code, curl=$curl_status); trying next configured slot"
              continue
            fi

            echo "Gemini K$((index + 1)) live generation failed permanently with HTTP $code"
            exit 1
          done

          if [[ "$live_success" -eq 1 ]]; then
            exit 0
          fi

          if [[ "$transient_live" -eq "$configured" ]]; then
            echo '::warning::Gemini credentials and gemini-3.6-flash access are valid, but every configured generation slot is temporarily throttled/unavailable. Treating provider-wide transient availability as non-regression.'
            exit 0
          fi

          echo 'Gemini live provider path did not succeed and was not uniformly transient.'
          exit 1
