name: Publish Backroom Android Debug

on:
  push:
    branches: [main]
    paths:
      - "android-apk/app/build.gradle"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backroom-debug-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rabpitvn1-create/BACKROOMS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check generated Android source and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android-apk/patch-canon-runtime-2.py android-apk/patch-nam-lan-followers.py android-apk/patch-level-travel.py
          python3 android-apk/patch-canon-runtime-2.py
          python3 android-apk/patch-nam-lan-followers.py
          python3 android-apk/patch-level-travel.py
          git diff --exit-code -- android-apk/app/src/main
          node --test android-apk/tests/lucia-visuals.test.cjs android-apk/tests/named-follower-visuals.test.cjs android-apk/tests/party-combat-choice.test.cjs
          node android-apk/tests/level-travel-ui.test.cjs
      - name: Run Android JVM regression suite
        working-directory: android-apk
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish GitHub Release and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep 'versionName' android-apk/app/build.gradle | head -n 1 | cut -d "'" -f 2)
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo 'Invalid versionName'; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing overwrite"
            exit 1
          fi
          APK=android-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" "Backroom-$VERSION.apk"
          sha256sum "Backroom-$VERSION.apk" > "Backroom-$VERSION.apk.sha256"
          cat > release-notes.md <<'NOTES'
          Backroom Android Debug — gameplay integration release.
          - Core-owned Level Travel: random fresh Level 0–10 and three consecutive 50% exit successes.
          - Core-owned world loot, validated pickup, and whole-unit consumables.
          - Canon equipment separated from carried Inventory, including Huyết Ma modules.
          - Named follower integration and Canon Runtime corrections retained.

          Debug APK for testing; not a signed production build.
          NOTES
          gh release create "$TAG" "Backroom-$VERSION.apk" "Backroom-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "Backroom $VERSION Debug" --notes-file release-notes.md
