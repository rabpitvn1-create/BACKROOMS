name: Refresh epsilon original snapshots

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-epsilon-originals.yml'
      - '.github/scripts/refresh_epsilon_originals.py'

permissions:
  contents: write

jobs:
  refresh-epsilon-originals:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/epsilon-original-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact Drive originals
        shell: bash
        run: |
          set -euo pipefail
          dir='android-apk/app/src/main/assets/level_snapshots'
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1_6KvvP01DEU5QkVnZpUV8FHlHWngTPiX&export=download&confirm=t' -o "$dir/level_epsilon_1.webp"
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1gxlZdKKyaxPKYUbsfwE3RWKPbjd9qsRG&export=download&confirm=t' -o "$dir/level_epsilon_2.webp"
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1ZdUtygeJ8vmcziF-5xVromhMJQReTkZL&export=download&confirm=t' -o "$dir/level_epsilon_3.webp"
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1KxyS6Hy3W3q5A7i_CaM2YkL4z8jUDsHe&export=download&confirm=t' -o "$dir/level_epsilon_4.webp"
          echo 'a7270abc3995d7944ae87101e584b5af1d78edfd54f55ae8ee644d14957f0452  android-apk/app/src/main/assets/level_snapshots/level_epsilon_1.webp' | sha256sum -c -
          echo '52fcd023419ae4b1df1d957309479a73a71672184a457deb71b5f6121acf4a23  android-apk/app/src/main/assets/level_snapshots/level_epsilon_2.webp' | sha256sum -c -
          echo 'f1c1574ba1402b690c565c3d9ab3ea46694a37a2077235d855644418643ed5e7  android-apk/app/src/main/assets/level_snapshots/level_epsilon_3.webp' | sha256sum -c -
          echo '6b3f541dbfbc89b604ab187656666111a4b845fc95bcd026762721cad0cec082  android-apk/app/src/main/assets/level_snapshots/level_epsilon_4.webp' | sha256sum -c -

      - name: Update snapshot authority and remove old epsilon assets
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/refresh_epsilon_originals.py
          git rm -f \
            android-apk/app/src/main/assets/level_snapshots/area_01_epsilon_trusted_01.webp \
            android-apk/app/src/main/assets/level_snapshots/area_01_epsilon_trusted_02.webp \
            android-apk/app/src/main/assets/level_snapshots/area_01_epsilon_trusted_03.webp \
            android-apk/app/src/main/assets/level_snapshots/area_01_epsilon_trusted_04.webp
          git rm -f .github/workflows/refresh-epsilon-originals.yml .github/scripts/refresh_epsilon_originals.py
          git add android-apk/patch-level-snapshot-backgrounds.py \
            android-apk/app/src/main/assets/level_snapshots/SOURCES.md \
            android-apk/app/src/main/assets/level_snapshots/level_epsilon_1.webp \
            android-apk/app/src/main/assets/level_snapshots/level_epsilon_2.webp \
            android-apk/app/src/main/assets/level_snapshots/level_epsilon_3.webp \
            android-apk/app/src/main/assets/level_snapshots/level_epsilon_4.webp
          git diff --cached --check

      - name: Commit exact originals to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rabpitvn1-create'
          git config user.email 'rabpitvn1@gmail.com'
          git commit -m 'Use original-quality epsilon snapshots'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
