name: WorldDirector V2 Gemini Haku Distillation

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - "android-apk/ml/world_director_v2_recovery_once.txt"

permissions:
  contents: read

concurrency:
  group: world-director-v2-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  train-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAKU_API_KEY: ${{ secrets.HAKU_API_KEY }}
      # The first V2 run reserved 250 VND but hit the 55-minute runner timeout before flushing labels.
      # V1 max spent ~157.58 VND and the first V2 run could spend at most 3,695 VND, so this recovery
      # keeps its effective cap at 230 VND. Worst-case total remains below the user-authorized 4,103 VND.
      HAKU_V2_RECOVERY_BUDGET_VND: "240"
      HAKU_V2_RECOVERY_RESERVE_VND: "10"

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          path: work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work/android-apk/ml/requirements.txt

      - name: Preflight V2 recovery contract
        run: |
          set -euo pipefail
          test -n "${HAKU_API_KEY:-}" || (echo "Missing GitHub Secret: HAKU_API_KEY" && exit 1)
          test -s work/android-apk/ml/world_director_v2_gemini_labels.csv.gz.b64
          test -s work/android-apk/ml/world_director_v2_recovery_once.txt
          python -m py_compile \
            work/android-apk/ml/simulate_world_director_v2_trajectories.py \
            work/android-apk/ml/expand_world_director_v2_gemini_labels.py \
            work/android-apk/ml/haku_world_director_v2_teacher.py \
            work/android-apk/ml/haku_world_director_v2_recovery.py \
            work/android-apk/ml/build_world_director_v2_multiteacher_dataset.py \
            work/android-apk/ml/run_world_director_v2_candidate.py
          cd work/android-apk/ml
          python -m unittest -v test_world_director_v2_features.py

      - name: Decode compact Gemini V2 pack
        run: |
          python - <<'PY'
          import base64, csv, gzip, pathlib
          source = pathlib.Path('work/android-apk/ml/world_director_v2_gemini_labels.csv.gz.b64')
          target = pathlib.Path('work/android-apk/ml/world_director_v2_gemini_labels.csv')
          target.write_bytes(gzip.decompress(base64.b64decode(source.read_text(encoding='utf-8').strip())))
          with target.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
          assert reader.fieldnames == ['sampleId', 'proposal', 'confidence', 'reasonCode']
          assert len(rows) == 647
          assert len({row['sampleId'] for row in rows}) == 647
          print('Gemini V2 pack: 647 unique labels')
          PY

      - name: Generate deterministic V2 context universe
        run: |
          set -euo pipefail
          cd work/android-apk/ml
          python simulate_world_director_v2_trajectories.py \
            --levels ../app/src/main/assets/levels \
            --runs 960 \
            --turns 120 \
            --history 16 \
            --history-positions 4 \
            --seed 2299 \
            --output "$GITHUB_WORKSPACE/world-director-v2-snapshots.jsonl" \
            --report "$GITHUB_WORKSPACE/world-director-v2-snapshot-report.json"

      - name: Reconstruct and verify Gemini V2 labels
        run: |
          set -euo pipefail
          python work/android-apk/ml/expand_world_director_v2_gemini_labels.py \
            --contexts world-director-v2-snapshots.jsonl \
            --labels work/android-apk/ml/world_director_v2_gemini_labels.csv \
            --output world-director-v2-gemini-expanded.jsonl \
            --report world-director-v2-gemini-expanded-report.json
          python - <<'PY'
          import json
          report = json.load(open('world-director-v2-gemini-expanded-report.json', encoding='utf-8'))
          assert report['labels'] == 647 and report['allIdsReproduced'] is True, report
          PY

      - name: Install LiteRT training dependencies
        run: python -m pip install --requirement work/android-apk/ml/requirements.txt

      - name: Recover Haku overlap within remaining reserve
        run: |
          set -euo pipefail
          PYTHONPATH=work/android-apk/ml python work/android-apk/ml/haku_world_director_v2_recovery.py \
            --input world-director-v2-snapshots.jsonl \
            --gemini-labels world-director-v2-gemini-expanded.jsonl \
            --output world-director-v2-haku-labels.jsonl \
            --report world-director-v2-haku-report.json \
            --model claude-haiku-4-5-20251001 \
            --batch-size 48 \
            --max-unique 768 \
            --max-output-tokens 1900 \
            --budget-vnd "$HAKU_V2_RECOVERY_BUDGET_VND" \
            --safety-reserve-vnd "$HAKU_V2_RECOVERY_RESERVE_VND" \
            --max-requests 12
          test -s world-director-v2-haku-labels.jsonl

      - name: Build conservative Gemini Haku consensus dataset
        run: |
          set -euo pipefail
          python work/android-apk/ml/build_world_director_v2_multiteacher_dataset.py \
            --gemini world-director-v2-gemini-expanded.jsonl \
            --haku world-director-v2-haku-labels.jsonl \
            --output world-director-v2-multiteacher-dataset.csv \
            --report world-director-v2-multiteacher-dataset-report.json

      - name: Build deterministic V1 seed anchor
        working-directory: work/android-apk/ml
        run: python build_director_dataset.py

      - name: Train and export artifact-only V2 LiteRT candidate
        env:
          PYTHONPATH: work/android-apk/ml
        run: |
          set -euo pipefail
          python work/android-apk/ml/run_world_director_v2_candidate.py \
            --teacher-dataset world-director-v2-multiteacher-dataset.csv \
            --seed-dataset work/android-apk/ml/director_dataset.csv \
            --output world-director-v2-candidate.tflite \
            --report world-director-v2-candidate-report.json
          test -s world-director-v2-candidate.tflite
          test $(stat -c%s world-director-v2-candidate.tflite) -le 5242880

      - name: Verify production remains untouched
        run: |
          set -euo pipefail
          test ! -e work/android-apk/app/src/main/assets/models/backrooms_director.tflite
          git -C work diff --exit-code -- android-apk/app/src/main/assets/models
          python - <<'PY'
          import json
          report = json.load(open('world-director-v2-candidate-report.json', encoding='utf-8'))
          assert report.get('productionAssetModified') is False
          assert report.get('featureCount') == 16384
          print('promotionEligible=', report.get('promotionEligible'))
          PY

      - name: Summarize V2 recovery
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, os
          out = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = ['## WorldDirector V2 recovery']
          for path, title in [
              ('world-director-v2-snapshot-report.json', 'Context universe'),
              ('world-director-v2-gemini-expanded-report.json', 'Gemini'),
              ('world-director-v2-haku-report.json', 'Haku recovery'),
              ('world-director-v2-multiteacher-dataset-report.json', 'Consensus'),
              ('world-director-v2-candidate-report.json', 'Candidate'),
          ]:
              p = pathlib.Path(path)
              if p.exists():
                  lines += [f'### {title}', '```json', json.dumps(json.loads(p.read_text()), ensure_ascii=False, indent=2)[:12000], '```']
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload V2 recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-director-v2-multiteacher-candidate
          path: |
            world-director-v2-snapshot-report.json
            world-director-v2-gemini-expanded-report.json
            world-director-v2-haku-labels.jsonl
            world-director-v2-haku-report.json
            world-director-v2-multiteacher-dataset.csv
            world-director-v2-multiteacher-dataset-report.json
            world-director-v2-candidate.tflite
            world-director-v2-candidate-report.json
          if-no-files-found: warn
          retention-days: 30
