name: GM action and touch QA
on:
  push:
    branches: [gm-action-feedback-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare original Core
        run: python3 scripts/prepare_web_engine.py
      - name: Compile Core
        run: mvn -B -f engine/pom.xml package
      - name: Verify Core gameplay
        run: node scripts/test_engine.cjs
      - name: Stage fixture build
        run: python3 scripts/build_pages.py --test-config
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify GM action latency, touch and gameplay
        run: |
          mkdir -p build/test-host
          ln -s "$GITHUB_WORKSPACE/build/pages" build/test-host/Backrooms
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build/test-host > build/browser-server.log 2>&1 &
          node scripts/test_action_feedback.cjs
          node scripts/test_pages.cjs
          node scripts/test_combat_pages.cjs
          node scripts/test_offline_art.cjs
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-action-feedback-screenshots
          path: build/gm-feedback-*.png
          if-no-files-found: ignore
