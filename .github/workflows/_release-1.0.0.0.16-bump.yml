name: Prepare release 1.0.0.0.16

on:
  push:
    branches:
      - release/1.0.0.0.16
    paths:
      - .github/workflows/_release-1.0.0.0.16-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0.0.16
          fetch-depth: 0

      - name: Bump release contracts without live API smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {old!r}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('android-apk/app/build.gradle', 'versionCode 123', 'versionCode 124')
          replace_once('android-apk/app/build.gradle', "versionName '1.0.0.0.15'", "versionName '1.0.0.0.16'")
          replace_once('android-apk/ci_verify_runtime_contracts.py', '("versionCode 123", gradle), ("versionName \'1.0.0.0.15\'", gradle),', '("versionCode 124", gradle), ("versionName \'1.0.0.0.16\'", gradle),')

          packaged = Path('android-apk/ci_verify_packaged_apk.sh')
          text = packaged.read_text(encoding='utf-8')
          if text.count('1.0.0.0.15') < 2 or "versionCode='123'" not in text:
              raise SystemExit('packaged APK version anchors missing')
          text = text.replace('1.0.0.0.15', '1.0.0.0.16').replace("versionCode='123'", "versionCode='124'")
          packaged.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/build-backroom-apk.yml')
          text = workflow.read_text(encoding='utf-8')
          if text.count('1.0.0.0.15') < 8 or 'versionCode 123' not in text:
              raise SystemExit('release workflow version anchors missing')
          text = text.replace('1.0.0.0.15', '1.0.0.0.16').replace('versionCode 123', 'versionCode 124')
          workflow.write_text(text, encoding='utf-8')

          smoke = Path('.github/workflows/gemini-provider-smoke.yml')
          text = smoke.read_text(encoding='utf-8')
          anchor = '      - name: Verify Gemini credentials and live provider path\n        shell: bash\n'
          replacement = (
              '      - name: Verify Gemini credentials and live provider path\n'
              "        if: ${{ !((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Bump release to '))) }}\n"
              '        shell: bash\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('Gemini live API smoke anchor missing')
          smoke.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          Path('android-apk/RELEASE_NOTES_1.0.0.0.16.md').write_text('''# Backroom 1.0.0.0.16 Debug

Bản phát hành này đóng gói trạng thái `main` mới nhất sau `1.0.0.0.15`.

- Phiên bản hiển thị: **1.0.0.0.16**.
- Android versionCode: **124**.
- Bao gồm PR #360: sửa state gate của Lucia để `identityKnown` được giữ đúng ở lượt first-contact và lời mời ở lượt sau có thể commit Lucia vào Party.
- Giữ nguyên luật: first contact không tự tuyển Lucia; gặp + gia nhập trong cùng lượt vẫn bị chặn; Party ADD cần danh tính đã commit từ lượt trước và lời mời/chấp nhận rõ ràng.
- Release CI vẫn chạy runtime patch audit, runtime contracts, Kotlin tests, APK build và packaged APK verification.
- Live Gemini provider API smoke được bỏ qua cho release-bump PR và merge push tương ứng để không tiêu tốn API quota; static Gemini authority/key-pool checks vẫn chạy.
''', encoding='utf-8')
          PY

          rm .github/workflows/_release-1.0.0.0.16-bump.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bump release to 1.0.0.0.16'
          git push origin HEAD:release/1.0.0.0.16
